<style>
  /* ---------- paleta i baza ---------- */
  :root{
    --paper:#f7f4ec; --card:#fffdf8; --ink:#20271f; --muted:#7c8377; --line:#e4dfd2;
    --forest:#33503f; --honey:#c47f2c; --honey-soft:#f6e9d4;
    --easy:#3f9e57; --med:#d99a1c; --hard:#cf4a3a;
    --warn-ink:#8a4a12; --warn-bg:#fbe8cf;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{max-width:520px;margin:0 auto;padding:0 16px 48px;}

  /* ---------- pasek środowiska testowego ----------
     Ma być nie do przeoczenia i nie do pomylenia z niczym w aplikacji:
     pasy zamiast płaskiego tła, przyklejony do góry przy przewijaniu,
     na pełną szerokość (body ma padding 16px, stąd ujemne marginesy). */
  .envbar{position:sticky;top:0;z-index:50;margin:0 -16px;padding:8px 16px;
    background:repeating-linear-gradient(135deg,#7a3f0e,#7a3f0e 11px,#9c5416 11px,#9c5416 22px);
    color:#fff;font-size:12px;font-weight:800;letter-spacing:.05em;text-align:center;
    text-transform:uppercase;line-height:1.35;}

  /* ---------- nagłówek ---------- */
  header{padding:16px 2px 4px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--forest);font-weight:700;}
  .titlerow{display:flex;align-items:center;gap:10px;}
  h1{font-size:26px;letter-spacing:-.02em;margin:3px 0 6px;font-weight:800;flex:1;}
  /* numer wersji przy nazwie (1.3) — ten sam co w package.json, pilnuje T5; od 1.3.1 to zarazem przycisk
     „Co nowego?" (decyzja właściciela, wersja A z czterech makiet: na górze nic nie dochodzi) */
  h1 .ver{font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--forest);background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:4px 10px;margin-left:6px;vertical-align:4px;cursor:pointer;
    white-space:nowrap;touch-action:manipulation;}
  .gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    font-size:17px;cursor:pointer;flex:none;}
  .gear.on{background:var(--forest);color:#fff;border-color:var(--forest);}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .reset-note{display:inline-flex;align-items:center;gap:5px;background:#e2ebe3;color:var(--forest);
    font-weight:600;padding:3px 9px;border-radius:20px;font-size:12px;}

  /* ---------- „Co nowego" (1.3.1) ----------
     Pasek „Nowa wersja" raz na telefon i lista zmian na cały ekran, nad paskiem zaznaczania (60),
     pod dymkiem „Zapisuję…" (70) i komunikatem. */
  .wnbanner{display:flex;align-items:center;gap:8px;margin:12px 0 0;padding:8px 6px 8px 12px;background:var(--honey-soft);
    border:1px solid #ecd3ad;border-radius:12px;font-size:13px;color:var(--ink);line-height:1.35;}
  .wnbanner > span{flex:1;}
  .wnbanner .btn{padding:6px 11px;font-size:13px;}
  .wnx{border:0;background:none;font-family:inherit;font-size:16px;color:var(--muted);padding:4px 6px;cursor:pointer;}
  .wn{position:fixed;inset:0;z-index:65;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;}
  body.wn-open{overflow:hidden;}
  .wn-in{max-width:520px;margin:0 auto;padding:0 16px 40px;}
  .wn-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:14px 2px 10px;background:var(--paper);
    border-bottom:1px solid var(--line);}
  .wn-head h2{flex:1;font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .wn-ver{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;margin-top:12px;}
  .wn-ver h3{font-size:15.5px;font-weight:800;color:var(--forest);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .wn-date{font-size:12.5px;font-weight:600;color:var(--muted);}
  .wn-new{font-size:11px;font-weight:800;color:#fff;background:var(--honey);padding:2px 7px;border-radius:6px;align-self:center;}
  .wn-ver ul{display:block;margin:7px 0 0;padding-left:18px;list-style:disc;}
  .wn-ver li{font-size:14px;line-height:1.45;margin-top:5px;color:var(--ink);}
  .wn-admin{margin-top:11px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

  .pinrow{display:flex;gap:7px;margin:12px 0 0;}
  .pinrow input{flex:1;font-family:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--forest);
    border-radius:10px;outline:none;}
  .pinrow button{background:var(--forest);color:#fff;border:none;font-family:inherit;font-weight:700;
    padding:0 16px;border-radius:10px;cursor:pointer;}
  .pinerr{color:var(--hard);font-size:12.5px;margin-top:5px;font-weight:600;}

  /* ---------- wybór dnia ----------
     Strzałki duże, bo naciska się je w rękawicach i w biegu. Środek to też
     przycisk: dotknięcie wraca do bieżącego dnia, gdy się od niego odeszło. */
  .datebar{display:flex;align-items:stretch;gap:8px;margin:14px 0 4px;}
  .daynav{flex:none;width:52px;min-height:52px;border:1px solid var(--line);background:var(--card);
    border-radius:12px;color:var(--ink);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
  .daynav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;display:block;}
  .daynav:active{transform:scale(.96);}
  .daylabel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:6px 8px;
    font-family:inherit;cursor:pointer;touch-action:manipulation;}
  .daylabel .dayname{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .daylabel .dayrel{font-size:12px;font-weight:600;opacity:.8;}
  /* poza bieżącym dniem etykieta jaśnieje — widać od razu, że to nie „dziś" */
  .daylabel.away{background:var(--card);color:var(--ink);border-color:var(--line);}
  .daylabel.past{background:#ece8dd;color:var(--muted);border-color:var(--line);}
  .dayhint{margin:12px 2px 0;font-size:12.5px;color:var(--muted);font-weight:600;}

  /* ---------- zakładki prowadzącej i legenda ---------- */
  .tabs{display:flex;gap:6px;margin:8px 0 4px;}
  .tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .diflegend{display:flex;gap:14px;margin:10px 2px 2px;font-size:12px;color:var(--muted);}
  .diflegend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;}

  .count{margin:12px 2px 4px;font-size:13px;color:var(--muted);}
  .count b{color:var(--ink);font-weight:700;}

  /* ---------- psy innych grup (1.3) ----------
     Druga lista dnia, pod naszą: gruba kreska i nagłówek — nie da się jej wziąć za ciąg dalszy naszej. */
  .others{margin-top:26px;padding-top:12px;border-top:3px solid var(--ink);}
  .others h2{margin:0 2px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);}
  .others .count{margin-top:4px;}
  /* grupa psa w linijce z numerem i boksem (pełny kafelek listy innych grup, katalog) —
     neutralny łupek: inny niż trudności, kolory grup spacerowych i wolontariuszy */
  .teampill{font-size:11px;font-weight:800;color:#fff;background:#4a5a6a;padding:2px 8px;border-radius:6px;white-space:nowrap;}
  /* „Bierze G7" — spacer psa bierze jego własna grupa: obrysowany, żeby nie konkurował z „Zarezerwuj" */
  .btn.theirs{background:#fff;color:#4a5a6a;border:2px solid #4a5a6a;font-size:13.5px;padding:7px 12px;}
  .teamdone{font-size:13px;font-weight:700;color:#fff;background:#4a5a6a;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .teamrow{margin-top:7px;align-items:center;}
  .teamlbl{font-size:12.5px;font-weight:600;color:var(--muted);flex:none;}

  /* ---------- zadania na dziś ---------- */
  /* ramka zadań idzie za kafelkami psów: ten sam kształt i akcent z lewej */
  .tasksbox{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--forest);
    border-radius:12px;padding:12px 14px;}
  .tasksbox h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--forest);margin-bottom:4px;}
  .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .task:last-of-type{border-bottom:none;}
  .task .box{width:21px;height:21px;border:2px solid var(--forest);border-radius:7px;flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;}
  .task.done .box{background:var(--forest);}
  .task .txt{font-size:14.5px;flex:1;}
  .task.done .txt{text-decoration:line-through;text-decoration-color:#aeb8b0;color:var(--muted);}
  .age{font-size:11px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);padding:2px 8px;border-radius:6px;flex:none;}
  /* zadanie zaplanowane na później: widać je, ale odhacza się w jego dniu */
  .task.planned{cursor:default;}
  .task.planned .box{border-style:dashed;opacity:.55;}
  .plan{font-size:11px;font-weight:700;color:var(--forest);background:#e2ebe3;padding:2px 8px;border-radius:6px;flex:none;}
  .taskform{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
  .taskform input[type=text]{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--forest);
    border-radius:10px;background:#fff;color:var(--ink);outline:none;}
  .taskform-row{display:flex;align-items:center;gap:8px;}
  .taskform-row label{font-size:12.5px;color:var(--muted);font-weight:600;flex:none;}
  .taskform-row input[type=date]{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:8px 10px;
    border:1px solid #bcccbc;border-radius:9px;background:#fff;}

  /* ---------- lista psów ---------- */
  ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .dog{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;
    /* przytrzymanie kafelka to gest grupy — telefon nie może pod nie podpinać menu ani zaznaczania */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .dog input{-webkit-user-select:text;user-select:text;}
  .dog.walked{opacity:.6;}
  /* pies w drodze na serwer (tryb edycji, „Dodaj") — przerywana ramka, bez przycisków */
  .dog.adding{border-style:dashed;border-left-style:solid;opacity:.75;}
  .addnote{font-size:12px;font-weight:700;color:var(--muted);}
  /* zapis przepadł, a dane nie mogły wrócić do formularza — stuknięcie je oddaje (reAddDog) */
  .dog.adding.failed{opacity:1;background:var(--warn-bg);border-color:var(--warn-ink);cursor:pointer;}
  .dog.adding.failed .addnote{color:var(--warn-ink);}
  .addhint{margin-top:4px;font-size:12.5px;color:var(--warn-ink);}
  .row{display:flex;align-items:center;gap:10px;}
  .name{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .name.done{text-decoration:line-through;text-decoration-color:#aeb8b0;}
  .dogmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--muted);}
  .miss{font-size:11px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);padding:2px 8px;border-radius:6px;}
  .twice{font-size:11px;font-weight:700;color:var(--forest);background:#e2ebe3;padding:2px 8px;border-radius:6px;}
  .note{margin-top:6px;font-size:13px;color:#6b4a14;background:var(--honey-soft);
    padding:6px 10px;border-radius:8px;line-height:1.4;}
  .note .until{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;
    background:#e8e2d2;color:#7a6427;font-size:11px;font-weight:700;vertical-align:1px;}
  .dif{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .flex{flex:1;}
  .resv-pill{font-size:11px;font-weight:700;color:#6b4a14;background:var(--honey-soft);padding:2px 8px;border-radius:6px;}

  /* ---------- spacery grupowe ----------
     Kafelek grupy: blade tło i pasek z prawej w intensywnym kolorze tej samej grupy (--gc, styl
     w linii — kolor zależy od numeru grupy), z napisem GRUPA czytanym od dołu, jak grzbiet polskiej
     książki. Samo tło było w terenie słabo widać (feedback 1.1). Kafelki grupy stoją jednym blokiem.
     Pasek leży w prawym marginesie kafelka (18 px zamiast 14), a lewy margines oddaje te 4 px
     (10 zamiast 14) — na treść zostaje dokładnie tyle miejsca co w kafelku bez grupy. Każdy piksel
     mniej łamał kafelki odłączone na granicy do dwóch linijek (review PR #3: 375 px, 412 px), a pasek
     dołożony do szerokości (16 px) — już przy 412 px kafelek za kafelkiem. Cena: treść kafelka grupy
     zaczyna się 4 px bliżej lewej krawędzi. Kółko zaznaczania stoi nad paskiem, a stuknięcie przez
     pasek idzie do kafelka (przytrzymanie, zaznaczanie). */
  .dog.grouped{position:relative;border-right-color:var(--gc);padding-right:18px;padding-left:10px;}
  .dog.grouped::after{content:'GRUPA';position:absolute;top:0;bottom:0;right:0;width:14px;
    background:var(--gc);color:#fff;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;transform:rotate(180deg);border-radius:11px 0 0 11px;
    font-size:9px;font-weight:800;letter-spacing:.16em;pointer-events:none;}
  .grpwait{margin-top:6px;font-size:12px;font-weight:600;color:var(--muted);}
  /* Zaznaczanie nie zmienia układu kafelka ani o piksel: kółko leży na wierzchu,
     w rogu, a przyciski zostają na swoim miejscu — tylko bledną i nie reagują. */
  .dog.pick{cursor:pointer;position:relative;}
  .dog.pick .status,.dog.pick .grpwait{opacity:.35;pointer-events:none;}
  /* kafelek odłączony ma imię psa i „1/2" w tym samym wierszu co przyciski — bledną tylko
     opiekun i przyciski, a nazwa zaznaczanego kafelka zostaje czytelna (review) */
  .dog.pick.detached > .status{opacity:1;}
  .dog.pick.detached > .status > :not(.name):not(.slotno){opacity:.35;}
  .pickbox{position:absolute;z-index:1;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--ink);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}
  .dog.picked{box-shadow:0 0 0 2px var(--ink);}
  .dog.picked .pickbox{background:var(--ink);}
  .dog.nopick{opacity:.4;cursor:default;}
  /* kafelek główny psa na dwa spacery: kółko przy każdym polu 1/2, 2/2 — zaznacza TEN spacer */
  .slot.pick{cursor:pointer;}
  .slot.pick .status,.slot.pick .grpwait{opacity:.35;pointer-events:none;}
  .slot.picked{box-shadow:0 0 0 2px var(--ink);}
  .slot.picked .pickbox{background:var(--ink);}
  .slot.nopick{opacity:.4;cursor:default;}

  /* ---------- spacery psa na dwa spacery ----------
     Pola 1/2 i 2/2 są w jednym kafelku, ale każde osobno — z numerem i własnymi
     przyciskami, w JEDNYM wierszu. Spacer odłączony (w grupie gdzie indziej) to kafelek
     z samym wierszem: imię psa, numer spaceru, opiekun, przyciski. */
  .slot{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;
    padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
  .slot .status{margin-top:0;flex:1;min-width:0;gap:6px;}
  .slot .walk{padding:7px 10px;}
  .slot .ghost{padding:6px 5px;}
  .slot .entry{flex-basis:100%;margin-top:4px;}
  .slot .grpwait{flex-basis:100%;margin-top:0;}
  .slot.walked{opacity:.6;}
  .slotno{font-size:11px;font-weight:800;color:var(--forest);background:#e2ebe3;padding:2px 7px;border-radius:6px;flex:none;}
  .dog.detached{padding-top:9px;padding-bottom:9px;}
  .dog.detached > .status{margin-top:0;gap:6px;}
  .dog.detached > .status > .reserve{margin-left:auto;}
  .dog.detached .walk{padding:7px 10px;}
  .dog.detached .ghost{padding:6px 5px;}

  /* ---------- wolontariusz: kolor dnia ----------
     Nasycony kontur i kropka przy imieniu — celowo inna rodzina niż grupy (blade tło
     całego kafelka). Imię zostaje zwykłym ciemnym tekstem. */
  .vol{display:inline-flex;align-items:center;gap:6px;padding:1px 10px 1px 4px;border:2px solid var(--vc,#4b5563);
    border-radius:999px;background:#fff;color:var(--ink);font-weight:700;line-height:1.35;}
  .vol .vdot{width:10px;height:10px;border-radius:50%;background:var(--vc,#4b5563);flex:none;}

  /* ---------- dymek „Zapisuję…" / „Aktualizuję…" ----------
     Na dole ekranu, ciemny i duży — ma być widać, że stuknięcie zostało przyjęte. Na dole,
     bo tam są już komunikaty (toast), blisko kciuka, i nie zasłania daty u góry. Toast,
     który przyjdzie w tym czasie, staje nad dymkiem (body.busy-on), a przy zaznaczaniu
     grupy oba stoją nad paskiem na dole.
     Kropki: „." → „.." → „..." i od nowa (druga i trzecia pojawiają się po kolei). */
  .busy{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;
    display:inline-flex;align-items:baseline;padding:8px 16px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:700;letter-spacing:.01em;
    box-shadow:0 4px 16px rgba(0,0,0,.22);pointer-events:none;white-space:nowrap;}
  .busy.hidden{display:none;}
  .busy[data-kind="sort"]{background:var(--forest);}
  .busy .dots{display:inline-block;width:1.1em;text-align:left;}
  .busy .dots i{font-style:normal;}
  .busy .dots i:nth-child(2){animation:busyDot2 1.2s steps(1,end) infinite;}
  .busy .dots i:nth-child(3){animation:busyDot3 1.2s steps(1,end) infinite;}
  @keyframes busyDot2{0%{visibility:hidden}33.33%{visibility:visible}}
  @keyframes busyDot3{0%{visibility:hidden}66.66%{visibility:visible}}
  @media (prefers-reduced-motion: reduce){ .busy .dots i{animation:none;} }

  .selectbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);
    border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);}
  .selectbar .info{flex:1;font-size:13px;font-weight:700;color:var(--ink);}
  .selectbar .btn{padding:11px 14px;}
  body.selecting{padding-bottom:84px;}
  body.selecting .toast{bottom:84px;}
  body.selecting .busy{bottom:84px;}
  body.busy-on .toast{bottom:calc(74px + env(safe-area-inset-bottom));}
  body.selecting.busy-on .toast{bottom:136px;}

  /* ---------- przyciski ---------- */
  .btn{border:none;font-family:inherit;font-weight:700;cursor:pointer;border-radius:10px;
    transition:transform .05s;white-space:nowrap;}
  .btn:active{transform:scale(.96);}
  .btn[disabled]{opacity:.5;pointer-events:none;}
  .reserve{background:var(--honey);color:#fff;font-size:14px;padding:9px 15px;}
  .walk{background:var(--ink);color:#fff;font-size:13px;padding:8px 13px;}
  .ghost{background:transparent;color:var(--muted);font-size:12.5px;padding:6px 8px;}
  .del{background:transparent;color:var(--hard);font-size:13px;padding:6px 8px;font-weight:800;}
  .edit{background:transparent;color:var(--forest);font-size:14px;padding:6px 8px;}

  .status{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .who{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);}
  .who .dot{background:currentColor;width:8px;height:8px;}
  .spacer{margin-left:auto;}
  /* przyciski zarezerwowanego spaceru trzymają się razem: za wąsko — schodzą pod spód razem */
  .acts{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none;}

  /** Stan serwera do panelu. Nieudane pobranie mówi o sobie — wcześniej „Pobieram…" wisiało do końca. */
  function fetchDiag(){
    if(!state.admin) return;
    google.script.run
      .withSuccessHandler(res=>{ state.diag = res; if(state.view==='diag') safeRender(); })
      .withFailureHandler(err=>{
        state.diag = {failed: (err && err.message ? err.message.replace(/^Error:\s*/,'') : '') || 'brak połączenia'};
        if(state.view==='diag') safeRender();
      })
      .getDiagnostics(state.pin);
  }

  /**
   * Numer psa przy wpisie minionego dnia (wymóg: zrzuty historii idą do władz schroniska, S108).
   * Brak numeru = brak „nr" — serwer nie zgaduje (stary wpis, dwa psy o tym imieniu). Pies bez
   * imienia ma już numer w nazwie („#2077") — drugi raz go nie piszemy.
   */
  function histNr(e){
    const nr = String(e.ident == null ? '' : e.ident).trim();
    return nr && e.name !== '#' + nr ? ` <span class="nr">nr ${esc(nr)}</span>` : '';
  }

  /* ---------- e-mail z listą spacerów dla schroniska ----------
     Schronisko chce tylko listę psów z numerami i datą wyprowadzenia. W minionym dniu:
     „✉️ Wyślij e-mail" — link mailto: (mailHref), telefon otwiera aplikację pocztową z odbiorcą,
     tematem i treścią z panelu; „📋 Skopiuj treść" — zapas, gdy telefon poczty nie otworzy
     (np. przeglądarka WhatsAppa). [DATA] — dzień, [LISTA] — CSV „data,pies,numer", pies raz
     na dzień (dwa spacery to wciąż jeden pies), po imieniu. */
  const MAIL_MAX = 2000;                            // tyle, ile MAX_LEN.MAIL w Config.gs (S110b pilnuje obu)
  const MAIL_TO_MAX = 300;                          // tyle, ile MAX_LEN.MAIL_TO
  const MAIL_SUBJECT_MAX = 150;                     // tyle, ile MAX_LEN.MAIL_SUBJECT
  /** Pola panelu: szkic, a bez niego zapisane ustawienia. */
  function mailForm(){
    return state.mailDraft || {to: state.mailTo || '', subject: state.mailSubject || '', body: state.mailTemplate || ''};
  }
  /**
   * Czy w panelu stoi coś innego niż zapisane. Szkic przeżywa przerysowanie i wyjście z panelu
   * (state.mailDraft), więc bez tego napisu wyglądał jak zapisany, a historia używała dalej starych
   * ustawień (review PR #4). Napis i „Przywróć zapisane" przełączamy też w trakcie pisania.
   */
  function mailDirty(){
    const d = state.mailDraft;
    return !!d && (d.to !== (state.mailTo || '') || d.subject !== (state.mailSubject || '') || d.body !== (state.mailTemplate || ''));
  }
  /** Adres jak na serwerze (mailAddresses_): tylko zwykłe adresy — „?", „&", „#" rozbiłyby link mailto:. */
  const MAIL_ADDR = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  /** Te same reguły co setMailSettings na serwerze — komunikat od razu, nie po dwóch przelotach. '' = w porządku. */
  function mailProblem(f){
    const list = String(f.to || '').split(/[\s,;]+/).filter(Boolean);
    const bad = list.filter(a => !MAIL_ADDR.test(a))[0];
    if(bad) return 'To nie wygląda na adres e-mail: ' + bad;
    if(list.join(', ').length > MAIL_TO_MAX) return 'Za dużo odbiorców — najwyżej ' + MAIL_TO_MAX + ' znaków';
    if(String(f.subject || '').replace(/[\r\n]+/g, ' ').trim().length > MAIL_SUBJECT_MAX) return 'Temat jest za długi — najwyżej ' + MAIL_SUBJECT_MAX + ' znaków';
    const body = String(f.body || '');
    if(body.trim()){
      if(body.replace(/\r\n?/g, '\n').length > MAIL_MAX) return 'Treść maila jest za długa — najwyżej ' + MAIL_MAX + ' znaków';
      if(body.indexOf('[LISTA]') < 0) return 'W treści musi zostać [LISTA] — w to miejsce trafia lista psów';
    }
    return '';
  }
  /**
   * Link mailto: z gotowym mailem (RFC 6068): adresy po przecinku (serwer przepuszcza tylko zwykłe —
   * „@" zostaje czytelne dla każdej poczty), temat i treść zakodowane, końce linii w treści CRLF.
   */
  function mailHref(date){
    const to = String(state.mailTo || '').split(/[\s,;]+/).filter(Boolean).join(',');
    const subject = String(state.mailSubject || '').split('[DATA]').join(plDate(date));
    return 'mailto:' + to + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(mailText(date).replace(/\n/g, '\r\n'));
  }
  function showMailDirty(){
    const d = mailDirty();
    viewEl.querySelectorAll('.maildirty, [data-act="resetMail"]').forEach(el => el.classList.toggle('hidden', !d));
    invalidateHtml();                               // ręczna zmiana DOM — pełny render ma porównywać od nowa
  }
  function plDate(iso){ const p = String(iso).split('-'); return p.length===3 ? `${p[2]}.${p[1]}.${p[0]}` : String(iso); }
  function csvCell(v){ const s = String(v==null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function mailList(date){
    const seen = new Set(), dogs = [];
    (state.past[date] || []).forEach(e => {
      const nr = String(e.ident==null ? '' : e.ident).trim(), k = e.name + '|' + nr;
      if(!seen.has(k)){ seen.add(k); dogs.push({name: String(e.name), nr}); }
    });
    dogs.sort((a,b) => a.name.localeCompare(b.name, 'pl') || a.nr.localeCompare(b.nr, 'pl'));
    // pies bez imienia ma w Historii etykietę „#numer" — w CSV pusta kolumna „pies", numer raz (jak w widoku, histNr)
    const pies = d => d.nr && d.name === '#' + d.nr ? '' : d.name;
    return ['data,pies,numer'].concat(dogs.map(d => [plDate(date), pies(d), d.nr].map(csvCell).join(','))).join('\n');
  }
  function mailText(date){
    return state.mailTemplate.split('[DATA]').join(plDate(date)).split('[LISTA]').join(mailList(date));
  }
  /** Kopia przez ukryte pole i execCommand — działa w iframie Apps Script, musi pójść od razu w stuknięciu (iOS). */
  function copyByCommand(text){
    let ok = false;
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.setAttribute('data-copy', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      try{ ok = !!(document.execCommand && document.execCommand('copy')); } finally { ta.remove(); }
    } catch(e){ ok = false; }
    return ok;
  }
  /**
   * Mail do schowka: najpierw execCommand, potem schowek przeglądarki (w iframie bez zgody
   * strony-rodzica bywa zablokowany). Gdy nic nie zadziała, mail staje na ekranie do skopiowania
   * ręcznie — nigdy cisza.
   */
  function copyMail(date){
    const text = mailText(date), had = !!state.mailFallback;
    state.mailFallback = null;
    const done = ok => {
      if(ok){
        toast('Skopiowano — wklej w nowej wiadomości', 'ok');
        if(had && state.view==='today') render('nav');
        return;
      }
      state.mailFallback = {date, text};
      if(state.view==='today' && state.date===date) render('nav');
      toast('Nie udało się skopiować — skopiuj tekst ręcznie');
    };
    if(copyByCommand(text)) return done(true);
    const clip = navigator.clipboard;
    if(clip && clip.writeText) clip.writeText(text).then(() => done(true), () => done(false));
    else done(false);
  }

  /** 'H:mm' -> minuty, żeby 9:05 stanęło przed 10:00 (porównanie napisów by się pomyliło). */
  function minutesOf(t){ const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60+Number(m[2]) : 9999; }

  /**
   * Miniony dzień — tylko podgląd, zastępuje dawną zakładkę Historia. Pokazujemy
   * to, co się faktycznie odbyło; rezerwacje, z których nic nie wyszło, nie są
   * częścią zapisu.
   * Kolejność (decyzja właściciela, 1.1.1): najpierw wolontariusz — spacery jednej osoby
   * stoją razem, osoby alfabetycznie po volNorm („grzesiek" i „Grzesiek" to ta sama osoba),
   * wpis bez osoby na końcu; w obrębie osoby — godzina (S105).
   * Grupy (decyzja właściciela: wersja A + podsumowanie z D, S107): wpis ze spaceru grupowego
   * ma tło i pasek koloru swojej grupy, jak kafelek na liście dnia — kolejności to nie zmienia.
   * Pod listą „Spacery grupowe": każda grupa w jednej linijce, po kolei w ciągu dnia — kto
   * szedł z kim. Grupą jest tu numer z co najmniej dwoma odbytymi spacerami: gdy reszta grupy
   * nie wyszła, pies szedł sam. Wpisy sprzed kolumny `grupa` w Historii są bez grupy.
   */
  function renderPastDay(date){
    const items = state.past[date];
    let html = `<div class="dayhint">Miniony dzień — tylko podgląd.</div>`;
    if(!items){
      // brak danych = pobierz, niezależnie od tego, jak tu trafiliśmy: po przełomie dnia
      // applyData czyści pamięć minionych dni, a ekran stał na „Wczytuję…" do strzałki
      fetchPast(date);                     // sama pilnuje, żeby nie pytać podwójnie
      return html + '<div class="empty">Wczytuję…</div>';
    }
    if(!items.length) return html + '<div class="empty">Tego dnia nie zapisano żadnego spaceru.</div>';
    if(state.mailTemplate){
      // target=_top: aplikacja siedzi w ramce Apps Script — link idzie do okna nadrzędnego (tak radzi
      // dokumentacja HtmlService), a mailto: otwiera pocztę bez opuszczania strony
      if(typeof state.mailSubject === 'string') html += `<a class="btn mailsend" data-act="sendMail" target="_top"
        href="${esc(mailHref(date))}">✉️ Wyślij e-mail z listą psów</a>`;
      html += `<button class="btn ${typeof state.mailSubject === 'string' ? 'ghost ' : ''}mailcopy" data-act="copyMail" data-date="${esc(date)}">📋 Skopiuj treść</button>`;
      const fb = state.mailFallback;
      if(fb && fb.date === date) html += `<div class="hint">Nie udało się skopiować samo — zaznacz tekst poniżej i skopiuj go.</div>
        <textarea class="mailbox" readonly rows="9">${esc(fb.text)}</textarea>`;
    }
    const sorted = items.slice().sort((a,b)=>{
      const x = volNorm(a.who), y = volNorm(b.who);
      return x===y ? minutesOf(a.time)-minutesOf(b.time) : !x ? 1 : !y ? -1 : x<y ? -1 : 1;
    });
    const members = {};
    sorted.forEach(e => { const g = posInt(e.group); if(g) (members[g] = members[g] || []).push(e); });
    const gidOf = e => { const g = posInt(e.group); return g && members[g].length > 1 ? g : 0; };
    const paint = g => { const c = groupColor(g); return ` style="--gbg:${c.bg};--gc:${c.ink}"`; };
    html += `<div class="hist-day"><div class="hist-date">${sorted.length} ${plural(sorted.length,'spacer','spacery','spacerów')}</div>`;
    sorted.forEach(e=>{ const g = gidOf(e);
      html+=`<div class="hist-item${g ? ' hg' : ''}"${g ? paint(g) : ''}><b>${esc(e.name)}</b>${histNr(e)} — ${esc(e.who)}<span class="t">${esc(e.time)}</span></div>`; });
    html += `</div>`;
    const groups = Object.keys(members).map(Number).filter(g => members[g].length > 1)
      .map(g => ({g, time: members[g].map(e => e.time).sort((a,b)=>minutesOf(a)-minutesOf(b))[0]}))
      .sort((a,b) => minutesOf(a.time)-minutesOf(b.time) || a.g-b.g);
    if(!groups.length) return html;
    html += `<div class="hist-day"><div class="hist-date">Spacery grupowe</div>`;
    groups.forEach(({g, time}) => {
      const people = [];                   // osoby w kolejności listy, psy jednej osoby razem
      members[g].forEach(e => { const k = volNorm(e.who); let p = people.find(x => x.k === k);
        if(!p) people.push(p = {k, who: e.who, dogs: []}); p.dogs.push(e.name); });
      html += `<div class="hist-item hg hist-gsum"${paint(g)}><b>${esc(time)}</b> <span>${people.map(p =>
        esc(p.dogs.join(', ')) + (p.k ? ` <span class="gw">(${esc(p.who)})</span>` : '')).join(' · ')}</span></div>`;
    });
    return html + `</div>`;
  }

  /* =========================================================
     WOLONTARIUSZE — kolor na dzień
     Przy imieniu wolontariusza jest kapsułka w jego kolorze: ta sama osoba tego dnia —
     ten sam kolor przy każdym psie, więc wzrokiem widać, kto ma które psy. Kolor nie
     zastępuje imienia, tylko je obrysowuje.

     Kolory są celowo z INNEJ rodziny niż grupy: grupa to blade tło całego kafelka,
     wolontariusz — nasycony kontur i kropka przy imieniu. Paleta omija zieleń, żółć
     i czerwień, bo te mówią o trudności psa.

     Przydział trzyma serwer (volAssign_ w Dogs.gs, właściwość `vol:<data>`): kolejna
     osoba dnia dostaje pierwszy wolny kolor, więc do dziesięciu osób kolory się nie
     powtarzają, a raz dany zostaje do końca dnia i jest taki sam na każdym telefonie.
     Telefon liczy go tą samą funkcją od razu po rezerwacji, zanim odpowie serwer.
     ========================================================= */
  const VOL_COLORS = ['#1d4ed8','#c026d3','#0e7490','#ea580c','#6d28d9',
                      '#db2777','#92400e','#1e3a8a','#0f766e','#4b5563'];   // tyle, ile VOLUNTEER_COLORS w Config.gs
  function volNorm(name){
    return String(name == null ? '' : name).trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/\s+/g, ' ');
  }
  function volHash(s){
    let h = 2166136261;
    for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h;
  }
  const VOL_MAX = 60;                               // tyle, ile VOLUNTEER_MAX w Config.gs
  /** Ta sama funkcja co volAssign_ na serwerze: od koloru „z imienia" do pierwszego wolnego. */
  function volAssign(map, norm, n){
    if(!norm) return 0;
    if(Object.prototype.hasOwnProperty.call(map, norm)) return map[norm];
    if(Object.keys(map).length >= VOL_MAX) return volHash(norm) % n;   // przydział pełny — bez wpisu
    const used = {};
    Object.keys(map).forEach(k => { used[map[k]] = true; });
    const start = volHash(norm) % n;
    for(let k=0;k<n;k++){ const c = (start + k) % n; if(!used[c]){ map[norm] = c; return c; } }
    map[norm] = start;
    return start;
  }
  /** Kolor osoby tego dnia — z przydziału, a gdy go jeszcze nie ma: „z imienia" (bez zapisywania). */
  function volColor(date, name){
    const norm = volNorm(name), map = state.volunteers[date] || {};
    const i = Object.prototype.hasOwnProperty.call(map, norm) ? posInt(map[norm] + 1) - 1 : volHash(norm) % VOL_COLORS.length;
    return VOL_COLORS[(i >= 0 ? i : 0) % VOL_COLORS.length];
  }

  /* =========================================================
     GRUPY — spacery grupowe
     Przytrzymanie kafelka włącza zaznaczanie spacerów do wspólnego wyjścia.
     Członkiem grupy jest SPACER psa ('pies:spacer'), nie pies: u psa na dwa spacery
     1/2 może iść rano w jednej grupie, a 2/2 po południu w innej. Grupa jest na
     konkretny dzień i żyje na serwerze (kolumna `grupa` w Spacery), więc każdy telefon
     widzi ją tak samo. Kolor wynika z numeru grupy tego dnia.

     Grupa to JEDEN wspólny spacer. „Wyprowadzony ✓" na dowolnym spacerze z grupy odhacza
     wszystkie zarezerwowane — ale tylko wtedy, gdy żaden spacer z grupy nie jest WOLNY
     (każdy ma opiekuna). Nie „wszystkie zarezerwowane": w grupie bywa spacer już odbyty
     (dołożony do składu po wyjściu albo z innego telefonu), a „Zwolnij" z grupy nie
     wyprowadza — dosłowna reguła zablokowałaby resztę bez wyjścia. Zwolniony spacer
     zostaje w grupie; cofnięty z niej wychodzi (leaveGroup). Cofnięcie cofa jeden spacer.
     ========================================================= */
  const GROUP_COLORS = [
    {bg:'#ebe7fb', ink:'#5a45b0'},   // lawenda
    {bg:'#e0edfa', ink:'#2c67a3'},   // błękit
    {bg:'#fbe5ee', ink:'#a3336a'},   // róż
    {bg:'#dcf2ee', ink:'#1e7568'},   // morski
    {bg:'#f3e3f7', ink:'#86399a'},   // storczyk
    {bg:'#e4e8ef', ink:'#465266'},   // łupek
  ];
  function groupColor(gid){
    const n = GROUP_COLORS.length, i = (posInt(gid) || 1) - 1;
    return GROUP_COLORS[i % n];
  }
  /** Spacery w grupie danego dnia: [{dog, n, count, status, who, group}], w kolejności katalogu. */
  function groupSlots(date, gid){
    const out = [];
    state.dogs.forEach(dog => {
      const all = slotsOf(date, dog);
      all.forEach(s => { if(s.group === gid) out.push(Object.assign({dog, count:all.length}, s)); });
    });
    return out;
  }
  /** Spacery z grupy, które nie mają opiekuna — dopóki są, grupa nie może ruszyć. */
  function groupWaiting(date, gid){ return groupSlots(date, gid).filter(s => s.status === 'free'); }
  /** „Luna" albo „Luna 2/2" — który spacer psa, gdy pies ma ich kilka. */
  function slotLabel(s){ return esc(dogLabel(s.dog)) + (s.count > 1 ? ' ' + s.n + '/' + s.count : ''); }
  /**
   * Spacer wychodzi z grupy — to samo, co leaveGroup_ na serwerze (cofnięty spacer).
   * Grupa, w której został jeden spacer, przestaje być grupą. Zwraca psy dawnych
   * towarzyszy — ich kafelki też trzeba przerysować.
   */
  function leaveGroup(date, id, n){
    const g = slotOf(date, id, n).group;
    if(!g) return [];
    setSlot(date, id, n, Object.assign({}, slotOf(date, id, n), {group:0}));
    touchGroup(date, id, n);
    const left = groupSlots(date, g);
    if(left.length===1){ state.slots[skey(date, left[0].dog.id, left[0].n)].group = 0; touchGroup(date, left[0].dog.id, left[0].n); }
    return left.map(s => s.dog.id);
  }
  /**
   * Odpowiedź akcji na spacerze — bez grupy. Skład zmieniają też akcje na INNYCH
   * spacerach (cofnięcie towarzysza), więc odpowiedź policzona przed nimi przywróciłaby
   * rozwiązaną już grupę. Grupy przychodzą z setGroup i z odświeżenia (getData),
   * a skutki własnych akcji klient liczy sam, tak jak serwer. Serwer sprzed spacerów
   * odpowiada {dog} w starym kształcie — wtedy wyciągamy z niego ten spacer.
   */
  function applySlot(date, id, n, res){
    let s = res && res.slot;
    if(!s && res && res.dog) s = legacySlots(res.dog).filter(x => x.n === n)[0] || FREE_SLOT;
    if(!s) return null;
    setSlot(date, id, n, Object.assign({}, s, {group: slotOf(date, id, n).group}));
    if(res.volunteers) Object.assign(state.volunteers, res.volunteers);
    return slotOf(date, id, n);
  }
  /** Kolejny numer grupy tego dnia — dokładnie tak samo liczy go serwer (setGroup). */
  function nextGroupId(date){
    let max = 0;
    for(const k in state.slots){ if(k.indexOf(date+'|')===0 && state.slots[k].group > max) max = state.slots[k].group; }
    return max + 1;
  }
  /** Trudność — pasek z lewej. Grupa — blade tło i pasek „GRUPA" z prawej w intensywnym kolorze tej grupy (--gc). */
  function tileStyle(t, dm){
    const g = t.gid ? groupColor(t.gid) : null;
    return `border-left-color:${dm.color}` + (g ? `;background:${g.bg};--gc:${g.ink}` : '');
  }

  /** Czy spacer można zaznaczyć: odbyty nie ma czego planować — chyba że już jest w tej grupie. */
  function canPick(ref){
    const sel = state.select, r = parseRef(ref), s = slotOf(sel.date, r.id, r.n);
    return s.status !== 'walked' || (sel.gid && s.group === sel.gid);
  }

  /**
   * Kafelek w trybie zaznaczania to TEN SAM kafelek co zwykle: dochodzi tylko klasa
   * i kółko położone na wierzchu (position:absolute), a przyciski bledną. Osobny,
   * krótszy kafelek skracał całą listę w chwili przytrzymania — wszystko nad palcem
   * się kurczyło, a przytrzymany pies uciekał z ekranu.
   *
   * Kafelek z jednym spacerem ma jedno kółko (na kafelku). Kafelek główny psa na dwa
   * spacery ma kółko przy KAŻDYM polu 1/2, 2/2 — stuknięcie w pole zaznacza dokładnie
   * ten spacer, więc nigdy nie ma wątpliwości, które wyjście trafia do grupy.
   */
  function pickBits(t){
    if(!state.select || t.slots.length !== 1) return {cls:'', box:''};
    return pickSlotBits(t.dog.id, t.slots[0].n);
  }
  function pickSlotBits(id, n){
    const sel = state.select;
    if(!sel) return {cls:'', box:''};
    const ref = sref(id, n), picked = sel.ids.indexOf(ref) >= 0, can = canPick(ref);
    return {
      cls: ' pick' + (picked ? ' picked' : '') + (can ? '' : ' nopick'),
      box: can ? `<span class="pickbox">${picked ? '✓' : ''}</span>` : '',
    };
  }

  /**
   * Który spacer wskazuje palec: pole 1/2 / 2/2 (data-slot) w kafelku, a poza polem —
   * pierwszy jeszcze nieodbyty spacer kafelka (w kafelku z jednym spacerem: ten spacer).
   */
  function refFromTarget(el){
    const li = el && el.closest && el.closest('li.dog[data-tile]');
    if(!li) return null;
    const id = Number(li.dataset.dog);
    const field = el.closest('[data-slot]');
    if(field && li.contains(field)) return sref(id, Number(field.dataset.slot));
    const ns = String(li.dataset.slots || '1').split(',').map(Number);
    const open = ns.filter(n => slotOf(state.date, id, n).status !== 'walked');
    return sref(id, (open.length ? open : ns)[0]);
  }
  /** Kafelek, w którym stoi spacer. */
  function tileIdOf(ref){ const r = parseRef(ref); return slotOf(state.date, r.id, r.n).group ? 's'+r.id+'.'+r.n : 'm'+r.id; }

  /**
   * Pasek na dole ekranu zasłania ostatnie ~80 px. Jeśli przytrzymany pies stał
   * właśnie tam, przesuwamy listę dokładnie o tyle, żeby wyszedł spod paska —
   * i tylko wtedy.
   */
  function keepAboveBar(ref){
    const li = viewEl.querySelector(`li.dog[data-tile="${tileIdOf(ref)}"]`);
    const bar = document.getElementById('selectBar');
    if(!li || !bar) return;
    const top = bar.getBoundingClientRect().top, bottom = li.getBoundingClientRect().bottom;
    if(top > 0 && bottom > top) window.scrollBy(0, bottom - top + 12);
  }

  /** Pasek na dole ekranu: ile zaznaczonych, „Grupa" wyszarzone do pierwszego towarzysza. */
  function renderSelectBar(){
    const bar = document.getElementById('selectBar');
    if(!bar) return;
    const sel = state.select;
    const on = !!sel && state.view==='today' && !state.admin;
    bar.classList.toggle('hidden', !on);
    document.body.classList.toggle('selecting', on);
    if(!on) return;
    const n = sel.ids.length;
    document.getElementById('selInfo').textContent = n < 2
      ? 'Zaznacz psy do wspólnego spaceru'
      : `Zaznaczone: ${n} ${plural(n,'pies','psy','psów')}`;
    document.getElementById('selGroup').disabled = n < 2;
    document.getElementById('selDissolve').classList.toggle('hidden', !sel.gid);
  }

  /**
   * Start zaznaczania z przytrzymanego spaceru. Spacer już w grupie — otwieramy jego grupę
   * do zmiany składu albo rozwiązania. Spacer odbyty bez grupy — nie ma czego planować.
   */
  function startSelect(ref){
    if(!ref || state.admin || state.view!=='today' || isPast(state.date)) return;
    const r = parseRef(ref);
    if(!findDog(r.id)) return;
    const s = slotOf(state.date, r.id, r.n);
    if(s.group){
      const ids = groupSlots(state.date, s.group).map(x => sref(x.dog.id, x.n));
      // `seen` — skład, który widać teraz na ekranie; serwer zdejmie tylko spośród niego
      state.select = {date:state.date, anchor:ref, gid:s.group, ids, seen:ids.slice()};
    } else {
      if(s.status === 'walked') return;
      state.select = {date:state.date, anchor:ref, gid:0, ids:[ref], seen:[]};
    }
    render('nav');
    keepAboveBar(ref);
  }

  /**
   * Stuknięcie podczas zaznaczania. Przytrzymany spacer zostaje w grupie na stałe.
   * Jeden pies idzie w grupie najwyżej jednym spacerem: stuknięcie w 2/2 psa, którego
   * 1/2 jest już zaznaczony, przenosi zaznaczenie na 2/2 (jak na serwerze w setGroup).
   */
  function togglePick(e){
    const ref = refFromTarget(e.target), sel = state.select;
    if(!ref || ref === sel.anchor || !canPick(ref)) return;
    const id = parseRef(ref).id;
    const i = sel.ids.indexOf(ref);
    if(i >= 0){ sel.ids.splice(i, 1); render('nav'); return; }
    const other = sel.ids.filter(x => parseRef(x).id === id)[0];
    if(other === sel.anchor) return;                  // przytrzymanego nie przenosimy
    if(other) sel.ids.splice(sel.ids.indexOf(other), 1);
    sel.ids.push(ref);
    render('nav');
  }

  function cancelSelect(){ state.select = null; render('nav'); }

  /**
   * Lokalne zmiany grup psów z numerem kolejnym. Odpowiedź setGroup liczona na serwerze
   * PRZED późniejszą lokalną zmianą (spacer towarzysza, cofnięcie) nie może jej cofnąć —
   * inaczej przywracała rozwiązaną grupę do najbliższego odświeżenia (jak applyDog).
   */
  let groupSeq = 0;
  const groupTouched = {};                          // skey -> numer ostatniej lokalnej zmiany grupy spaceru
  function touchGroup(date, id, n){ groupTouched[skey(date, id, n)] = ++groupSeq; }

  /**
   * Numery grup z odpowiedzi serwera — tylko to pole, żeby nie cofnąć czyjejś rezerwacji
   * w drodze. `since` = numer lokalnej zmiany, na którą to odpowiedź: spacery zmienione
   * lokalnie później zostają, jak są, a grupa, w której po tym został jeden spacer, znika.
   * Odpowiedź serwera sprzed spacerów (`walks`, wiersz na psa) dotyczy spaceru 1.
   */
  function applyGroups(date, res, since){
    const got = {};
    ((res && (res.slots || res.walks)) || []).forEach(s => {
      if(s.date === date) got[skey(date, s.dogId, s.slot || 1)] = posInt(s.group);
    });
    const keys = new Set(Object.keys(got));
    for(const k in state.slots) if(k.indexOf(date+'|')===0) keys.add(k);
    let skipped = false;
    keys.forEach(k => {
      if(since !== undefined && (groupTouched[k] || 0) > since){ skipped = true; return; }
      const g = got[k] || 0;
      if(state.slots[k]) state.slots[k].group = g;
      else if(g){ const p = k.split('|'); setSlot(date, Number(p[1]), Number(p[2]), {group:g}); }
    });
    if(!skipped) return;
    const count = {};
    for(const k in state.slots) if(k.indexOf(date+'|')===0 && state.slots[k].group) count[state.slots[k].group] = (count[state.slots[k].group] || 0) + 1;
    for(const k in state.slots) if(k.indexOf(date+'|')===0 && count[state.slots[k].group] === 1) state.slots[k].group = 0;
  }

  /**
   * Zatwierdzenie składu (albo rozwiązanie, gdy zostaje mniej niż dwa psy).
   * Optymistycznie od razu: kolor i miejsce na liście — to, po co ktoś tę grupę robi,
   * więc lista układa się natychmiast, a nie po ciszy (patrz orderedDogs).
   */
  function commitGroup(ids){
    const sel = state.select;
    if(!sel) return;
    const date = sel.date;
    const gid  = ids.length >= 2 ? (sel.gid || nextGroupId(date)) : 0;
    const seen = sel.seen || [];
    const local = {};                                   // stan lokalny taki, jaki zrobi serwer: 'pies:spacer' -> grupa
    state.dogs.forEach(d => slotsOf(date, d).forEach(s => { local[sref(d.id, s.n)] = s.group; }));
    // z grupy zdejmujemy tylko spacery, które było widać przy otwarciu zaznaczania (jak setGroup)
    if(sel.gid) Object.keys(local).forEach(r => {
      if(local[r] === sel.gid && ids.indexOf(r) < 0 && seen.indexOf(r) >= 0) local[r] = 0;
    });
    const touched = {};
    if(sel.gid) touched[sel.gid] = true;
    ids.forEach(r => {
      // drugi spacer tego samego psa w tej grupie? Grupa to jedno wyjście — zostaje wybrany
      const id = parseRef(r).id;
      Object.keys(local).forEach(o => { if(o !== r && parseRef(o).id === id && gid && local[o] === gid) local[o] = 0; });
      if(local[r] && local[r] !== gid) touched[local[r]] = true;
      local[r] = gid;
    });
    Object.keys(touched).forEach(g => {
      const left = Object.keys(local).filter(r => local[r] === Number(g));
      if(left.length === 1) local[left[0]] = 0;
    });
    Object.keys(local).forEach(r => { const p = parseRef(r); if(local[r] !== slotOf(date, p.id, p.n).group) touchGroup(date, p.id, p.n); });
    applyGroups(date, {slots: Object.keys(local).map(r => { const p = parseRef(r); return {date, dogId:p.id, slot:p.n, group:local[r]}; })});
    const since = groupSeq;                             // późniejsze lokalne zmiany mają pierwszeństwo przed odpowiedzią

    state.select = null;
    orderDate = null;
    render('nav');
    enqueue('setGroup', [date, ids.length >= 2 ? ids : [], sel.gid || 0, seen], {key:'group@'+date, reconcile:res=>{
      applyGroups(date, res, since);
      if(date === state.date) safeRender();
    }});
  }
  function confirmGroup(){ if(state.select && state.select.ids.length >= 2) commitGroup(state.select.ids.slice()); }
  function dissolveGroup(){ if(state.select && state.select.gid) commitGroup([]); }

  /** „Wyprowadzony ✓" na spacerze z grupy: odhacza wszystkie zarezerwowane naraz. */
  function doGroupWalk(gid){
    const date = state.date;
    if(isPast(date)){ dayClosed(); return; }
    if(date !== state.bizDate) return;
    const mates = groupSlots(date, gid);
    if(mates.some(s => s.status === 'free')) return;      // przycisk jest wtedy wyłączony
    // każdy spacer osobno, przez zwykłe markWalked — ten sam, sprawdzony i ponawialny zapis
    mates.filter(s => s.status === 'reserved').forEach(s => doWalk(s.dog.id, s.n));
  }

  /* ---------- przytrzymanie kafelka ----------
     Liczymy od pointerdown, nie od click (bug nr 6). Przesunięcie palca (przewijanie
     listy) albo puszczenie przed czasem przerywa. Na kafelku wyłączamy systemowe menu
     i zaznaczanie tekstu, które telefon podpina pod to samo przytrzymanie. */
  const LONG_PRESS_MS = 550;
  let lpTimer = null, lpStart = null;
  function lpCancel(){ clearTimeout(lpTimer); lpTimer = null; lpStart = null; }
  function lpBegin(e){
    if(state.admin || state.select || state.view!=='today' || isPast(state.date)) return;
    const t = e.target;
    if(!t || !t.closest || t.closest('input')) return;   // pole imienia — zwykłe zachowanie
    const ref = refFromTarget(t);                         // KTÓRY spacer: pole 1/2 / 2/2 pod palcem
    if(!ref) return;
    lpStart = {x:e.clientX || 0, y:e.clientY || 0};
    clearTimeout(lpTimer);
    lpTimer = setTimeout(()=>{ lpTimer = null; startSelect(ref); }, LONG_PRESS_MS);
  }
  function lpMove(e){
    if(!lpTimer || !lpStart) return;
    if(Math.abs((e.clientX||0) - lpStart.x) > 10 || Math.abs((e.clientY||0) - lpStart.y) > 10) lpCancel();
  }
  viewEl.addEventListener('pointerdown', lpBegin);
  viewEl.addEventListener('pointermove', lpMove);
  ['pointerup','pointercancel','pointerleave'].forEach(t => viewEl.addEventListener(t, lpCancel));
  if(!window.PointerEvent){                                  // starsze WebView
    const pt = e => (e.touches && e.touches[0]) || {};
    viewEl.addEventListener('touchstart', e => lpBegin({target:e.target, clientX:pt(e).clientX, clientY:pt(e).clientY}));
    viewEl.addEventListener('touchmove',  e => lpMove({clientX:pt(e).clientX, clientY:pt(e).clientY}));
    ['touchend','touchcancel'].forEach(t => viewEl.addEventListener(t, lpCancel));
  }
  viewEl.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('li.dog')) e.preventDefault(); });

  document.getElementById('selCancel').addEventListener('click', cancelSelect);
  document.getElementById('selGroup').addEventListener('click', confirmGroup);
  document.getElementById('selDissolve').addEventListener('click', dissolveGroup);

  /* =========================================================
     AKCJE (optymistyczne: najpierw lokalny stan i render,
     potem zapis w tle; ewentualna korekta po odpowiedzi)
     ========================================================= */
  /*
   * Każda akcja zapamiętuje SWÓJ dzień w chwili kliknięcia i wysyła go serwerowi.
   * Odpowiedź wraca do tego dnia, nawet jeśli wolontariusz zdążył w międzyczasie
   * przejść strzałką gdzie indziej — kafelek przerysowujemy tylko wtedy, gdy ten
   * dzień jest wciąż na ekranie.
   */
  /**
   * Dzień zamknął się pod palcami: ktoś wpisywał imię o 19:59, reset minął,
   * a on stuka OK. Po cichu nic nie zrobić = zamrożony ekran w jego oczach —
   * mówimy wprost i przechodzimy na bieżący dzień.
   */
  function dayClosed(){
    toast('Ten dzień jest już zamknięty — przechodzę na bieżący');
    goDate(state.bizDate);
  }

  /*
   * Każda akcja dotyczy JEDNEGO spaceru (pies + numer spaceru) i to on jedzie do serwera
   * jako ostatni argument. Numer bierzemy z przycisku (data-slot) w chwili kliknięcia —
   * tak samo jak dzień.
   */
  function doReserve(id, n, who){
    const date=state.date;
    if(!date) return;
    if(isPast(date)){ dayClosed(); return; }
    const s=slotOf(date, id, n); if(!findDog(id) || s.status!=='free') return;
    setSlot(date, id, n, Object.assign({}, s, {status:'reserved', who, time:''}));
    // kolor wolontariusza od razu, tak samo jak przydzieli go serwer (volAssign_)
    volAssign(state.volunteers[date] = state.volunteers[date] || {}, volNorm(who), VOL_COLORS.length);
    // najpierw do kolejki, potem kafelek — wtedy od razu ma kręciołek „zapisuję"
    enqueue('reserve',[id,who,date,n],{key:keySlot(id,n,date),reconcile:res=>{
      const got = applySlot(date, id, n, res);
      if(!got){ safeRender(); return; }
      if(!(got.status==='reserved' && got.who===who)){
        toast('Ubiegł Cię ktoś inny — ten spacer już zajęty');
        // konflikt pokazujemy od razu, nawet gdy ktoś pisze imię — pole przeżyje (patchDog)
        if(date===state.date) patchDog(id);
      } else if(date===state.date && !busyEditing()) patchDog(id);
    }});
    patchDog(id, 'self');
  }

  /**
   * KTÓRY spacer odhaczamy — numer idzie do serwera, bo tylko on czyni zapis idempotentnym:
   * markWalked jest w RETRIABLE, a powtórka po zaginionej odpowiedzi trafiała kiedyś w inny
   * spacer (bug nr 9). Powtórka na spacerze już odbytym niczego nie rusza.
   */
  function doWalk(id, n){
    const date=state.date;
    if(isPast(date)){ dayClosed(); return; }
    if(date!==state.bizDate) return;           // spacer odhacza się tylko w dniu, który trwa
    if(!findDog(id)) return;
    setSlot(date, id, n, Object.assign({}, slotOf(date, id, n), {status:'walked', time:localHM()}));
    enqueue('markWalked',[id,'',n,date],{key:keySlot(id,n,date),reconcile:res=>{
      applySlot(date, id, n, res);
      if(date===state.date && !busyEditing()) patchDog(id);
    }});
    patchDog(id, 'self');
  }

  /**
   * „Zwolnij" (rezerwacja) albo „Cofnij" (spacer) — dokładnie jak setFree na serwerze.
   * Zwolniony spacer zostaje w grupie, a grupa znów czeka na jego rezerwację. Cofnięty
   * wychodzi z grupy (leaveGroup): kafelki dawnych towarzyszy też się wtedy zmieniają.
   */
  function doFree(id, n){
    const date=state.date;
    if(!date || !findDog(id)) return;
    if(isPast(date)){ dayClosed(); return; }
    const s=slotOf(date, id, n);
    const undo=s.status==='walked';
    // co zwalniamy: serwer zwolni tylko ten stan — powtórka po zaginionej odpowiedzi
    // nie zwolni rezerwacji, którą w międzyczasie zrobił ktoś inny (setFree w RETRIABLE)
    const seen={status:s.status, who:s.who};
    setSlot(date, id, n, Object.assign({}, s, {status:'free', who:'', time:''}));
    const mates=undo ? leaveGroup(date, id, n) : [];
    enqueue('setFree',[id,date,seen,n],{key:keySlot(id,n,date),reconcile:res=>{
      const got = applySlot(date, id, n, res);
      if(got && got.status!=='free') toast('Ten spacer ma już innego opiekuna — pokazuję aktualny stan');
      if(date===state.date && !busyEditing()) patchDog(id);
    }});
    patchDog(id, 'self');
    mates.forEach(x=>patchDog(x, 'self'));
  }

  function doTaskToggle(id){
    const t=state.tasks.find(x=>x.id===id); if(!t || !canTickTask(t)) return;   // przyszłe — w ich dniu
    t.done=!t.done;
    render('self');
    enqueue('setTaskDone',[id,t.done],{key:keyTask(id)});
  }

  /* =========================================================
     ZDARZENIA
     ========================================================= */
  document.querySelector('.tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t) return;
    state.view=t.dataset.tab; state.select=null; render('nav');
    if(state.view==='diag') fetchDiag();
  });

  /**
   * Przejście na inny dzień. Wolno swobodnie w obie strony; w tył to podgląd,
   * do przodu — rezerwacje. Otwarta edycja psa i zaznaczanie grupy dotyczą listy,
   * którą właśnie opuszczamy, więc je zamykamy.
   */
  function goDate(iso){
    if(!iso) return;
    state.date = iso;
    state.follow = (iso === state.bizDate);
    state.view = 'today';
    state.editId = null;
    state.select = null;
    render('nav');
    if(isPast(iso)) fetchPast(iso);
  }
  document.getElementById('prevDay').addEventListener('click',()=>{ if(state.date) goDate(addDays(state.date,-1)); });
  document.getElementById('nextDay').addEventListener('click',()=>{ if(state.date) goDate(addDays(state.date,1)); });
  document.getElementById('dayLabel').addEventListener('click',()=>{ if(state.bizDate) goDate(state.bizDate); });

  gear.addEventListener('click',()=>{
    if(state.select){ state.select=null; render('nav'); }
    if(state.admin){
      state.admin=false; state.editId=null; state.diag=null;
      if(state.view==='diag') state.view='today';   // zakładka znika razem z trybem edycji
      render('nav'); return;
    }
    document.getElementById('pinrow').classList.toggle('hidden');
    document.getElementById('pinErr').classList.add('hidden');
    const p=document.getElementById('pinInput'); p.value=''; p.focus();
  });
  document.getElementById('pinOk').addEventListener('click',tryPin);
  document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
  /** Sprawdzenie PIN-u. Brak odpowiedzi to nie cisza — bez tego „OK" przy słabym zasięgu nic nie robiło. */
  function tryPin(){
    const pin=document.getElementById('pinInput').value.trim();
    google.script.run.withSuccessHandler(ok=>{
      if(ok){ state.admin=true; state.pin=pin;
        // schowane pole PIN-u oddaje fokus: inaczej busyEditing() uznaje, że ktoś pisze, i panel
        // nie przerysowuje się po odpowiedzi serwera (nie każda przeglądarka sama zdejmuje fokus ze schowanego pola)
        document.getElementById('pinInput').blur();
        document.getElementById('pinrow').classList.add('hidden');
        document.getElementById('pinErr').classList.add('hidden'); render('nav');
        if(state.view==='diag') fetchDiag();
      } else { document.getElementById('pinErr').classList.remove('hidden'); }
    }).withFailureHandler(()=>{
      toast('Nie udało się sprawdzić PIN-u — brak połączenia, spróbuj jeszcze raz');
    }).checkPin(pin);
  }

  /** Wartość pola formularza edycji psa. */
  function ef(name){ const el=viewEl.querySelector(`[data-ef="${name}"]`); return el?el.value.trim():''; }
  function efChecked(name){ const el=viewEl.querySelector(`[data-ef="${name}"]`); return !!(el && el.checked); }

  /** Otwiera pole "Twoje imię" przy jednym spacerze psa, zamykając wszystkie inne. */
  function openEntry(id, n, clickedBtn){
    viewEl.querySelectorAll('.entry').forEach(el=>el.classList.add('hidden'));
    viewEl.querySelectorAll('[data-act="reserve"]').forEach(b=>b.classList.remove('hidden'));
    // w kafelku, w którym kliknięto — ten sam pies bywa na liście dwa razy (kafelek główny i odłączony)
    const scope = clickedBtn.closest('li') || viewEl;
    const entry = scope.querySelector(`[data-entry="${id}"][data-slot="${n}"]`);
    const input = scope.querySelector(`[data-input="${id}"][data-slot="${n}"]`);
    if(!entry || !input){ render('self'); return; }   // DOM nieaktualny — przerysuj zamiast wybuchać
    invalidateHtml();            // DOM zmieniony poza render() — cache HTML nieaktualny
    entry.classList.remove('hidden');
    clickedBtn.classList.add('hidden');
    if(!input.value && lastWho) input.value = lastWho;   // podpowiedź z tej sesji
    input.focus();
    if(input.value) input.select();                      // ...łatwa do nadpisania
  }

  /** Zmiana godziny czyszczenia i przełącznik „nigdy nie znika" — to 'change', nie 'click'. */
  viewEl.addEventListener('change',e=>{
    if(e.target.matches && e.target.matches('[data-ef="noteForever"]')){
      // notatka na stałe nie ma terminu — pole daty wyłączamy, żeby nie udawało, że coś znaczy
      const until = viewEl.querySelector('[data-ef="noteUntil"]');
      if(until) until.disabled = e.target.checked;
      return;
    }
    if(e.target.id!=='resetHour') return;
    const h = Number(e.target.value);
    state.resetHour = h; showResetHour();          // optymistycznie: etykiety od razu
    enqueue('setResetHour',[h,state.pin],{key:'settings',reconcile:res=>{
      applyFull_(res);
      fetchDiag();                                  // wyzwalacz mógł się przełożyć
    }});
  });

  // formularze trybu edycji („Dodaj psa", „Nowe zadanie") — szkic w stanie, patrz formVal;
  // 'change' dla listy trudności i daty (starsze przeglądarki nie dają przy nich 'input')
  const keepForm = e => { if(FORM_FIELDS.indexOf(e.target.id) >= 0) state.form[e.target.id] = e.target.value; };
  viewEl.addEventListener('input', keepForm);
  viewEl.addEventListener('change', keepForm);

  // treść maila pisana w panelu — trzymana w stanie, żeby przeżyła przerysowanie (np. po stuknięciu obok)
  viewEl.addEventListener('input', e=>{
    if(!['mailTo','mailSubject','mailTemplate'].includes(e.target.id)) return;
    const v = id => { const el = viewEl.querySelector('#' + id); return el ? el.value : ''; };
    state.mailDraft = {to: v('mailTo'), subject: v('mailSubject'), body: v('mailTemplate')};
    showMailDirty();
  });

  // przyłożenie palca do listy — do osłony stuknięć (tapRefused): czy lista albo kafelek
  // nie zmieniły się pod palcem między celowaniem a kliknięciem
  viewEl.addEventListener('pointerdown', ()=>{ fingerDown = {at:Date.now(), version:layoutVersion}; }, true);
  if(!window.PointerEvent) viewEl.addEventListener('touchstart', ()=>{ fingerDown = {at:Date.now(), version:layoutVersion}; }, true);

  viewEl.addEventListener('click',e=>{
    // podczas zaznaczania grupy stuknięcie w kafelek tylko go zaznacza — żadnych
    // rezerwacji ani spacerów „przy okazji", także z puszczenia przytrzymanego palca
    if(state.select){ try{ togglePick(e); }catch(err){ cancelSelect(); } return; }
    try{ handleAction(e); }
    catch(err){ toast('Coś poszło nie tak — spróbuj ponownie'); needRefresh=true; if(!isSending() && !queue.length) refresh(); }
  });

  function handleAction(e){
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.dataset.act;
    const id=btn.dataset.id?Number(btn.dataset.id):null;
    const n=btn.dataset.slot?Number(btn.dataset.slot):1;   // który spacer psa

    /* --- miniony dzień: mail z listą psów dla schroniska --- */
    if(act==='copyMail'){ copyMail(btn.dataset.date); return; }
    if(act==='sendMail') return;                    // zwykły link mailto: — telefon sam otwiera pocztę

    /* --- wolontariusze: spacery --- */
    if(!state.admin && tapRefused(e, btn)) return;
    if(act==='reserve') openEntry(id, n, btn);
    if(act==='confirm'){
      const scope=btn.closest('li')||viewEl;
      const el=scope.querySelector(`[data-input="${id}"][data-slot="${n}"]`); const val=el.value.trim();
      if(!val){ el.focus(); return; }
      lastWho = val;
      doReserve(id, n, val);
    }
    if(act==='walk'){
      const g=slotOf(state.date, id, n).group;
      if(g) doGroupWalk(g); else doWalk(id, n);
    }
    if(act==='free') doFree(id, n);

    /* --- wolontariusze: zadania (✕ ma własny data-act, więc tu nie wpada) --- */
    if(act==='taskToggle') doTaskToggle(id);

    /* --- tryb edycji (rzadkie akcje — pełna synchronizacja z serwerem) --- */
    if(act==='edit'){ state.editId=id; render('self'); }
    if(act==='editCancel'){ state.editId=null; render('self'); }
    if(act==='editSave'){
      const fields={name:ef('name'),ident:ef('ident'),box:ef('box'),dif:ef('dif'),
                    note:ef('note'),walks:Number(ef('walks'))===2?2:1,
                    noteUntil: efChecked('noteForever') ? NOTE_FOREVER : ef('noteUntil')};
      if(!fields.name && !fields.ident){ toast('Podaj imię lub nr identyfikacyjny'); return; }
      if(fields.noteUntil && !fields.note) fields.noteUntil='';   // termin bez notatki nic nie znaczy
      if(fields.noteUntil && fields.noteUntil!==NOTE_FOREVER && state.today && fields.noteUntil < state.today){
        toast('Data notatki nie może być z przeszłości'); return;
      }
      const dog=findDog(id);
      if(dog) Object.assign(dog, fields);           // optymistycznie od razu
      state.editId=null;
      render('self');
      enqueue('updateDog',[id,fields,state.pin],{key:keyDog(id),reconcile:applyFull_});
    }
    if(act==='remove'){
      const dog=findDog(id);
      if(!confirm('Usunąć psa: '+(dog?dogLabel(dog):'')+'?')) return;
      state.dogs=state.dogs.filter(x=>x.id!==id);   // optymistycznie znika od razu
      render('self');
      enqueue('removeDog',[id,state.pin],{reconcile:applyFull_});
    }
    if(act==='add') doAddDog();
    if(act==='taskAdd'){
      const el=document.getElementById('newTask'); const text=el.value.trim();
      if(!text){ el.focus(); return; }
      const dateEl=document.getElementById('newTaskDate');
      const date=(dateEl && dateEl.value) || state.bizDate;
      if(state.bizDate && date < state.bizDate){ toast('Zadanie nie może być na dzień, który już minął'); return; }
      el.value='';
      delete state.form.newTask; delete state.form.newTaskDate;
      enqueue('addTask',[text,state.pin,date],{reconcile:res=>{
        applyFull_(res);
        if(isFuture(date)) toast('Zaplanowane ' + taskPlanned({date}));
      }});
    }
    if(act==='diagRetry'){ state.diag = null; render('nav'); fetchDiag(); }
    if(act==='resetMail'){ state.mailDraft = null; render('nav'); }
    if(act==='saveMail'){
      const v = id => { const el = viewEl.querySelector('#' + id); return el ? el.value : ''; };
      const f = {to: v('mailTo'), subject: v('mailSubject'), body: v('mailTemplate')};
      // te same reguły co setMailSettings na serwerze, ale od razu: zapis jest w RETRIABLE, więc
      // odrzucenie przez serwer kolejka ponawia raz i komunikat szedłby dwa przeloty (review PR #4)
      const problem = mailProblem(f);
      if(problem){ toast(problem); return; }
      enqueue('setMailSettings',[f,state.pin],{key:'settings',reconcile:res=>{
        if(res && typeof res.mailTemplate === 'string') state.mailTemplate = res.mailTemplate;
        if(res && typeof res.mailTo === 'string') state.mailTo = res.mailTo;
        if(res && typeof res.mailSubject === 'string') state.mailSubject = res.mailSubject;
        state.mailDraft = null;
        toast('Ustawienia maila zapisane', 'ok');
        safeRender();
      }});
    }
    if(act==='allWalks'){
      const w = Number(btn.dataset.walks)===2 ? 2 : 1;
      if(!confirm(w===2 ? 'Ustawić DWA spacery dziennie dla wszystkich psów?'
                        : 'Wrócić do JEDNEGO spaceru dziennie dla wszystkich psów?')) return;
      enqueue('setAllWalks',[w,state.pin],{reconcile:res=>{
        applyFull_(res);
        toast(w===2 ? 'Wszystkie psy: 2 spacery' : 'Wszystkie psy: 1 spacer');
      }});
    }
    if(act==='taskRemove'){
      const t=state.tasks.find(x=>x.id===id);
      if(!confirm('Usunąć zadanie: '+(t?t.text:'')+'?')) return;
      state.tasks=state.tasks.filter(x=>x.id!==id);   // optymistycznie
      render('self');
      enqueue('removeTask',[id,state.pin],{reconcile:applyFull_});
    }
  }

  viewEl.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    // przycisk mógł zniknąć między renderami — brak guzika nie może wywalić handlera
    const hit = sel => { const b = viewEl.querySelector(sel); if(b) b.click(); };
    if(e.target.matches('[data-input]')){
      const scope = e.target.closest('li') || viewEl, b = scope.querySelector(
        `[data-act="confirm"][data-id="${e.target.dataset.input}"][data-slot="${e.target.dataset.slot||1}"]`);
      if(b) b.click();
    }
    // Enter z klawiatury telefonu zostawia fokus w polu, a fokus w polu to dla busyEditing()
    // „ktoś pisze" — dodany pies czy zadanie nie pojawiały się, dopóki ktoś nie stuknął obok
    // (dalszy ciąg buga nr 10). Wysłane pole oddaje fokus, jak po stuknięciu w przycisk.
    if(e.target.id==='newName'||e.target.id==='newIdent'||e.target.id==='newBox'){ e.target.blur(); hit('[data-act="add"]'); }
    if(e.target.id==='newTask'){ e.target.blur(); hit('[data-act="taskAdd"]'); }
  });

  /* =========================================================
     START + AUTO-ODŚWIEŻANIE + SAMOLECZENIE
     ========================================================= */
  /**
   * Stan wpisany w stronę przez serwer (bootJson_ w WebApp.gs) — lista rysuje się
   * od razu, bez drugiego przelotu do serwera po załadowaniu strony. Brak, pusto
   * albo coś nieczytelnego = zwykłe getData, jak dawniej.
   */
  function bootData(){
    try{
      const el = document.getElementById('boot');
      const d = el ? JSON.parse(el.textContent) : null;
      return d && Array.isArray(d.dogs) ? d : null;
    } catch(e){ return null; }
  }

  document.getElementById('today').textContent=todayStr();
  const boot = bootData();
  if(boot){ applyData(boot); render('self'); }
  else refresh();
  // co 15 s, ale tylko gdy karta widoczna, kolejka pusta i nikt nie pisze w polu
  setInterval(()=>{ if(!document.hidden && !isSending() && !queue.length && !busyEditing()) refresh(); }, 15000);
  // strażnik zawieszonych zapisów: cyklicznie...
  setInterval(checkStuck, 3000);
  // ...i przy każdym dotknięciu ekranu (działa nawet gdy przeglądarka uśpiła timery).
  // Przy okazji każde dotknięcie odsuwa przestawienie listy — patrz markTap().
  function onTouch(){ checkStuck(); markTap(); }
  document.addEventListener('pointerdown', onTouch, true);
  document.addEventListener('touchstart', onTouch, true);
  // powrót do karty (np. odblokowanie telefonu): najpierw ratuj zawieszony zapis, potem odśwież
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    checkStuck();
    if(!isSending() && !queue.length && !busyEditing()) refresh();
  });
</script>

<script>
  /* =========================================================
     STAN I STAŁE
     ========================================================= */
  const DIF = {
    easy:{label:"łatwy", color:"#3f9e57"},
    med :{label:"wymagający", color:"#d99a1c"},
    hard:{label:"bardzo wymagający", color:"#cf4a3a"},
  };
  const WATCHDOG_MS = 12000;   // po tylu ms bez odpowiedzi uznajemy zapis za zaginiony (i raz ponawiamy)

  /**
   * Czasy zachowania listy (ms). Testy skracają je przez window.__G13_TIMING — tylko harness;
   * na telefonie obowiązują wartości domyślne.
   *   quiet    — cisza po ostatnim dotknięciu, zanim lista może się przestawić,
   *   announce — tyle wisi dymek „Aktualizuję…", zanim kafelki faktycznie się przesuną,
   *   tapGuard — stuknięcie tuż po ruchu listy albo zmianie kafelka nie liczy się (patrz tapRefused),
   *   busyMin  — najkrótszy czas pokazania dymka, żeby w ogóle dało się go zobaczyć.
   */
  const T = Object.assign({ quiet:4000, announce:800, tapGuard:500, busyMin:600 }, window.__G13_TIMING || {});

  const state = {
    dogs:[],               // KATALOG psów — kim są; stan dnia żyje osobno, w `slots`
    slots:{},              // spacer psa danego dnia: `${data}|${id}|${nr}` -> {status, who, time, group}
    volunteers:{},         // kolory wolontariuszy: data -> {imię (znormalizowane) -> numer koloru}
    tasks:[],
    today:null,            // data kalendarzowa serwera (Europe/Warsaw) — do "od wczoraj" i terminów notatek
    bizDate:null,          // bieżący dzień rezerwacyjny: od godziny resetu, nie od północy (businessDate_)
    date:null,             // dzień wybrany strzałkami
    follow:true,           // czy wybrany dzień idzie za bieżącym (po resecie przeskakuje sam)
    past:{},               // minione dni do podglądu: data -> [{name, who, time}]
    pastLoading:{},        // data -> kiedy poszło pytanie o nią
    view:"today",          // today | diag
    admin:false, pin:null, loaded:false,
    editId:null,           // pies aktualnie edytowany w trybie edycji
    resetHour:22,          // godzina nocnego czyszczenia — ustawiana z panelu
    mailTemplate:'',       // treść maila z listą spacerów dnia (z serwera, ustawiana z panelu); '' = bez przycisków
    mailTo:'',             // odbiorcy tego maila, „a@b.pl, c@d.pl"; '' = adres wpisuje się w poczcie
    mailSubject:null,      // temat z [DATA]; null = serwer sprzed 1.2 — bez „Wyślij", zostaje „Skopiuj"
    mailDraft:null,        // {to, subject, body} pisane w panelu, jeszcze niezapisane — przeżywa przerysowanie
    mailFallback:null,     // {date, text} — schowek nie zadziałał: mail do ręcznego skopiowania
    form:{},               // szkice formularzy trybu edycji („Dodaj psa", „Nowe zadanie"): id pola -> wartość (formVal)
    adding:[],             // psy w drodze na serwer: [{token, name, ident, box, dif, done}] — w katalogu jako „dodaję…"
    env:null,              // 'prod' albo cokolwiek innego; null = jeszcze nie wiemy
    diag:null,             // dane serwerowe do zakładki "Panel"
    select:null,           // zaznaczanie spacerów do grupy: {date, anchor, gid, ids, seen} ('pies:spacer') albo null
  };
  const viewEl = document.getElementById('view');
  const gear   = document.getElementById('gear');

  /**
   * Imię ostatnio wpisane na tym telefonie — podpowiadane przy kolejnych psach.
   * Kto bierze trzy psy pod rząd, wpisuje je raz, potem tylko potwierdza.
   */
  let lastWho = '';

  /* =========================================================
     DROBIAZGI
     ========================================================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function dogLabel(d){ return d.name || (d.ident ? '#'+d.ident : 'Pies '+d.id); }
  function findDog(id){ return state.dogs.find(x=>x.id===id); }
  /**
   * Napis na przycisku „spacer odbyty" — jedno miejsce dla kafelka, pól 1/2 i 2/2 i grupy.
   * Krótki, bo wiersz spaceru (opiekun + ten przycisk + „Zwolnij") ma się mieścić w jednej
   * linijce na zwykłym telefonie: „Wyprowadzony ✓" to 129 px i przy 360–393 px każdy spacer
   * psa dwuspacerowego zajmował dwie linijki; „Wrócił ✓" to 73 px (feedback z testów).
   */
  const WALK_LABEL = 'Wrócił ✓';
  function localHM(){ const d=new Date(); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  /* ---------- spacery psa ----------
     Katalog mówi, KIM jest pies; `slots` mówi, co się dzieje z KONKRETNYM SPACEREM psa
     danego dnia. Pies na dwa spacery ma spacery 1 i 2 — każdy z własną rezerwacją,
     stanem i grupą. Brak wpisu = spacer wolny i bez grupy. Model danych i to, jak
     z niego powstaje lista, opisuje SORTING.md. */
  const FREE_SLOT = {status:'free', who:'', time:'', group:0};
  function skey(date, id, n){ return date+'|'+id+'|'+n; }
  function slotOf(date, id, n){ return state.slots[skey(date, id, n)] || FREE_SLOT; }
  function setSlot(date, id, n, s){
    state.slots[skey(date, id, n)] = {status:s.status||'free', who:s.who||'', time:s.time||'', group:posInt(s.group)};
  }
  /** Numer grupy: dodatnia liczba całkowita albo 0 (jak posInt_ na serwerze) — 1.5 wywracało rysowanie. */
  function posInt(v){ const n = Number(v); return Number.isInteger(n) && n > 0 ? n : 0; }
  function hasState(s){ return s.status==='reserved' || s.status==='walked' || s.group > 0; }
  /** Ile spacerów ma pies danego dnia — jak slotCount_ na serwerze (dalszy spacer ze stanem zostaje widoczny). */
  function slotCount(dog, date){
    let n = dog.walks===2 ? 2 : 1;
    if(slotMemo) return Math.max(n, slotMemo.count.get(date+'|'+dog.id) || 0);
    const pre = date+'|'+dog.id+'|';
    for(const k in state.slots){
      if(k.indexOf(pre)!==0) continue;
      const m = Number(k.slice(pre.length));
      if(m > n && hasState(state.slots[k])) n = m;
    }
    return n;
  }
  /** Spacery psa danego dnia, od pierwszego: [{n, status, who, time, group}]. */
  function slotsOf(date, dog){
    const out = [], count = slotCount(dog, date);
    for(let n=1; n<=count; n++) out.push(Object.assign({n}, slotOf(date, dog.id, n)));
    return out;
  }

  /**
   * Indeks spacerów na czas JEDNEGO rysowania (render, patchDog): ile spacerów ma pies danego
   * dnia i kiedy ostatnio wyszedł. slotCount i lastWalkOf przeglądały przy każdym wywołaniu
   * wszystkie spacery wszystkich dni — przy rezerwacjach na rok naprzód pełne rysowanie
   * szło ze 20 do ponad 300 ms (review PR #2). W trakcie rysowania stan się nie zmienia,
   * więc jeden przegląd wystarcza; poza rysowaniem liczymy jak dotąd, wprost ze stanu.
   */
  let slotMemo = null;
  function withSlotMemo(fn){
    if(slotMemo) return fn();
    const count = new Map(), lastWalk = new Map();
    for(const k in state.slots){
      const p = k.split('|'), s = state.slots[k], key = p[0]+'|'+p[1], m = Number(p[2]);
      if(hasState(s) && m > (count.get(key) || 0)) count.set(key, m);
      if(s.status==='walked' && isPast(p[0]) && p[0] > (lastWalk.get(p[1]) || '')) lastWalk.set(p[1], p[0]);
    }
    slotMemo = {count, lastWalk};
    try{ return fn(); } finally{ slotMemo = null; }
  }
  /** Odnośnik do spaceru w grupach i zaznaczaniu: 'pies:spacer' — ten sam, którego używa setGroup. */
  function sref(id, n){ return id+':'+n; }
  function parseRef(r){ const p = String(r).split(':'); return {id:Number(p[0]), n:Number(p[1])||1}; }
  /**
   * Stary kształt (wiersz na psa: bieżący spacer w status/kto, odbyty pierwszy z dwóch
   * w kto1) -> spacery — jak legacySlots_ na serwerze. Tak przychodzą dane ze starszego
   * serwera i odpowiedzi {dog}; na nich stoi też część starszych testów.
   */
  function legacySlots(w){
    const cur = {status:w.status||'free', who:w.who||'', time:w.time||'', group:posInt(w.group)};
    if(!w.who1) return [Object.assign({n:1}, cur)];
    return [{n:1, status:'walked', who:w.who1, time:w.time1||'', group:0}, Object.assign({n:2}, cur)];
  }

  /* ---------- daty ---------- */
  /** Data przesunięta o n dni — arytmetyka kalendarza w UTC, niezależna od strefy telefonu. */
  function addDays(iso, n){
    const p=iso.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1]-1, p[2]+n)).toISOString().slice(0,10);
  }
  function dayDiff(from, to){ return Math.round((Date.parse(to) - Date.parse(from))/864e5); }
  function isPast(iso){ return !!state.bizDate && iso < state.bizDate; }
  function isFuture(iso){ return !!state.bizDate && iso > state.bizDate; }
  function plural(n, one, few, many){
    if(n===1) return one;
    const d=n%10, t=n%100;
    return (d>=2 && d<=4 && !(t>=12 && t<=14)) ? few : many;
  }

  /** Ile dni temu (względem daty serwera) — null gdy brak danych. */
  function daysAgo(iso){
    if(!iso || !state.today) return null;
    const ms = Date.parse(state.today) - Date.parse(iso);
    return isNaN(ms) ? null : Math.round(ms/864e5);
  }
  function todayStr(){
    try{return new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
    catch(e){return "dziś";}
  }
  /**
   * Komunikat na dole ekranu. `kind` 'ok' — zielony (udało się), bez niego czerwony (błąd, uwaga).
   * Każdy stoi pełne 2,6 s: zegar poprzedniego nie gasi następnego (wcześniej drugi komunikat
   * tuż po pierwszym znikał po ułamku sekundy).
   */
  let toastTimer = null;
  function toast(msg, kind){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    t.classList.toggle('ok', kind==='ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'),2600);
  }
  /**
   * Czy ktoś właśnie coś wpisuje — wtedy nie przerysowujemy mu ekranu pod palcami.
   * Otwarte pole liczy się TYLKO to wolontariusza („Twoje imię", [data-entry]).
   * Wcześniej łapało każde widoczne `.entry`, a pole nowego zadania w trybie edycji
   * jest widoczne zawsze — przez to w trybie edycji nic się nigdy nie przerysowywało
   * i dodany pies czy zadanie nie pojawiały się po odpowiedzi serwera (S70).
   */
  function busyEditing(){
    if(state.editId!==null) return true;
    if(state.select) return true;             // zaznaczanie psów do grupy — lista ma stać w miejscu
    if(document.querySelector('[data-entry]:not(.hidden)')) return true;
    const a=document.activeElement;
    return !!(a && (a.tagName==='INPUT' || a.tagName==='SELECT' || a.tagName==='TEXTAREA'));
  }
  /**
   * Dymek u góry ekranu: „Zapisuję…", dopóki cokolwiek leci na serwer, a „Aktualizuję…"
   * tylko w oknie zapowiedzi (reorderDueAt, T.announce) — tuż przed tym, jak lista
   * naprawdę się przesunie. Nie przez całą ciszę przed nią: przy ciągłej pracy dymek
   * świeciłby wtedy bez przerwy i mówił „czekaj, coś się mieli" (review PR #2).
   * Dawny napis „zapisywanie…" w nagłówku był za mały, żeby ktokolwiek go zauważył.
   * Kropki animuje CSS (.dots). Znika najwcześniej po T.busyMin — krótszego mignięcia
   * nikt nie zobaczy.
   */
  let busyShownAt = 0, busyHideTimer = null;
  function busyKind(){
    if(inflight.size || queue.length) return 'save';
    if(orderPending && reorderDueAt && state.view==='today' && !state.admin && !busyEditing()) return 'sort';
    return null;
  }
  function updateBusy(){
    const el = document.getElementById('busy');
    if(!el) return;
    const k = busyKind();
    if(k){
      clearTimeout(busyHideTimer); busyHideTimer = null;
      if(el.classList.contains('hidden')){ busyShownAt = Date.now(); el.classList.remove('hidden'); }
      document.body.classList.add('busy-on');       // toast staje wtedy nad dymkiem (oba są na dole)
      el.dataset.kind = k;
      document.getElementById('busyTxt').textContent = k==='save' ? 'Zapisuję' : 'Aktualizuję';
      return;
    }
    if(el.classList.contains('hidden') || busyHideTimer) return;
    busyHideTimer = setTimeout(()=>{
      busyHideTimer = null;
      if(busyKind()) updateBusy();
      else { el.classList.add('hidden'); document.body.classList.remove('busy-on'); }
    }, Math.max(0, busyShownAt + T.busyMin - Date.now()));
  }

  /* =========================================================
     LOG WYWOŁAŃ (zasila zakładkę "Panel")
     ========================================================= */
  const callLog = [];
  function logCall(fn, ms, outcome){
    callLog.unshift({ t: localHM(), fn, ms, outcome });
    if(callLog.length > 30) callLog.pop();
    if(state.view==='diag') safeRender();
  }

  /**
   * Awaryjne wejście do panelu bez PIN-u: 5 tapnięć w datę u góry.
   * Liczymy `pointerdown`, nie `click` — na telefonie szybka seria tapnięć bywa
   * zjadana przez rozpoznawanie gestów (zaznaczanie tekstu, double-tap), więc
   * część kliknięć nigdy nie dolatywała i licznik nie dochodził do pięciu.
   */
  let tapCount = 0, tapAt = 0;
  (function bindDiagGesture(){
    const el = document.getElementById('today');
    if(!el) return;
    const bump = ()=>{
      const now = Date.now();
      tapCount = (now - tapAt < 2000) ? tapCount + 1 : 1;
      tapAt = now;
      if(tapCount >= 5){
        tapCount = 0;
        state.view = (state.view==='diag') ? 'today' : 'diag';
        render('nav');
        if(state.view==='diag'){ toast('Panel diagnostyczny'); fetchDiag(); }
      }
    };
    el.addEventListener('pointerdown', bump);
    if(!window.PointerEvent) el.addEventListener('touchstart', bump);   // starsze WebView
  })();

  /* =========================================================
     KOLEJKA ZAPISÓW
     Interfejs jest optymistyczny: klik zmienia stan lokalny od razu,
     a zapis idzie w tle. Kolejka pilnuje, żeby leciał JEDEN zapis naraz
     (zero walki o blokadę serwera z samym sobą), a watchdog gwarantuje,
     że nawet zaginiona odpowiedź niczego nie zawiesi na stałe.
     ========================================================= */
  const queue = [];
  /**
   * Zapisy w drodze, po jednym na "tor" (tor = byt: dog:1, task:3, _full).
   * RÓŻNE psy jadą RÓWNOLEGLE, ten sam pies zawsze po kolei.
   * Wcześniej leciał jeden zapis naraz w całej aplikacji — przy rezerwacji
   * kilku psów pod rząd każdy czekał na poprzedni (Apps Script to 1-3 s na
   * wywołanie), więc trzeci klik potrafił wisieć ~10 s zanim w ogóle wyruszył.
   */
  const inflight = new Map();   // lane -> {at, settle, fn}
  const MAX_INFLIGHT = 4;       // sensowny sufit, żeby nie zalać Apps Scriptu
  let needRefresh = false;      // po błędzie/watchdogu dosynchronizuj, gdy kolejka się opróżni

  function isSending(){ return inflight.size > 0; }

  /**
   * Zapisy bezpieczne do automatycznego ponowienia (idempotentne). `addDog` — od 1.2, bo niesie
   * token dodania (addDogToken): serwer pamięta ostatnie i powtórki psa drugi raz nie dokłada.
   */
  const RETRIABLE = new Set(['reserve','markWalked','setFree','undoFirstWalk','setTaskDone','addDog','updateDog','removeDog','removeTask','setResetHour','setAllWalks','setMailTemplate','setMailSettings']);

  /**
   * Licznik zapisów wpuszczonych do kolejki. Odczyt pełnego stanu (refresh) zapamiętuje go przy
   * wysłaniu: gdy w międzyczasie ruszył i skończył się jakiś zapis, odpowiedź jest sprzed niego
   * i cofnęłaby go na ekranie — rezerwacja zrobiona w trakcie 15-sekundowego odświeżenia wracała
   * do „wolny" aż do następnego (S113).
   */
  let writeSeq = 0;

  /**
   * Licznik zapisów w drodze per byt ('dog:1', 'task:3').
   * Dopóki > 0: (a) interfejs pokazuje przy bycie kręciołek "zapisuję",
   * (b) starsze odpowiedzi serwera dla tego bytu są IGNOROWANE — tylko
   * odpowiedź na ostatnią operację ma prawo skorygować stan lokalny.
   * To eliminuje przeskoki przy szybkich sekwencjach (rezerwuj -> zwolnij).
   */
  const pendingKeys = new Map();
  /**
   * Klucz spaceru to pies, numer spaceru I dzień — rezerwacja 1/2 i 2/2, a także na dziś
   * i na sobotę, to różne byty: jadą równolegle, każdy na swoim torze.
   */
  function keySlot(id, n, date){ return 'dog:'+id+'.'+n+'@'+(date||state.date); }
  /** Edycja psa w katalogu (tryb edycji) — byt to sam pies. */
  function keyDog(id){ return 'dog:'+id; }
  function keyTask(id){ return 'task:'+id; }
  function isPending(key){ return (pendingKeys.get(key)||0) > 0; }

  /**
   * `opts.reconcile(res)` — odpowiedź na ostatnią operację bytu; `opts.fail(msg)` — zapis
   * ostatecznie się nie udał (już po ewentualnej powtórce), np. żeby oddać wpisane dane.
   */
  function enqueue(fn, args, opts){
    opts = opts || {};
    writeSeq++;
    if(opts.key) pendingKeys.set(opts.key, (pendingKeys.get(opts.key)||0)+1);
    queue.push({
      fn, args,
      key: opts.key||null,
      lane: opts.key || '_full',      // akcje edycyjne (pełny stan) trzymamy na jednym torze
      reconcile: opts.reconcile||null,
      fail: opts.fail||null,
      attempts: 0,
    });
    pump();
  }

  /** Wysyła co się da: wolne tory ruszają równolegle, zajęte czekają w kolejce. */
  function pump(){
    for(let i=0; i<queue.length && inflight.size < MAX_INFLIGHT; ){
      if(inflight.has(queue[i].lane)){ i++; continue; }   // ten byt ma już zapis w drodze
      ship(queue.splice(i,1)[0]);
    }
    if(!inflight.size && !queue.length && needRefresh){ needRefresh=false; refresh(); }
    updateBusy();
  }

  function ship(job){
    let settled = false;
    const slot = { at: Date.now(), settle: null, fn: job.fn };
    inflight.set(job.lane, slot);

    /** Jedyne wyjście z zapisu — odporne na wyjątki, nigdy nie zostawia zajętego toru. */
    function settle(outcome){
      if(settled) return; settled = true;
      clearTimeout(watchdog);
      inflight.delete(job.lane);             // NAJPIERW zwolnij tor — nic poniżej tego nie cofnie
      logCall(job.fn, Date.now() - slot.at, outcome.ok ? 'ok' : (outcome.msg||'błąd'));

      // nieudany, ale bezpieczny do ponowienia zapis -> jedna automatyczna powtórka
      if(!outcome.ok && job.attempts === 0 && RETRIABLE.has(job.fn)){
        job.attempts = 1;
        queue.unshift(job);                  // klucz pending zostaje policzony — to wciąż ta sama operacja
        pump();
        return;
      }

      if(job.key){
        const c = (pendingKeys.get(job.key)||1) - 1;
        if(c > 0) pendingKeys.set(job.key, c); else pendingKeys.delete(job.key);
      }

      try{
        if(outcome.ok){
          if(job.reconcile && !isPending(job.key)){
            job.reconcile(outcome.res);      // ostatnia operacja dla bytu — stosujemy prawdę serwera
          } else if(!isPending(job.key)){
            safeRender();                    // zgaś kręciołek "zapisuję" przy bycie
          }
        } else {
          toast(outcome.msg || 'Nie udało się zapisać — dosynchronizuję');
          needRefresh = true;                // optymistyczna zmiana mogła być błędna — skoryguje ją odświeżenie
          if(job.fail) job.fail(outcome.msg);
          if(!isPending(job.key)) safeRender();
        }
      } catch(e){
        needRefresh = true;                  // wyjątek w reconcile/render nie może ubić kolejki
      }
      pump();
    }
    slot.settle = settle;

    const watchdog = setTimeout(()=>{
      settle({ok:false, msg:'Serwer długo nie odpowiada — dosynchronizuję'});
    }, WATCHDOG_MS);

    try{
      google.script.run
        .withSuccessHandler(res=>{ settle({ok:true, res}); })
        .withFailureHandler(err=>{
          settle({ok:false, msg: err && err.message ? err.message.replace(/^Error:\s*/,'') : 'Nie udało się zapisać'});
        })
        [job.fn](...job.args);   // wywołanie NA skonfigurowanym runnerze (bez .apply z podmianą this)
    } catch(e){
      settle({ok:false, msg:'Błąd połączenia — dosynchronizuję'});
    }
  }

  /**
   * Ratunek na zaginione odpowiedzi przy uśpionych timerach (telefon w kieszeni,
   * karta w tle): sprawdzane co 3 s ORAZ przy każdym dotknięciu ekranu i powrocie
   * do karty. Jeśli zapis wisi dłużej niż watchdog + margines, domykamy go ręcznie —
   * jedno tapnięcie zawsze przywraca aplikację do życia, bez odświeżania strony.
   */
  function checkStuck(){
    const now = Date.now();
    [...inflight.values()].forEach(slot=>{
      if(slot.settle && now - slot.at > WATCHDOG_MS + 3000){
        slot.settle({ok:false, msg:'Połączenie zerwane — dosynchronizuję'});
      }
    });
  }

  /* =========================================================
     ODŚWIEŻANIE (odczyt pełnego stanu)
     ========================================================= */
  function applyData(res){
    state.dogs=res.dogs; state.tasks=res.tasks; state.today=res.today; state.loaded=true;
    // dodany pies jest już w katalogu z serwera — wiersz „dodaję…" znika dopiero teraz, bez mrugnięcia
    state.adding = state.adding.filter(a => !a.done);
    const prevBiz = state.bizDate;
    state.bizDate = res.businessDate || res.today;
    state.slots = {};
    if(Array.isArray(res.slots)) res.slots.forEach(s=>setSlot(s.date, s.dogId, s.slot||1, s));
    // serwer sprzed spacerów: wiersz na psa i dzień; sprzed dat: stan tylko bieżącego dnia, wpisany w psy
    else if(Array.isArray(res.walks)) res.walks.forEach(w=>legacySlots(w).forEach(s=>setSlot(w.date, w.dogId, s.n, s)));
    else res.dogs.forEach(d=>legacySlots(d).forEach(s=>setSlot(state.bizDate, d.id, s.n, s)));
    state.volunteers = res.volunteers || {};
    if(typeof res.mailTemplate === 'string') state.mailTemplate = res.mailTemplate;
    if(typeof res.mailTo === 'string') state.mailTo = res.mailTo;
    if(typeof res.mailSubject === 'string') state.mailSubject = res.mailSubject;
    if(prevBiz && prevBiz !== state.bizDate) state.past = {};    // wczorajszy „bieżący" dzień jest już miniony

    // Kto pracował na bieżącym dniu, po resecie od razu pracuje na nowym — ale nie
    // w chwili, gdy wpisuje imię albo edytuje psa: wtedy dojdzie przy kolejnym odświeżeniu.
    if(!state.date || (state.follow && !busyEditing())) state.date = state.bizDate;
    if(state.date === state.bizDate) state.follow = true;

    if(typeof res.resetHour === 'number'){ state.resetHour = res.resetHour; showResetHour(); }
    state.env = typeof res.env === 'string' ? res.env : '';
    showEnv();
  }

  /**
   * Pasek „środowisko testowe". Pokazujemy go wszędzie poza produkcją, czyli
   * wszędzie tam, gdzie serwer NIE powiedział `prod` — brak deklaracji to też
   * nie-produkcja (patrz env_() w Settings.gs).
   *
   * Do czasu pierwszej odpowiedzi serwera pasek zostaje schowany: inaczej
   * produkcja mignęłaby ostrzeżeniem przy każdym otwarciu strony i po tygodniu
   * nikt by na nie nie patrzył.
   */
  function showEnv(){
    const bar = document.getElementById('envbar');
    if(!bar) return;
    bar.classList.toggle('hidden', !state.loaded || state.env === 'prod');
  }

  /** Nagłówek mówi o godzinie czyszczenia — musi iść za ustawieniem. */
  function showResetHour(){
    const hh = String(state.resetHour).padStart(2,'0') + ':00';
    const a = document.getElementById('resetNote');
    if(a) a.textContent = '↺ czyści się o ' + hh;
  }
  /** Render, który nie wyrywa nikomu klawiatury spod palców. */
  function safeRender(cause){ if(!busyEditing()) render(cause); else updateBusy(); }

  /**
   * Pełny stan z serwera (akcje edycyjne). Gdy w kolejce czekają
   * kolejne zapisy, nie nadpisujemy nim nowszych lokalnych zmian —
   * dosynchronizujemy się dopiero po opróżnieniu kolejki.
   */
  function applyFull_(res){
    if(queue.length || pendingKeys.size){ needRefresh=true; return; }
    applyData(res); safeRender();
  }

  function refresh(){
    if(isSending() || queue.length) return;   // trwają zapisy — odczyt byłby nieaktualny
    const seq = writeSeq;
    google.script.run
      .withSuccessHandler(res=>{
        if(isSending() || queue.length) return;   // w międzyczasie ruszył zapis
        // zapis ruszył i zdążył się skończyć: odczyt jest sprzed niego — pytamy jeszcze raz
        if(seq !== writeSeq){ needRefresh = true; pump(); return; }
        applyData(res); safeRender();
      })
      .withFailureHandler(()=>{ if(!state.loaded) viewEl.innerHTML='<div class="empty">Brak połączenia. Odśwież stronę.</div>'; })
      .getData();
  }

  /**
   * Minione dni (tylko podgląd) dociągamy blokami po dwa tygodnie wstecz od
   * wybranego — kolejne stuknięcia strzałką w tył trafiają już w pamięć i nie
   * czekają na serwer. Dzień, o który pytanie wisi dłużej niż watchdog, wolno
   * pobrać od nowa; zamrożony ekran „Wczytuję…" nie może się zdarzyć.
   */
  const PAST_BLOCK = 14;
  function fetchPast(date){
    const now = Date.now();
    if(state.past[date] || (state.pastLoading[date] && now - state.pastLoading[date] < WATCHDOG_MS)) return;
    const from = addDays(date, -(PAST_BLOCK-1));
    const days = [];
    for(let d=from; d<=date; d=addDays(d,1)) days.push(d);
    days.forEach(d=>{ state.pastLoading[d] = now; });
    google.script.run
      .withSuccessHandler(res=>{
        const got = {};
        days.forEach(d=>{ got[d] = []; delete state.pastLoading[d]; });
        ((res && res.history) || []).forEach(e=>{ if(got[e.date]) got[e.date].push(e); });
        Object.assign(state.past, got);
        if(state.view==='today' && isPast(state.date)) safeRender();
      })
      .withFailureHandler(()=>{
        days.forEach(d=>{ delete state.pastLoading[d]; });
        if(state.view==='today' && state.date===date){
          viewEl.innerHTML = '<div class="empty">Nie udało się wczytać tego dnia — spróbuj strzałką jeszcze raz.</div>';
          invalidateHtml();
        }
      })
      .getHistoryDays(from, date);
  }

  /* =========================================================
     KOLEJNOŚĆ I UKŁAD LISTY — pełny opis z przykładami: SORTING.md

     Model: jednostką jest SPACER psa (1/2, 2/2…), nie pies. Z spacerów powstają
     KAFELKI: kafelek główny psa zbiera jego spacery bez grupy, a każdy spacer w grupie
     ma własny kafelek w bloku swojej grupy. Pies może więc stać w dwóch miejscach
     naraz: 1/2 w porannej grupie, a kafelek główny z 2/2 wysoko, bo czeka na chętnego.
     Bloki (kafelek główny albo cała grupa) sortuje jeden klucz — tileKey.

     Drugie pytanie to KIEDY. Gdyby lista układała się w chwili kliknięcia, pies
     uciekałby spod palca w środku akcji — a wolontariusz stoi z psem na smyczy.
     Kolejność jest więc zamrożona, dopóki cokolwiek się dzieje (canReorder), kliknięty
     kafelek zmienia się w miejscu (patchDog), a gdy ręce znieruchomieją, lista najpierw
     zapowiada ruch dymkiem „Aktualizuję…" i dopiero po chwili się przestawia.
     ========================================================= */
  let order = [];                  // spacery 'pies.nr' w kolejności wyświetlania (zamrożona)
  let orderDate = null;            // dzień, dla którego ta kolejność została policzona
  let orderPending = false;        // czy lista czeka na przestawienie (dymek „Aktualizuję…")
  let lastTapAt = 0;
  let reorderTimer = null;
  let reorderDueAt = 0;            // kiedy zapowiedziane przestawienie ma się wykonać (0 = niezapowiedziane)

  function canReorder(){
    if(pendingKeys.size || queue.length || inflight.size) return false;
    if(busyEditing()) return false;
    return (Date.now() - lastTapAt) > T.quiet;
  }

  /** Dotknięcie ekranu odsuwa przestawienie listy (i odwołuje zapowiedziane) — umawia je na później. */
  function markTap(){
    lastTapAt = Date.now();
    reorderDueAt = 0;
    clearTimeout(reorderTimer);
    reorderTimer = setTimeout(()=>{ if(canReorder()) safeRender(); }, T.quiet + 200);
    updateBusy();                                  // odwołana zapowiedź gasi „Aktualizuję…"
  }

  /**
   * Kafelki dnia. Kafelek główny psa: jego spacery BEZ grupy (1-spacerowy: jedyny,
   * 2-spacerowy: oba pola 1/2 i 2/2 razem). Spacer w grupie: własny kafelek, w bloku
   * grupy. `full` — kafelek z pełną informacją o psie: główny, a gdy go nie ma (wszystkie
   * spacery w grupach), pierwszy z grupowych; reszta to małe kafelki „odłączone".
   */
  function buildTiles(date){
    const tiles = [];
    state.dogs.forEach((dog, idx) => {
      const all = slotsOf(date, dog);
      const loose = all.filter(s => !s.group), grouped = all.filter(s => s.group);
      if(loose.length) tiles.push({id:'m'+dog.id, dog, idx, all, slots:loose, gid:0, full:true});
      grouped.forEach((s, j) => tiles.push({id:'s'+dog.id+'.'+s.n, dog, idx, all, slots:[s], gid:s.group,
                                            full:!loose.length && j===0}));
    });
    return tiles;
  }

  /**
   * Klucz kafelka — im mniejszy, tym wyżej. Kolejno:
   *  1. czy kafelek ma jeszcze coś do zrobienia (wszystko odbyte → na dół),
   *  2. czy któryś jego spacer czeka na chętnego (wolny → nad zarezerwowanymi),
   *  3. ile spacerów dziennie potrzebuje pies (dwuspacerowe wyżej),
   *  4. ile spacerów pies ma dziś już odbytych (mniej → wyżej),
   *  5. opiekun — psy jednej osoby obok siebie, tylko gdy 1–4 nic nie rozstrzygają (rankKeys),
   *  6. kolejność z arkusza, 7. numer spaceru (żeby remis zawsze rozstrzygał się tak samo).
   * Tu powstaje klucz bez kryterium 5 — to jedno zależy od innych kafelków dnia.
   */
  function tileKey(t){
    return [ t.slots.every(s => s.status==='walked') ? 1 : 0,
             t.slots.some(s => s.status==='free') ? 0 : 1,
             -(t.dog.walks===2 ? 2 : 1),
             t.all.filter(s => s.status==='walked').length,
             t.idx,
             t.slots[0].n ];
  }
  function cmpKey(a, b){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
  function refOf(t, s){ return t.dog.id+'.'+s.n; }
  function blockOf(t){ return t.gid ? 'g'+t.gid : t.id; }

  /**
   * Opiekun kafelka: jedna osoba, która ma wszystkie jego zarezerwowane spacery, a na kafelku całym
   * odbytym — która je odbyła (imię jak przy kolorach — volNorm). Odbyte psy jednej osoby też mają
   * stać razem na dole listy (zgłoszenie z testu: dwa psy Ali rozdzielone psem Oli).
   * Kafelek w grupie, bez nikogo albo z dwiema osobami — ''.
   */
  function ownerOf(t){
    if(t.gid) return '';
    const done = t.slots.every(s => s.status==='walked');
    const who = new Set(t.slots.filter(s => s.status===(done ? 'walked' : 'reserved')).map(s => volNorm(s.who)));
    return who.size === 1 ? [...who][0] : '';
  }

  /**
   * Pełne klucze kafelków dnia, z kryterium 5 — opiekunem (zgłoszenie z produkcji 1.1: Draco
   * i Bysiu u Grzesia, a między nimi trzy inne psy). Kafelki, które reguły 1–4 stawiają na
   * równi, a mają tego samego opiekuna, dostają wspólne miejsce: najwcześniejsze w arkuszu
   * spośród nich. Przez granice reguł 1–4 opiekun nigdy psa nie przenosi (decyzja właściciela:
   * wszystkie wcześniejsze reguły ważniejsze) — to tylko rozstrzygnięcie remisu przed arkuszem.
   */
  function rankKeys(tiles){
    const base = new Map(), anchor = new Map();
    const cls = (k, who) => k.slice(0, 4).join(',') + '|' + who;
    tiles.forEach(t => {
      const k = tileKey(t), who = ownerOf(t);
      base.set(t, {k, who});
      if(!who) return;
      const c = cls(k, who);
      if(!anchor.has(c) || t.idx < anchor.get(c)) anchor.set(c, t.idx);
    });
    const keys = new Map();
    base.forEach(({k, who}, t) => keys.set(t, k.slice(0, 4).concat([who ? anchor.get(cls(k, who)) : t.idx], k.slice(4))));
    return keys;
  }

  /**
   * Kolejność spacerów policzona od nowa: bloki (kafelek główny albo cała grupa) po kluczu
   * swojego najpilniejszego kafelka, w bloku kafelki po własnym kluczu (rankKeys).
   */
  function sortedRefs(tiles){
    const keys = rankKeys(tiles), blocks = new Map();
    tiles.forEach(t => {
      const b = blockOf(t), k = keys.get(t), cur = blocks.get(b);
      if(!cur) blocks.set(b, {key:k, tiles:[t]});
      else { cur.tiles.push(t); if(cmpKey(k, cur.key) < 0) cur.key = k; }
    });
    const out = [];
    [...blocks.values()].sort((a,b) => cmpKey(a.key, b.key)).forEach(b =>
      b.tiles.sort((x,y) => cmpKey(keys.get(x), keys.get(y))).forEach(t => t.slots.forEach(s => out.push(refOf(t, s)))));
    return out;
  }

  /** Zamrożona kolejność dopasowana do tego, co dziś istnieje: znikłe wypadają, nowe na koniec. */
  function effectiveOrder(fresh){
    const have = new Set(fresh), seq = order.filter(r => have.has(r)), got = new Set(seq);
    fresh.forEach(r => { if(!got.has(r)) seq.push(r); });
    return seq;
  }
  function sameSeq(a, b){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }

  /**
   * Czy przestawić listę TERAZ. Nowy dzień (albo świeżo zatwierdzona grupa, orderDate=null)
   * to nowa lista — od razu. Poza tym tylko wtedy, gdy nikt nic nie robi (canReorder), i nie
   * z zaskoczenia: najpierw dymek „Aktualizuję…" przez T.announce, dopiero potem ruch.
   * Dotknięcie ekranu w tym czasie odwołuje zapowiedź (markTap). Zwraca obowiązującą kolejność.
   */
  function decideOrder(date, fresh){
    if(orderDate !== date){
      order = fresh; orderDate = date; reorderDueAt = 0; orderPending = false;
      return {seq:fresh, moved:false};
    }
    const seq = effectiveOrder(fresh);
    if(sameSeq(seq, fresh)){ order = fresh; orderPending = false; reorderDueAt = 0; return {seq, moved:false}; }
    orderPending = true;
    if(!canReorder()){ reorderDueAt = 0; return {seq, moved:false}; }
    const now = Date.now();
    if(!reorderDueAt){
      reorderDueAt = now + T.announce;
      clearTimeout(reorderTimer);
      reorderTimer = setTimeout(()=>{ if(canReorder()) safeRender(); else updateBusy(); }, T.announce + 20);
      return {seq, moved:false};
    }
    if(now < reorderDueAt) return {seq, moved:false};
    order = fresh; orderPending = false; reorderDueAt = 0;
    return {seq:fresh, moved:true};
  }

  /**
   * Lista dnia do narysowania: bloki w obowiązującej kolejności. Kafelek staje tam, gdzie
   * pierwszy z jego spacerów, grupa — tam, gdzie pierwszy z jej spacerów. Dzięki temu, gdy
   * spacer wychodzi z grupy przy zamrożonej liście, kafelek psa pojawia się w miejscu, gdzie
   * ten spacer był, a nie skacze na koniec.
   */
  function layoutDay(date){
    const tiles = buildTiles(date);
    const d = decideOrder(date, sortedRefs(tiles));
    const pos = new Map(); d.seq.forEach((r, i) => pos.set(r, i));
    const tileOf = new Map(); tiles.forEach(t => t.slots.forEach(s => tileOf.set(refOf(t, s), t)));
    const items = [], seen = new Set();
    d.seq.forEach(r => {
      const t = tileOf.get(r);
      if(!t || seen.has(blockOf(t))) return;
      seen.add(blockOf(t));
      if(!t.gid){ items.push({kind:'tile', tiles:[t]}); return; }
      const members = tiles.filter(x => x.gid===t.gid)
        .sort((x,y) => pos.get(refOf(x, x.slots[0])) - pos.get(refOf(y, y.slots[0])));
      items.push({kind:'group', gid:t.gid, tiles:members});
    });
    return {items, moved:d.moved};
  }

  /* ---------- osłona stuknięć ----------
     Zgłoszenie z terenu: „kliknąłem w jednego psa, a zapisało się na innym". Lista potrafi
     się przestawić albo kafelek zmienić (czyjaś rezerwacja z innego telefonu) w chwili, gdy
     palec już leci — i stuknięcie trafia w coś, czego człowiek nie celował. Dlatego
     stuknięcie w akcję na spacerze NIE liczy się, gdy:
       - lista przesunęła się między przyłożeniem palca a kliknięciem albo tuż (T.tapGuard)
         przed przyłożeniem — z komunikatem,
       - ten kafelek zmienił się w tym samym oknie — cudzą ręką z komunikatem, własnym
         poprzednim stuknięciem po cichu (to podwójne stuknięcie: OK → „Zwolnij" pod palcem).
     Zmiany z własnej nawigacji ('nav': strzałka dnia, zaznaczanie, zatwierdzenie grupy) nie
     blokują — człowiek sam zmienił listę i na nią patrzy. Wcześniej szły jako 'self' i osłona
     zjadała po cichu stuknięcie zaraz po strzałce (review PR #2, S98).
     Dotyczy tylko prawdziwych stuknięć (e.detail > 0) — Enter z klawiatury idzie zawsze. */
  let layoutSig = '', layoutVersion = 0, layoutMoved = {at:0, cause:'self'};
  const tileSeen = {};                         // id kafelka -> {html, at, cause}
  let fingerDown = null;                       // ostatnie przyłożenie palca: {at, version}

  function sigOf(items){
    return items.map(it => it.tiles.map(t => t.id + ':' + t.slots.map(s => s.n).join('')).join('+')).join(',');
  }
  function noteLayout(items, cause){
    const sig = sigOf(items);
    if(sig === layoutSig) return;
    if(layoutSig){ layoutVersion++; layoutMoved = {at:Date.now(), cause}; }
    layoutSig = sig;
  }
  function noteTile(id, html, cause){
    const clean = html.replace(/<span class="saving"[^>]*><\/span>/g, '');   // kręciołek „zapisuję" to nie zmiana
    const prev = tileSeen[id];
    if(prev && prev.html === clean) return;
    tileSeen[id] = {html:clean, at: prev ? Date.now() : 0, cause};
  }
  const GUARDED = new Set(['reserve','confirm','walk','free']);
  function tapRefused(e, btn){
    if(!(e.detail > 0) || !fingerDown || Date.now() - fingerDown.at > 1500) return false;
    if(!GUARDED.has(btn.dataset.act)) return false;
    if(layoutMoved.cause !== 'self' && layoutMoved.cause !== 'nav'
       && (layoutVersion !== fingerDown.version || fingerDown.at - layoutMoved.at < T.tapGuard)){
      toast('Lista się przesunęła — sprawdź i stuknij jeszcze raz');
      return true;
    }
    const li = btn.closest('[data-tile]'), seen = li && tileSeen[li.dataset.tile];
    if(seen && seen.at && seen.cause !== 'nav' && seen.at > fingerDown.at - T.tapGuard){
      if(seen.cause !== 'self') toast('Ten spacer właśnie się zmienił — sprawdź i stuknij jeszcze raz');
      return true;
    }
    return false;
  }

  /* =========================================================
     RENDER
     ========================================================= */
  /**
   * Ostatni wyrenderowany HTML. Telefon najmocniej odczuwa nie samo generowanie
   * stringa, tylko przeparsowanie i przeliczenie układu po podmianie innerHTML —
   * a odświeżanie co 15 s najczęściej nic nie zmienia. Gdy HTML jest identyczny,
   * nie dotykamy DOM w ogóle.
   */
  let lastHtml = null;
  function invalidateHtml(){ lastHtml = null; }   // po ręcznej zmianie DOM poza render()
  const RESCUE_GAP_MS = 15000;                    // ratunkowe odświeżenie po wywrotce renderu — nie częściej
  let rescueAt = 0;

  /**
   * `cause` — skąd zmiana: 'self' (własne stuknięcie w akcję na kafelku), 'nav' (własna
   * nawigacja: strzałka dnia, zakładki, zaznaczanie i zatwierdzenie grupy) albo 'data'
   * (odpowiedź serwera, odświeżenie). Przestawienie listy z zegara to 'reorder'. Od tego
   * zależy osłona stuknięć (tapRefused).
   */
  function render(cause){
    cause = cause || 'data';
    try{
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.view));
      const tabs = document.getElementById('adminTabs');
      if(tabs) tabs.classList.toggle('hidden', !state.admin);
      const tabDiag = document.getElementById('tabDiag');
      if(tabDiag) tabDiag.classList.toggle('hidden', !state.admin);
      gear.classList.toggle('on',state.admin);
      // tryb edycji to zarządzanie katalogiem, nie praca na konkretnym dniu — bez wyboru daty
      const bar = document.getElementById('dateBar');
      if(bar) bar.classList.toggle('hidden', state.admin);
      renderDateBar();
      renderSelectBar();

      const html = state.view==='diag' ? renderDiagView()
                 : state.admin         ? renderCatalog()
                 : withSlotMemo(() => renderDay(cause));
      if(html !== lastHtml){ viewEl.innerHTML = html; lastHtml = html; }
      updateBusy();
    } catch(e){
      // Zamrożony interfejs jest niedopuszczalny: pokaż komunikat i dosynchronizuj.
      // Ratunkowe odświeżenie najwyżej raz na RESCUE_GAP_MS: błąd, który powtarza się
      // przy każdym rysowaniu (np. zepsuty wiersz w arkuszu), zamieniał się w pętlę
      // getData z każdego telefonu naraz. Zwykłe odświeżanie co 15 s idzie dalej.
      viewEl.innerHTML = '<div class="empty">Coś poszło nie tak — odświeżam dane…</div>';
      lastHtml = null;
      needRefresh = true;
      if(Date.now() - rescueAt > RESCUE_GAP_MS && !isSending() && !queue.length){
        rescueAt = Date.now();
        refresh();
      }
    }
  }

  /**
   * Podmienia TYLKO kafelki psa (główny i odłączone) zamiast przerysowywać całą listę.
   * Przy 30 psach pełny render to 30 kafelków do sparsowania i ułożenia od nowa
   * przy każdym kliknięciu — na telefonie to widoczne szarpnięcie. Gdy zmienił się
   * sam układ (spacer wszedł do grupy albo z niej wyszedł), rysujemy całość — w
   * zamrożonej kolejności, więc i tak nic nie ucieka spod palca.
   */
  function patchDog(id, cause){
    const typing = takeEntry();
    withSlotMemo(() => patchTiles(id, cause || 'data'));
    putEntry(typing);
  }

  /**
   * Otwarte pole „Twoje imię" (najwyżej jedno — openEntry zamyka pozostałe), żeby przeżyło
   * przerysowanie kafelka. patchDog idzie też wtedy, gdy ktoś pisze (konflikt rezerwacji
   * pokazujemy od razu), a pies dwuspacerowy ma dwa pola: konflikt na 1/2 kasował imię
   * wpisywane właśnie w 2/2 (review PR #2, S100). To samo z kafelkami towarzyszy z grupy.
   */
  function takeEntry(){
    const entry = viewEl.querySelector('[data-entry]:not(.hidden)');
    const input = entry && entry.querySelector('[data-input]');
    if(!input) return null;
    const focused = document.activeElement === input;
    return {id: entry.dataset.entry, n: entry.dataset.slot, date: state.date, value: input.value, focused,
            start: focused ? input.selectionStart : null, end: focused ? input.selectionEnd : null};
  }
  /** Odtwarza pole po przerysowaniu — o ile ten spacer wciąż da się zarezerwować (inaczej pola nie ma). */
  function putEntry(t){
    if(!t || t.date !== state.date || state.view!=='today' || state.admin) return;
    const entry = viewEl.querySelector(`[data-entry="${t.id}"][data-slot="${t.n}"]`);
    const input = entry && entry.querySelector('[data-input]');
    if(!input || !entry.classList.contains('hidden')) return;
    invalidateHtml();                                // DOM zmieniony poza render()
    entry.classList.remove('hidden');
    const li = entry.closest('li') || viewEl;
    const btn = li.querySelector(`[data-act="reserve"][data-id="${t.id}"][data-slot="${t.n}"]`);
    if(btn) btn.classList.add('hidden');
    input.value = t.value;
    if(t.focused){ input.focus(); try{ input.setSelectionRange(t.start, t.end); }catch(e){} }
  }

  function patchTiles(id, cause){
    if(state.view!=='today' || state.admin || state.select || state.editId!==null || isPast(state.date)
       || !findDog(id)){ render(cause); return; }
    const lay = layoutDay(state.date);
    if(lay.moved){ render('reorder'); return; }
    if(sigOf(lay.items) !== layoutSig){ render(cause); return; }
    // pies w grupie zmienia też kafelki towarzyszy: od jego stanu zależy, czy grupa
    // może już ruszyć (przycisk „Wyprowadzony ✓" i podpowiedź, na kogo czekamy)
    const gids = new Set();
    lay.items.forEach(it => it.tiles.forEach(t => { if(t.dog.id===id && t.gid) gids.add(t.gid); }));
    for(const it of lay.items) for(const t of it.tiles){
      if(t.dog.id!==id && !(t.gid && gids.has(t.gid))) continue;
      const li = viewEl.querySelector(`li[data-tile="${t.id}"]`);
      if(!li){ render(cause); return; }
      const html = renderTile(t);
      li.outerHTML = html;
      noteTile(t.id, html, cause);
    }
    const cnt = viewEl.querySelector('.count');
    if(cnt) cnt.innerHTML = countLine();
    invalidateHtml();
    updateBusy();
  }

  /* ---------- pasek dnia ---------- */
  const WEEKDAYS = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  function fmtDay(iso){
    // T12:00 zamiast północy — data nie przeskoczy na sąsiedni dzień przy dziwnej strefie telefonu
    try{ return new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso+'T12:00:00')); }
    catch(e){ return iso; }
  }
  /** "dziś" / "jutro" / "wczoraj" / "za 3 dni" / "3 dni temu" — względem kalendarza, nie dnia rezerwacyjnego. */
  function relDay(iso){
    if(!state.today) return '';
    const n = dayDiff(state.today, iso);
    if(isNaN(n)) return '';
    if(n===0) return 'dziś';
    if(n===1) return 'jutro';
    if(n===-1) return 'wczoraj';
    return n>0 ? `za ${n} ${plural(n,'dzień','dni','dni')}` : `${-n} ${plural(-n,'dzień','dni','dni')} temu`;
  }
  /**
   * Pasek żyje poza #view, więc nie bierze udziału w porównywaniu HTML listy —
   * zmiana dnia to tylko kilka textContent. Poza bieżącym dniem etykieta
   * jaśnieje i podpowiada powrót: wystarczy w nią stuknąć.
   */
  function renderDateBar(){
    const name = document.getElementById('dayName');
    const rel  = document.getElementById('dayRel');
    const lab  = document.getElementById('dayLabel');
    if(!name || !rel || !lab) return;
    if(!state.date){ name.textContent='…'; rel.textContent=''; return; }
    name.textContent = fmtDay(state.date);
    const bits = [WEEKDAYS[new Date(state.date+'T12:00:00Z').getUTCDay()]];
    const r = relDay(state.date);
    if(r) bits.push(r);
    if(state.date !== state.bizDate) bits.push('↩ wróć');
    rel.textContent = bits.join(' · ');
    lab.classList.toggle('away', state.date !== state.bizDate);
    lab.classList.toggle('past', isPast(state.date));
  }

  /**
   * Ostatni spacer psa: z katalogu (dopisuje go nocne czyszczenie) albo z dni,
   * których czyszczenie jeszcze nie domknęło — między godziną resetu a chwilą,
   * w której Google faktycznie odpali wyzwalacz, mija do godziny.
   */
  function lastWalkOf(dog){
    let last = dog.lastWalk || '';
    if(slotMemo){ const m = slotMemo.lastWalk.get(String(dog.id)) || ''; return m > last ? m : last; }
    for(const k in state.slots){
      const p = k.split('|');                      // data|pies|spacer
      if(Number(p[1])!==dog.id || !isPast(p[0])) continue;
      if(state.slots[k].status==='walked' && p[0] > last) last = p[0];
    }
    return last;
  }

  /**
   * Odznaka "pies nie wyszedł poprzedniego dnia". Tylko na bieżącym dniu i liczona
   * względem niego: po resecie pracujemy już na jutrze, więc „wczoraj" to dzień,
   * który właśnie się skończył. Na dniach przyszłych nie ma sensu — do nich jeszcze
   * wszystko może się zmienić.
   */
  function missBadge(dog){
    if(state.date!==state.bizDate) return '';
    if(slotsOf(state.date, dog).some(s => s.status==='walked')) return '';   // dziś już wyszedł
    const last = lastWalkOf(dog);
    if(!last || !state.bizDate) return '';
    const n = dayDiff(last, state.bizDate);
    if(isNaN(n) || n<2) return '';                       // wczoraj wyszedł albo brak danych
    const txt = n===2 ? 'wczoraj bez spaceru' : `bez spaceru od ${n-1} dni`;
    return `<span class="miss">⚠ ${txt}</span>`;
  }

  /**
   * Linijka pod imieniem: odznaka „bez spaceru" (tylko kafelek z pełną informacją — nie
   * powtarzamy jej przy każdym spacerze), numer i boks. Postęp „spacery 1/2" zniknął: pola
   * 1/2 i 2/2 mówią to same. Znacznika „👥 grupa" też już nie ma — grupę widać po kolorze
   * kafelka i po tym, że stoi w bloku z towarzyszami (feedback z testów: zbędny wszędzie).
   */
  function dogMeta(dog, t){
    const bits=[];
    if(dog.ident) bits.push(`nr ${esc(dog.ident)}`);
    if(dog.box)   bits.push(`boks ${esc(dog.box)}`);
    const pills=[];
    const miss = t.full ? missBadge(dog) : '';
    if(miss) pills.push(miss);
    if(!bits.length && !pills.length) return '';
    return `<div class="dogmeta">${pills.join(' ')}${pills.length&&bits.length?' ':''}${bits.join(' · ')}</div>`;
  }

  const WEEKDAY_TO = ['niedzieli','poniedziałku','wtorku','środy','czwartku','piątku','soboty'];

  /**
   * Termin notatki „nigdy" — ta sama wartość, co NOTE_FOREVER w Config.gs. Notatka
   * nie znika przy żadnym czyszczeniu, dopóki ktoś jej nie skasuje.
   */
  const NOTE_FOREVER = 'nigdy';

  /**
   * Krótka etykieta terminu notatki: "do dziś" / "do jutra" / "do niedzieli" / "do 12.08".
   * Notatka „nigdy nie znika" nie ma żadnej — po prostu jest (feedback z testów: „na stałe"
   * tylko dokładało tekstu do kafelka).
   */
  function untilLabel(iso){
    if(iso === NOTE_FOREVER) return '';
    const d = new Date(iso+'T12:00:00');
    if(isNaN(d.getTime())) return '';
    const ago = daysAgo(iso);
    if(ago === null) return '';        // brak daty serwera — nie ma jak policzyć "za ile dni"
    const ahead = -ago;
    if(ahead <= 0) return 'do dziś';
    if(ahead === 1) return 'do jutra';
    if(ahead <= 6) return 'do ' + WEEKDAY_TO[d.getDay()];
    return 'do ' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
  }

  /**
   * Notatka przy psie. Bez terminu znika przy najbliższym czyszczeniu (domyślnie),
   * z terminem dostaje odznakę i dotrwa do wskazanego dnia włącznie.
   *
   * Przy przeglądaniu dni ta sama reguła mówi, GDZIE ją pokazać: bez terminu —
   * tylko na bieżącym dniu („zdjęcia o 12:00" nie dotyczy soboty), z terminem —
   * na każdym dniu do terminu włącznie; „nigdy" — na każdym dniu.
   */
  function noteShownOn(dog, date){
    if(!dog.note) return false;
    if(dog.noteUntil === NOTE_FOREVER) return true;
    return dog.noteUntil ? date <= dog.noteUntil : date === state.bizDate;
  }
  /**
   * Czy notatka ma WŁASNY termin. Notatka „bez terminu" dostaje od serwera termin =
   * dzień rezerwacyjny, w którym ją zapisano (patrz noteUntil_) — dla oka to wciąż
   * „do czyszczenia": bez odznaki i z pustym polem daty w edycji.
   */
  function noteDated(dog){
    return !!dog.noteUntil && (dog.noteUntil === NOTE_FOREVER || !state.bizDate || dog.noteUntil > state.bizDate);
  }
  function noteHtml(dog){
    if(!dog.note) return '';
    const lab = noteDated(dog) ? untilLabel(dog.noteUntil) : '';
    const pill = lab ? ` <span class="until">${esc(lab)}</span>` : '';
    return `<div class="note">📌 ${esc(dog.note)}${pill}</div>`;
  }
  function dogNote(dog){ return noteShownOn(dog, state.date) ? noteHtml(dog) : ''; }

  /* ---------- zadania ----------
     Każde zadanie ma dzień, od którego się pokazuje. Na bieżącym dniu widać
     wszystko, co ma swój dzień dziś albo wcześniej (nieodhaczone przechodzą dalej,
     odhaczone wiszą do czyszczenia). Na przyszłym — tylko zaplanowane dokładnie
     na ten dzień, bez odhaczania: to się robi w jego dniu. Na minionym — nic. */
  function tasksFor(date){
    if(date === state.bizDate) return state.tasks.filter(t => !t.date || t.date <= date);
    if(isFuture(date)) return state.tasks.filter(t => t.date === date);
    return [];
  }
  function canTickTask(t){ return !t.date || !isFuture(t.date); }

  /** Wiek zadania względem bieżącego dnia listy: '' / 'od wczoraj' / 'od N dni'. */
  function taskAge(t){
    if(!t.date || !state.bizDate) return '';
    const n = dayDiff(t.date, state.bizDate);
    return n>0 ? (n===1 ? 'od wczoraj' : `od ${n} dni`) : '';
  }

  const WEEKDAY_ON = ['niedzielę','poniedziałek','wtorek','środę','czwartek','piątek','sobotę'];
  /** "na sobotę 26.09" — przy zadaniu zaplanowanym na później. */
  function taskPlanned(t){
    const d = new Date(t.date+'T12:00:00Z');
    if(isNaN(d.getTime())) return '';
    return `na ${WEEKDAY_ON[d.getUTCDay()]} ${String(d.getUTCDate()).padStart(2,'0')}.${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  }

  function taskRow(t, removable){
    const tick = canTickTask(t);
    const badge = !tick ? `<span class="plan">${esc(taskPlanned(t))}</span>`
                : taskAge(t) ? `<span class="age">${taskAge(t)}</span>` : '';
    const del  = removable ? `<button class="btn del" data-act="taskRemove" data-id="${t.id}">✕</button>` : '';
    const pend = isPending(keyTask(t.id)) ? `<span class="saving" title="zapisuję…"></span>` : '';
    const act  = tick ? ` data-act="taskToggle" data-id="${t.id}"` : '';
    return `<div class="task${t.done?' done':''}${tick?'':' planned'}"${act}>
      <span class="box">${t.done?'✓':''}</span><span class="txt">${esc(t.text)}</span>${pend}${badge}${del}</div>`;
  }

  /** Zadania na liście dnia — dla wolontariuszy. Pusto = bez ramki, jak dotąd. */
  function renderTasks(date){
    const list = tasksFor(date);
    if(!list.length) return '';
    const title = date === state.bizDate ? 'Zadania' : 'Zadania zaplanowane na ten dzień';
    return `<div class="tasksbox"><h3>${title}</h3>${list.map(t=>taskRow(t, false)).join('')}</div>`;
  }

  /**
   * Zadania w trybie edycji: wszystkie, po kolei według dnia, z usuwaniem
   * i dodawaniem na wybrany dzień. Formularz to NIE `.entry` — patrz busyEditing().
   */
  function renderTaskAdmin(){
    const list = state.tasks.slice().sort((a,b)=> String(a.date||'') < String(b.date||'') ? -1
                                                 : String(a.date||'') > String(b.date||'') ? 1 : 0);
    let html = `<div class="tasksbox"><h3>Zadania</h3>`;
    if(!list.length) html += `<div class="empty small">Brak zadań — dodaj pierwsze poniżej.</div>`;
    html += list.map(t=>taskRow(t, true)).join('');
    const day = formVal('newTaskDate'), from = state.bizDate || '';
    html += `<div class="taskform">
        <input type="text" id="newTask" maxlength="120" placeholder="Nowe zadanie (np. umyć miski w K-4)" value="${esc(formVal('newTask'))}">
        <div class="taskform-row">
          <label for="newTaskDate">od dnia</label>
          <input type="date" id="newTaskDate" value="${esc(day && day >= from ? day : from)}" min="${esc(from)}">
          <button class="btn add-btn" data-act="taskAdd">Dodaj</button>
        </div>
      </div>
      <div class="hint">Zadanie pojawi się na liście dopiero w wybranym dniu; nieodhaczone przechodzi na kolejne dni.</div>
    </div>`;
    return html;
  }

  function renderEditForm(dog){
    const opts=Object.keys(DIF).map(k=>
      `<option value="${k}" ${dog.dif===k?'selected':''}>${DIF[k].label}</option>`).join('');
    const forever = dog.noteUntil === NOTE_FOREVER;
    return `<li class="dog" style="border-left-color:${(DIF[dog.dif]||DIF.easy).color}">
      <div class="row"><span class="name">Edycja: ${esc(dogLabel(dog))}</span></div>
      <div class="editform">
        <div class="adminrow"><input type="text" data-ef="name" maxlength="40" value="${esc(dog.name)}" placeholder="Imię (może być puste)"></div>
        <div class="adminrow">
          <input type="text" data-ef="ident" maxlength="20" value="${esc(dog.ident)}" placeholder="Nr identyfikacyjny">
          <input type="text" data-ef="box" maxlength="20" value="${esc(dog.box)}" placeholder="Boks">
          <select data-ef="dif">${opts}</select>
        </div>
        <div class="adminrow">
          <input type="text" data-ef="note" maxlength="80" value="${esc(dog.note)}" placeholder="Notatka (np. zdjęcia o 12:00)">
        </div>
        <div class="adminrow">
          <input type="date" data-ef="noteUntil" value="${esc(forever || !noteDated(dog) ? '' : dog.noteUntil)}"
                 min="${esc(state.today||'')}" ${forever?'disabled':''}>
          <label class="check"><input type="checkbox" data-ef="noteForever" ${forever?'checked':''}> nigdy nie znika</label>
        </div>
        <div class="adminrow">
          <select data-ef="walks">
            <option value="1" ${dog.walks!==2?'selected':''}>1 spacer dziennie</option>
            <option value="2" ${dog.walks===2?'selected':''}>2 spacery dziennie</option>
          </select>
        </div>
        <div class="hint">Pusta data = notatka znika przy najbliższym czyszczeniu, jak dotąd.
        Datę ustaw tylko wtedy, gdy notatka ma dotrwać do konkretnego dnia — np. w środę
        wpisujesz spacer zapoznawczy zaplanowany na niedzielę. Zniknie po tym dniu.
        „Nigdy nie znika" — notatka zostaje, dopóki ktoś jej sam nie skasuje.</div>
        <div class="adminrow">
          <button class="btn add-btn" data-act="editSave" data-id="${dog.id}">Zapisz</button>
          <button class="btn ghost" data-act="editCancel">Anuluj</button>
        </div>
      </div></li>`;
  }

  /**
   * Kafelek: pies i te jego spacery, które stoją w tym miejscu listy (t.slots).
   *  - pies na jeden spacer — wygląda jak zawsze: jeden wiersz przycisków,
   *  - kafelek główny psa na dwa spacery — każdy spacer to osobne pole z numerem 1/2, 2/2
   *    i własnymi przyciskami; popołudnie da się zarezerwować, zanim ktoś wyjdzie rano,
   *  - spacer w grupie (kafelek odłączony) — sama esencja w jednym wierszu: imię psa z numerem
   *    spaceru, opiekun i przyciski. Trudność, numer, boks i notatka są na kafelku głównym,
   *    tuż obok na liście. Za wąsko na jeden wiersz — przyciski schodzą razem pod spód.
   * Kafelek główny nie mówi, gdzie są spacery psa w grupach (dawna linijka „1/2 👥 grupa Ola")
   * — kafelek odłączony stoi przy swojej grupie i to wystarcza (feedback z testów).
   */
  function renderTile(t){
    const dog = t.dog, dm = DIF[dog.dif]||DIF.easy, count = t.all.length;
    const one = t.slots.length === 1 ? t.slots[0] : null;
    const pending = t.slots.some(s => isPending(keySlot(dog.id, s.n, state.date)));
    const label = esc(dogLabel(dog)) + (pending ? ' <span class="saving" title="zapisuję…"></span>' : '');
    const allDone = t.slots.every(s => s.status==='walked');
    const badge = one && count > 1 ? ` <span class="slotno">${one.n}/${count}</span>` : '';
    const resv = one && count === 1 && one.status==='reserved' ? `\n          <span class="resv-pill">zarezerwowany</span>` : '';
    const pk = pickBits(t);
    const cls = 'dog' + (allDone ? ' walked' : '') + (t.full ? '' : ' detached') + (t.gid ? ' grouped' : '') + pk.cls;
    const open = `<li class="${cls}" data-dog="${dog.id}" data-tile="${t.id}" data-slots="${t.slots.map(s=>s.n).join(',')}" style="${tileStyle(t, dm)}">`;
    if(!t.full && one){
      const p = slotParts(dog, one);
      return `${open}
        <div class="status"><span class="name${allDone?' done':''}">${label}</span>${badge}${p.line}</div>${p.after}${pk.box}</li>`;
    }
    const fields = one ? slotRow(dog, one) : t.slots.map(s => slotBox(dog, s, count)).join('');
    return `${open}
        <div class="row"><span class="name${allDone?' done':''}">${label}</span>${badge}${resv}<span class="flex"></span>${difChipHtml(dm)}</div>
        ${dogMeta(dog, t)}${dogNote(dog)}
        ${fields}${pk.box}</li>`;
  }

  /** Imię wolontariusza w kapsułce jego koloru dnia (patrz volColor). Samo imię zostaje tekstem. */
  function volChip(name, mark){
    if(!name) return esc(mark || '');
    return `<span class="vol" style="--vc:${volColor(state.date, name)}"><span class="vdot"></span>${esc(mark || '')}${esc(name)}</span>`;
  }

  /**
   * Jeden spacer: to, co stoi w wierszu (opiekun i przyciski), i to, co pod nim (pole
   * „Twoje imię", „Grupa czeka na…"). Każdy przycisk niesie psa (data-id) i numer spaceru
   * (data-slot) — akcja zawsze wie, KTÓRY spacer zmienia. Przyciski zarezerwowanego spaceru
   * stoją razem (.acts, do prawej): gdy wiersz jest za wąski, schodzą pod spód razem —
   * dawniej samo „Zwolnij" spadało do drugiej linijki i każdy spacer zajmował dwie.
   */
  function slotParts(dog, s){
    const at = `data-id="${dog.id}" data-slot="${s.n}"`;
    if(s.status==='free'){
      return {line: `<button class="btn reserve" data-act="reserve" ${at}>Zarezerwuj</button>`,
        after: `<div class="entry hidden" data-entry="${dog.id}" data-slot="${s.n}">
          <input type="text" maxlength="40" placeholder="Twoje imię" data-input="${dog.id}" data-slot="${s.n}">
          <button class="btn reserve" data-act="confirm" ${at}>OK</button>
        </div>`};
    }
    if(s.status==='reserved'){
      // w przyszłości nie ma czego odhaczać — rezerwację można tylko zwolnić
      let walkBtn = '', wait = '';
      if(!isFuture(state.date)){
        // spacer grupowy rusza dopiero, gdy nikt z grupy nie jest wolny — każdy spacer ma opiekuna
        const waiting = s.group ? groupWaiting(state.date, s.group) : [];
        walkBtn = waiting.length
          ? `<button class="btn walk" disabled>${WALK_LABEL}</button>`
          : `<button class="btn walk" data-act="walk" ${at}>${WALK_LABEL}</button>`;
        if(waiting.length) wait = `<div class="grpwait">Grupa czeka na rezerwację: ${waiting.map(slotLabel).join(', ')}</div>`;
      }
      return {line: `<span class="who">${volChip(s.who)}</span>
          <span class="acts">${walkBtn}<button class="btn ghost" data-act="free" ${at}>Zwolnij</button></span>`, after: wait};
    }
    return {line: `<span class="who">${volChip(s.who, '✓ ') || '✓'}</span>
        <button class="btn ghost spacer" data-act="free" ${at}>Cofnij</button>`, after: ''};
  }
  function slotRow(dog, s){
    const p = slotParts(dog, s);
    return `<div class="status">${p.line}</div>${p.after}`;
  }

  /** Pole jednego spaceru w kafelku głównym psa na kilka spacerów: numer + jego własne przyciski. */
  function slotBox(dog, s, count){
    const pk = pickSlotBits(dog.id, s.n);
    return `<div class="slot ${s.status}${pk.cls}" data-slot="${s.n}"><span class="slotno">${s.n}/${count}</span>${slotRow(dog, s)}${pk.box}</div>`;
  }

  function difChipHtml(dm){
    return `<span class="dif" style="color:${dm.color};background:${dm.color}1a">
      <span class="dot" style="background:${dm.color}"></span>${dm.label}</span>`;
  }

  /**
   * Pies w katalogu (tryb edycji): kim jest, bez stanu żadnego dnia — tu się psy
   * dodaje, poprawia i usuwa, a nie rezerwuje. Kolejność stała, z arkusza, żeby
   * nic nie przeskakiwało w trakcie poprawiania.
   */
  function renderCatalogDog(dog){
    const dm=DIF[dog.dif]||DIF.easy;
    const bits=[];
    if(dog.ident) bits.push(`nr ${esc(dog.ident)}`);
    if(dog.box)   bits.push(`boks ${esc(dog.box)}`);
    const pill = dog.walks===2 ? `<span class="twice">🐾 2 spacery dziennie</span>` : '';
    const meta = (pill || bits.length)
      ? `<div class="dogmeta">${pill}${pill&&bits.length?' ':''}${bits.join(' · ')}</div>` : '';
    return `<li class="dog" data-dog="${dog.id}" style="border-left-color:${dm.color}">
      <div class="row"><span class="name">${esc(dogLabel(dog))}</span><span class="flex"></span>${difChipHtml(dm)}
        <button class="btn edit" data-act="edit" data-id="${dog.id}">✎</button>
        <button class="btn del" data-act="remove" data-id="${dog.id}">✕</button></div>
      ${meta}${noteHtml(dog)}</li>`;
  }

  /** Tryb edycji: zadania, katalog psów, dodawanie psa. Bez dat i bez rezerwacji. */
  function renderCatalog(){
    if(!state.loaded) return '<div class="empty">Ładowanie…</div>';
    const n = state.dogs.length;
    let html = `${renderTaskAdmin()}
      <div class="count"><b>${n}</b> ${plural(n,'pies','psy','psów')} w katalogu</div>
      <ul>`;
    state.dogs.forEach(dog=>{
      html += state.editId===dog.id ? renderEditForm(dog) : renderCatalogDog(dog);
    });
    state.adding.forEach(a=>{ html += renderAddingDog(a); });
    return html + `</ul>` + renderAdminAddBox();
  }

  /** Pies w drodze na serwer: na końcu katalogu, bez przycisków (nie ma jeszcze numeru), z kręciołkiem. */
  function renderAddingDog(a){
    const dm=DIF[a.dif]||DIF.easy;
    return `<li class="dog adding" style="border-left-color:${dm.color}">
      <div class="row"><span class="name">${esc(dogLabel(a))} <span class="saving" title="zapisuję…"></span></span>
        <span class="flex"></span><span class="addnote">dodaję…</span></div></li>`;
  }

  /* ---------- szkice formularzy trybu edycji ----------
     Wartości pól „Dodaj psa" i „Nowe zadanie" żyją w stanie (state.form), nie tylko w DOM:
     przerysowanie katalogu (odpowiedź serwera, odświeżenie, gdy palec akurat nie jest w polu)
     wymieniało formularz na pusty, a wybrany dzień zadania wracał po cichu na bieżący. */
  const FORM_FIELDS = ['newName','newIdent','newBox','newDif','newTask','newTaskDate'];
  const DOG_FORM = ['newName','newIdent','newBox','newDif'];
  function formVal(id, def){ const v = state.form[id]; return v === undefined ? (def || '') : v; }

  function renderAdminAddBox(){
    const dif = formVal('newDif', 'easy');
    const opt = (v, label) => `<option value="${v}" ${dif===v?'selected':''}>${label}</option>`;
    return `<div class="adminbox">
      <h3>Dodaj psa</h3>
      <div class="adminrow">
        <input type="text" id="newName" maxlength="40" placeholder="Imię (może być puste)" value="${esc(formVal('newName'))}">
        <input type="text" id="newIdent" maxlength="20" placeholder="Nr identyfikacyjny" value="${esc(formVal('newIdent'))}">
      </div>
      <div class="adminrow" style="margin-top:7px">
        <input type="text" id="newBox" maxlength="20" placeholder="Boks" value="${esc(formVal('newBox'))}">
        <select id="newDif">${opt('easy','łatwy')}${opt('med','wymagający')}${opt('hard','b. wymagający')}</select>
        <button class="btn add-btn" data-act="add">Dodaj</button>
      </div>
    </div>`;
  }

  /**
   * Token dodania psa. Jedno „Dodaj" = jeden token, także w powtórce po zaginionej odpowiedzi
   * (addDog jest w RETRIABLE) — serwer pamięta ostatnie tokeny i psa drugi raz nie dokłada.
   * Formularz oddany po nieudanym zapisie zachowuje token, dopóki nikt nie zmieni jego treści:
   * te same dane = to samo dodanie (pies mógł powstać, a zaginęła tylko odpowiedź), inne = nowy pies.
   * Zaczyna się literą — w JSON-ie na serwerze klucz z samych cyfr zmieniłby kolejność (przycinanie).
   */
  function dogSig(f){ return [f.name, f.ident, f.box, f.dif].join('\u0001'); }
  function addDogToken(f){
    const t = state.form.addToken;
    if(t && t.sig === dogSig(f)) return t.token;
    return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  /**
   * „Dodaj" psa (zgłoszenie z panelu: kilka stuknięć w „Dodaj", gdy dane wciąż stały w polach,
   * dawało kilka takich samych psów). Formularz pustoszeje od razu, a pies staje na końcu
   * katalogu jako „dodaję…" — drugie stuknięcie nie ma już czego dodać. Gdy zapis ostatecznie
   * się nie uda, dane wracają do pustego formularza (z tym samym tokenem).
   */
  function doAddDog(){
    const v = id => document.getElementById(id).value.trim();
    const f = {name:v('newName'), ident:v('newIdent'), box:v('newBox'), dif:document.getElementById('newDif').value};
    if(!f.name && !f.ident){
      // kolejne stuknięcie zaraz po „Dodaj": pies już jest w drodze („dodaję…") — nic więcej nie robimy.
      // Fokus w polu otworzyłby klawiaturę i wstrzymał przerysowanie (busyEditing) — dodany pies by nie wskoczył
      if(state.adding.some(x => !x.done)) return;
      toast('Podaj imię lub nr identyfikacyjny'); document.getElementById('newName').focus(); return;
    }
    const a = Object.assign({token: addDogToken(f), done:false}, f);
    DOG_FORM.concat('addToken').forEach(id => { delete state.form[id]; });
    state.adding.push(a);
    render('self');
    enqueue('addDog', [f, state.pin, a.token], {
      reconcile: res => {
        a.done = true;                              // wiersz „dodaję…" zniknie razem z pierwszym stanem z psem
        applyFull_(res);
        toast('Dodano: ' + dogLabel(a), 'ok');
      },
      fail: () => {
        state.adding = state.adding.filter(x => x !== a);
        const el = document.activeElement;
        if(DOG_FORM.some(id => state.form[id]) || (el && DOG_FORM.indexOf(el.id) >= 0)) return;   // ktoś wpisuje już innego psa
        Object.assign(state.form, {newName:a.name, newIdent:a.ident, newBox:a.box, newDif:a.dif,
                                   addToken:{token:a.token, sig:dogSig(a)}});
      },
    });
  }

  /** Podsumowanie nad listą (liczone w spacerach) — osobno, bo podmieniamy je też przy patchDog(). */
  function countLine(){
    const c = {free:0, reserved:0, walked:0};
    state.dogs.forEach(d => slotsOf(state.date, d).forEach(s => { c[s.status] = (c[s.status] || 0) + 1; }));
    return `<b>${c.reserved}</b> zarezerwowane · <b>${c.walked}</b> wyprowadzone · <b>${c.free}</b> wolne`;
  }

  /**
   * Widok wybranego dnia. Bieżący — jak dotąd, z zadaniami. Przyszły — ta sama
   * lista, ale tylko rezerwacje (spacer odhacza się w dniu spaceru) i zadania
   * zaplanowane na ten dzień. Miniony — wyłącznie podgląd tego, co zapisała Historia.
   */
  function renderDay(cause){
    if(!state.loaded || !state.date) return '<div class="empty">Ładowanie…</div>';
    if(isPast(state.date)) return renderPastDay(state.date);
    const lay = layoutDay(state.date);
    const why = lay.moved ? 'reorder' : cause;
    noteLayout(lay.items, why);
    const hint = state.date===state.bizDate ? ''
      : `<div class="dayhint">Rezerwacja z wyprzedzeniem — spacer odhaczysz w dniu spaceru.</div>`;
    const top = hint + renderTasks(state.date);

    let html=`
      <div class="diflegend">
        <span><span class="dot" style="background:${DIF.easy.color}"></span>łatwy</span>
        <span><span class="dot" style="background:${DIF.med.color}"></span>wymagający</span>
        <span><span class="dot" style="background:${DIF.hard.color}"></span>b. wymagający</span>
      </div>
      ${top}
      <div class="count">${countLine()}</div>
      <ul>`;
    lay.items.forEach(it => it.tiles.forEach(t => {
      const h = renderTile(t);
      noteTile(t.id, h, why);
      html += h;
    }));
    return html + `</ul>`;
  }

  /* =========================================================
     PANEL (zakładka widoczna w trybie edycji + 5 tapnięć w datę)
     Ustawienia aplikacji + surowe dane do diagnozy "czy wisi serwer,
     czy przeglądarka" — na telefonie nie ma innego sposobu, żeby to rozstrzygnąć.

      const hh = String(h).padStart(2,'0') + ':00';
      o += `<option value="${h}" ${h===sel?'selected':''}>${hh}</option>`;
    }
    return o;
  }

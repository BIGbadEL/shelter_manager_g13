<script>
  /* =========================================================
     STAN I STAŁE
     ========================================================= */
  const DIF = {
    easy:{label:"łatwy", color:"#3f9e57"},
    med :{label:"wymagający", color:"#d99a1c"},
    hard:{label:"bardzo wymagający", color:"#cf4a3a"},
  };
  const WATCHDOG_MS = 12000;   // po tylu ms bez odpowiedzi uznajemy zapis za zaginiony (i raz ponawiamy)

  const state = {
    dogs:[],               // KATALOG psów — kim są; stan dnia żyje osobno, w `walks`
    walks:{},              // stan psa danego dnia: `${data}|${id}` -> {status, who, time, who1, time1}
    tasks:[],
    today:null,            // data kalendarzowa serwera (Europe/Warsaw) — do "od wczoraj" i terminów notatek
    bizDate:null,          // bieżący dzień rezerwacyjny: od godziny resetu, nie od północy (businessDate_)
    date:null,             // dzień wybrany strzałkami
    follow:true,           // czy wybrany dzień idzie za bieżącym (po resecie przeskakuje sam)
    past:{},               // minione dni do podglądu: data -> [{name, who, time}]
    pastLoading:{},        // data -> kiedy poszło pytanie o nią
    view:"today",          // today | diag
    admin:false, pin:null, loaded:false,
    editId:null,           // pies aktualnie edytowany w trybie edycji
    resetHour:22,          // godzina nocnego czyszczenia — ustawiana z panelu
    env:null,              // 'prod' albo cokolwiek innego; null = jeszcze nie wiemy
    diag:null,             // dane serwerowe do zakładki "Panel"
    select:null,           // zaznaczanie psów do grupy: {date, anchor, gid, ids} albo null
  };
  const viewEl = document.getElementById('view');
  const gear   = document.getElementById('gear');

  /**
   * Imię ostatnio wpisane na tym telefonie — podpowiadane przy kolejnych psach.
   * Kto bierze trzy psy pod rząd, wpisuje je raz, potem tylko potwierdza.
   */
  let lastWho = '';

  /* =========================================================
     DROBIAZGI
     ========================================================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function dogLabel(d){ return d.name || (d.ident ? '#'+d.ident : 'Pies '+d.id); }
  function findDog(id){ return state.dogs.find(x=>x.id===id); }
  function localHM(){ const d=new Date(); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  /* ---------- dzień psa ----------
     Katalog mówi, KIM jest pies; `walks` mówi, co się z nim dzieje KONKRETNEGO DNIA.
     Brak wpisu = pies tego dnia wolny. Rendering dostaje oba połączone w jeden obiekt,
     więc kafelki nie muszą wiedzieć, że dni jest więcej niż jeden. */
  const FREE_WALK = {status:'free', who:'', time:'', who1:'', time1:'', group:0};
  function wkey(date, id){ return date+'|'+id; }
  function walkOf(date, id){ return state.walks[wkey(date, id)] || FREE_WALK; }
  function setWalk(date, id, w){
    state.walks[wkey(date, id)] = {status:w.status||'free', who:w.who||'', time:w.time||'',
                                   who1:w.who1||'', time1:w.time1||'', group:Number(w.group)||0};
  }
  function dogAt(id, date){ const d=findDog(id); return d ? Object.assign({}, d, walkOf(date, id)) : null; }
  function dogsAt(date){ return state.dogs.map(d=>Object.assign({}, d, walkOf(date, d.id))); }

  /* ---------- daty ---------- */
  /** Data przesunięta o n dni — arytmetyka kalendarza w UTC, niezależna od strefy telefonu. */
  function addDays(iso, n){
    const p=iso.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1]-1, p[2]+n)).toISOString().slice(0,10);
  }
  function dayDiff(from, to){ return Math.round((Date.parse(to) - Date.parse(from))/864e5); }
  function isPast(iso){ return !!state.bizDate && iso < state.bizDate; }
  function isFuture(iso){ return !!state.bizDate && iso > state.bizDate; }
  function plural(n, one, few, many){
    if(n===1) return one;
    const d=n%10, t=n%100;
    return (d>=2 && d<=4 && !(t>=12 && t<=14)) ? few : many;
  }

  /** Ile dni temu (względem daty serwera) — null gdy brak danych. */
  function daysAgo(iso){
    if(!iso || !state.today) return null;
    const ms = Date.parse(state.today) - Date.parse(iso);
    return isNaN(ms) ? null : Math.round(ms/864e5);
  }
  function todayStr(){
    try{return new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
    catch(e){return "dziś";}
  }
  function toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2600);
  }
  /**
   * Czy ktoś właśnie coś wpisuje — wtedy nie przerysowujemy mu ekranu pod palcami.
   * Otwarte pole liczy się TYLKO to wolontariusza („Twoje imię", [data-entry]).
   * Wcześniej łapało każde widoczne `.entry`, a pole nowego zadania w trybie edycji
   * jest widoczne zawsze — przez to w trybie edycji nic się nigdy nie przerysowywało
   * i dodany pies czy zadanie nie pojawiały się po odpowiedzi serwera (S70).
   */
  function busyEditing(){
    if(state.editId!==null) return true;
    if(state.select) return true;             // zaznaczanie psów do grupy — lista ma stać w miejscu
    if(document.querySelector('[data-entry]:not(.hidden)')) return true;
    const a=document.activeElement;
    return !!(a && (a.tagName==='INPUT' || a.tagName==='SELECT'));
  }
  function setSync(txt){ document.getElementById('sync').textContent = txt; }

  /* =========================================================
     LOG WYWOŁAŃ (zasila zakładkę "Panel")
     ========================================================= */
  const callLog = [];
  function logCall(fn, ms, outcome){
    callLog.unshift({ t: localHM(), fn, ms, outcome });
    if(callLog.length > 30) callLog.pop();
    if(state.view==='diag') safeRender();
  }

  /**
   * Awaryjne wejście do panelu bez PIN-u: 5 tapnięć w datę u góry.
   * Liczymy `pointerdown`, nie `click` — na telefonie szybka seria tapnięć bywa
   * zjadana przez rozpoznawanie gestów (zaznaczanie tekstu, double-tap), więc
   * część kliknięć nigdy nie dolatywała i licznik nie dochodził do pięciu.
   */
  let tapCount = 0, tapAt = 0;
  (function bindDiagGesture(){
    const el = document.getElementById('today');
    if(!el) return;
    const bump = ()=>{
      const now = Date.now();
      tapCount = (now - tapAt < 2000) ? tapCount + 1 : 1;
      tapAt = now;
      if(tapCount >= 5){
        tapCount = 0;
        state.view = (state.view==='diag') ? 'today' : 'diag';
        render();
        if(state.view==='diag'){ toast('Panel diagnostyczny'); fetchDiag(); }
      }
    };
    el.addEventListener('pointerdown', bump);
    if(!window.PointerEvent) el.addEventListener('touchstart', bump);   // starsze WebView
  })();

  /* =========================================================
     KOLEJKA ZAPISÓW
     Interfejs jest optymistyczny: klik zmienia stan lokalny od razu,
     a zapis idzie w tle. Kolejka pilnuje, żeby leciał JEDEN zapis naraz
     (zero walki o blokadę serwera z samym sobą), a watchdog gwarantuje,
     że nawet zaginiona odpowiedź niczego nie zawiesi na stałe.
     ========================================================= */
  const queue = [];
  /**
   * Zapisy w drodze, po jednym na "tor" (tor = byt: dog:1, task:3, _full).
   * RÓŻNE psy jadą RÓWNOLEGLE, ten sam pies zawsze po kolei.
   * Wcześniej leciał jeden zapis naraz w całej aplikacji — przy rezerwacji
   * kilku psów pod rząd każdy czekał na poprzedni (Apps Script to 1-3 s na
   * wywołanie), więc trzeci klik potrafił wisieć ~10 s zanim w ogóle wyruszył.
   */
  const inflight = new Map();   // lane -> {at, settle, fn}
  const MAX_INFLIGHT = 4;       // sensowny sufit, żeby nie zalać Apps Scriptu
  let needRefresh = false;      // po błędzie/watchdogu dosynchronizuj, gdy kolejka się opróżni

  function isSending(){ return inflight.size > 0; }

  /** Zapisy bezpieczne do automatycznego ponowienia (idempotentne). */
  const RETRIABLE = new Set(['reserve','markWalked','setFree','undoFirstWalk','setTaskDone','updateDog','removeDog','removeTask','setResetHour','setAllWalks']);

  /**
   * Licznik zapisów w drodze per byt ('dog:1', 'task:3').
   * Dopóki > 0: (a) interfejs pokazuje przy bycie kręciołek "zapisuję",
   * (b) starsze odpowiedzi serwera dla tego bytu są IGNOROWANE — tylko
   * odpowiedź na ostatnią operację ma prawo skorygować stan lokalny.
   * To eliminuje przeskoki przy szybkich sekwencjach (rezerwuj -> zwolnij).
   */
  const pendingKeys = new Map();
  /** Klucz psa to pies I dzień — rezerwacja na dziś i na sobotę to dwa różne byty, jadą równolegle. */
  function keyDog(id, date){ return 'dog:'+id+'@'+(date||state.date); }
  function keyTask(id){ return 'task:'+id; }
  function isPending(key){ return (pendingKeys.get(key)||0) > 0; }

  function enqueue(fn, args, opts){
    opts = opts || {};
    if(opts.key) pendingKeys.set(opts.key, (pendingKeys.get(opts.key)||0)+1);
    queue.push({
      fn, args,
      key: opts.key||null,
      lane: opts.key || '_full',      // akcje edycyjne (pełny stan) trzymamy na jednym torze
      reconcile: opts.reconcile||null,
      attempts: 0,
    });
    pump();
  }

  /** Wysyła co się da: wolne tory ruszają równolegle, zajęte czekają w kolejce. */
  function pump(){
    for(let i=0; i<queue.length && inflight.size < MAX_INFLIGHT; ){
      if(inflight.has(queue[i].lane)){ i++; continue; }   // ten byt ma już zapis w drodze
      ship(queue.splice(i,1)[0]);
    }
    if(!inflight.size && !queue.length){
      setSync('');
      if(needRefresh){ needRefresh=false; refresh(); }
    } else {
      setSync('zapisywanie…');
    }
  }

  function ship(job){
    let settled = false;
    const slot = { at: Date.now(), settle: null, fn: job.fn };
    inflight.set(job.lane, slot);

    /** Jedyne wyjście z zapisu — odporne na wyjątki, nigdy nie zostawia zajętego toru. */
    function settle(outcome){
      if(settled) return; settled = true;
      clearTimeout(watchdog);
      inflight.delete(job.lane);             // NAJPIERW zwolnij tor — nic poniżej tego nie cofnie
      logCall(job.fn, Date.now() - slot.at, outcome.ok ? 'ok' : (outcome.msg||'błąd'));

      // nieudany, ale bezpieczny do ponowienia zapis -> jedna automatyczna powtórka
      if(!outcome.ok && job.attempts === 0 && RETRIABLE.has(job.fn)){
        job.attempts = 1;
        queue.unshift(job);                  // klucz pending zostaje policzony — to wciąż ta sama operacja
        pump();
        return;
      }

      if(job.key){
        const c = (pendingKeys.get(job.key)||1) - 1;
        if(c > 0) pendingKeys.set(job.key, c); else pendingKeys.delete(job.key);
      }

      try{
        if(outcome.ok){
          if(job.reconcile && !isPending(job.key)){
            job.reconcile(outcome.res);      // ostatnia operacja dla bytu — stosujemy prawdę serwera
          } else if(!isPending(job.key)){
            safeRender();                    // zgaś kręciołek "zapisuję" przy bycie
          }
        } else {
          toast(outcome.msg || 'Nie udało się zapisać — dosynchronizuję');
          needRefresh = true;                // optymistyczna zmiana mogła być błędna — skoryguje ją odświeżenie
          if(!isPending(job.key)) safeRender();
        }
      } catch(e){
        needRefresh = true;                  // wyjątek w reconcile/render nie może ubić kolejki
      }
      pump();
    }
    slot.settle = settle;

    const watchdog = setTimeout(()=>{
      settle({ok:false, msg:'Serwer długo nie odpowiada — dosynchronizuję'});
    }, WATCHDOG_MS);

    try{
      google.script.run
        .withSuccessHandler(res=>{ settle({ok:true, res}); })
        .withFailureHandler(err=>{
          settle({ok:false, msg: err && err.message ? err.message.replace(/^Error:\s*/,'') : 'Nie udało się zapisać'});
        })
        [job.fn](...job.args);   // wywołanie NA skonfigurowanym runnerze (bez .apply z podmianą this)
    } catch(e){
      settle({ok:false, msg:'Błąd połączenia — dosynchronizuję'});
    }
  }

  /**
   * Ratunek na zaginione odpowiedzi przy uśpionych timerach (telefon w kieszeni,
   * karta w tle): sprawdzane co 3 s ORAZ przy każdym dotknięciu ekranu i powrocie
   * do karty. Jeśli zapis wisi dłużej niż watchdog + margines, domykamy go ręcznie —
   * jedno tapnięcie zawsze przywraca aplikację do życia, bez odświeżania strony.
   */
  function checkStuck(){
    const now = Date.now();
    [...inflight.values()].forEach(slot=>{
      if(slot.settle && now - slot.at > WATCHDOG_MS + 3000){
        slot.settle({ok:false, msg:'Połączenie zerwane — dosynchronizuję'});
      }
    });
  }

  /* =========================================================
     ODŚWIEŻANIE (odczyt pełnego stanu)
     ========================================================= */
  function applyData(res){
    state.dogs=res.dogs; state.tasks=res.tasks; state.today=res.today; state.loaded=true;
    const prevBiz = state.bizDate;
    state.bizDate = res.businessDate || res.today;
    state.walks = {};
    if(Array.isArray(res.walks)) res.walks.forEach(w=>setWalk(w.date, w.dogId, w));
    else res.dogs.forEach(d=>setWalk(state.bizDate, d.id, d));   // starszy serwer: stan tylko bieżącego dnia, wpisany w psy
    if(prevBiz && prevBiz !== state.bizDate) state.past = {};    // wczorajszy „bieżący" dzień jest już miniony

    // Kto pracował na bieżącym dniu, po resecie od razu pracuje na nowym — ale nie
    // w chwili, gdy wpisuje imię albo edytuje psa: wtedy dojdzie przy kolejnym odświeżeniu.
    if(!state.date || (state.follow && !busyEditing())) state.date = state.bizDate;
    if(state.date === state.bizDate) state.follow = true;

    if(typeof res.resetHour === 'number'){ state.resetHour = res.resetHour; showResetHour(); }
    state.env = typeof res.env === 'string' ? res.env : '';
    showEnv();
  }

  /**
   * Pasek „środowisko testowe". Pokazujemy go wszędzie poza produkcją, czyli
   * wszędzie tam, gdzie serwer NIE powiedział `prod` — brak deklaracji to też
   * nie-produkcja (patrz env_() w Settings.gs).
   *
   * Do czasu pierwszej odpowiedzi serwera pasek zostaje schowany: inaczej
   * produkcja mignęłaby ostrzeżeniem przy każdym otwarciu strony i po tygodniu
   * nikt by na nie nie patrzył.
   */
  function showEnv(){
    const bar = document.getElementById('envbar');
    if(!bar) return;
    bar.classList.toggle('hidden', !state.loaded || state.env === 'prod');
  }

  /** Nagłówek mówi o godzinie czyszczenia — musi iść za ustawieniem. */
  function showResetHour(){
    const hh = String(state.resetHour).padStart(2,'0') + ':00';
    const a = document.getElementById('resetNote');
    if(a) a.textContent = '↺ czyści się o ' + hh;
  }
  /** Render, który nie wyrywa nikomu klawiatury spod palców. */
  function safeRender(){ if(!busyEditing()) render(); }

  /**
   * Pełny stan z serwera (akcje edycyjne). Gdy w kolejce czekają
   * kolejne zapisy, nie nadpisujemy nim nowszych lokalnych zmian —
   * dosynchronizujemy się dopiero po opróżnieniu kolejki.
   */
  function applyFull_(res){
    if(queue.length || pendingKeys.size){ needRefresh=true; return; }
    applyData(res); safeRender();
  }

  function refresh(){
    if(isSending() || queue.length) return;   // trwają zapisy — odczyt byłby nieaktualny
    google.script.run
      .withSuccessHandler(res=>{
        if(isSending() || queue.length) return;   // w międzyczasie ruszył zapis
        applyData(res); safeRender();
      })
      .withFailureHandler(()=>{ if(!state.loaded) viewEl.innerHTML='<div class="empty">Brak połączenia. Odśwież stronę.</div>'; })
      .getData();
  }

  /**
   * Minione dni (tylko podgląd) dociągamy blokami po dwa tygodnie wstecz od
   * wybranego — kolejne stuknięcia strzałką w tył trafiają już w pamięć i nie
   * czekają na serwer. Dzień, o który pytanie wisi dłużej niż watchdog, wolno
   * pobrać od nowa; zamrożony ekran „Wczytuję…" nie może się zdarzyć.
   */
  const PAST_BLOCK = 14;
  function fetchPast(date){
    const now = Date.now();
    if(state.past[date] || (state.pastLoading[date] && now - state.pastLoading[date] < WATCHDOG_MS)) return;
    const from = addDays(date, -(PAST_BLOCK-1));
    const days = [];
    for(let d=from; d<=date; d=addDays(d,1)) days.push(d);
    days.forEach(d=>{ state.pastLoading[d] = now; });
    google.script.run
      .withSuccessHandler(res=>{
        const got = {};
        days.forEach(d=>{ got[d] = []; delete state.pastLoading[d]; });
        ((res && res.history) || []).forEach(e=>{ if(got[e.date]) got[e.date].push(e); });
        Object.assign(state.past, got);
        if(state.view==='today' && isPast(state.date)) safeRender();
      })
      .withFailureHandler(()=>{
        days.forEach(d=>{ delete state.pastLoading[d]; });
        if(state.view==='today' && state.date===date){
          viewEl.innerHTML = '<div class="empty">Nie udało się wczytać tego dnia — spróbuj strzałką jeszcze raz.</div>';
          invalidateHtml();
        }
      })
      .getHistoryDays(from, date);
  }

  /* =========================================================
     KOLEJNOŚĆ KAFELKÓW
     Wolne na górze, zarezerwowane pod nimi, wyprowadzone na dole.

     Sęk nie w tym, JAK posortować, tylko KIEDY. Gdyby lista układała się
     w chwili kliknięcia, pies uciekałby spod palca w środku akcji — a wolontariusz
     stoi z psem na smyczy i nie ma jak dojść, co się właśnie stało. Dlatego
     kolejność jest zamrożona, dopóki cokolwiek się dzieje: trwa zapis, otwarte
     jest pole z imieniem albo ekran był dotykany przed chwilą. Kliknięty kafelek
     zmienia się w miejscu (patchDog), a lista układa się dopiero wtedy, gdy ręce
     znieruchomieją — więc seria szybkich rezerwacji idzie bez ani jednego skoku.
     ========================================================= */
  const STATUS_RANK = { free:0, reserved:1, walked:2 };
  const REORDER_QUIET_MS = 4000;   // tyle ciszy po ostatnim dotknięciu ekranu
  let order = [];                  // id psów w kolejności wyświetlania
  let orderDate = null;            // dzień, dla którego ta kolejność została policzona
  let lastTapAt = 0;
  let reorderTimer = null;

  function statusRank(dog){ const r = STATUS_RANK[dog.status]; return r === undefined ? 0 : r; }

  function canReorder(){
    if(pendingKeys.size || queue.length || inflight.size) return false;
    if(busyEditing()) return false;
    return (Date.now() - lastTapAt) > REORDER_QUIET_MS;
  }

  /** Dotknięcie ekranu odsuwa przestawienie listy i umawia je na później. */
  function markTap(){
    lastTapAt = Date.now();
    clearTimeout(reorderTimer);
    reorderTimer = setTimeout(()=>{ if(canReorder()) safeRender(); }, REORDER_QUIET_MS + 200);
  }

  /**
   * Psy w kolejności do wyświetlenia. Nową kolejność liczymy tylko wtedy, gdy wolno.
   *
   * Najpierw liczy się, ILE SPACERÓW PIES MA JUŻ ODBYTYCH — góra listy to zawsze
   * to, co dziś jeszcze nie zrobione. Sam status nie wystarczy, bo przy dwóch
   * spacerach „wolny" znaczy dwie różne rzeczy: pies, który nie wyszedł ani razu,
   * i pies, który ma już jeden spacer i czeka na drugi. Ten drugi ma schodzić pod
   * psy bez żadnego spaceru — także pod te zarezerwowane, bo tam spacer wciąż
   * jest przed nami, a nie za nami. Dopiero wewnątrz tego samego dorobku idzie
   * status (wolny przed zarezerwowanym przed wyprowadzonym), a na końcu kolejność
   * z arkusza. Dla psów jednospacerowych daje to dokładnie to, co dotąd.
   *
   * Przejście strzałką na inny dzień to cała NOWA lista, nie pies uciekający
   * spod palca — kolejność liczymy wtedy od razu, bez czekania na ciszę.
   *
   * Psy w grupie trzymają się razem: cały blok stoi tam, gdzie stanąłby jej
   * najpilniejszy pies, a w środku bloku obowiązuje ta sama kolejność co wszędzie.
   */
  function orderedDogs(){
    const dogs = dogsAt(state.date);
    if(orderDate !== state.date || canReorder()){
      const base = new Map(dogs.map((d,i)=>[d.id,i]));   // remisy rozstrzyga kolejność z arkusza
      const own  = d => [walksDone(d), statusRank(d), base.get(d.id)];
      const cmp  = (x,y) => { for(let i=0;i<x.length;i++){ if(x[i]!==y[i]) return x[i]-y[i]; } return 0; };
      const lead = {};                                      // grupa -> klucz jej najpilniejszego psa
      dogs.forEach(d=>{ if(d.group && (!lead[d.group] || cmp(own(d), lead[d.group]) < 0)) lead[d.group] = own(d); });
      const key  = d => (d.group ? lead[d.group] : own(d)).concat(own(d));
      order = dogs.slice().sort((a,b)=>cmp(key(a), key(b))).map(d=>d.id);
      orderDate = state.date;
    }
    const byId = new Map(dogs.map(d=>[d.id,d]));
    const out = [];
    order.forEach(id=>{ const d = byId.get(id); if(d){ out.push(d); byId.delete(id); } });
    byId.forEach(d=>out.push(d));   // pies spoza zapamiętanej kolejności (np. świeżo dodany) na koniec
    return out;
  }

  /* =========================================================
     RENDER
     ========================================================= */
  /**
   * Ostatni wyrenderowany HTML. Telefon najmocniej odczuwa nie samo generowanie
   * stringa, tylko przeparsowanie i przeliczenie układu po podmianie innerHTML —
   * a odświeżanie co 15 s najczęściej nic nie zmienia. Gdy HTML jest identyczny,
   * nie dotykamy DOM w ogóle.
   */
  let lastHtml = null;
  function invalidateHtml(){ lastHtml = null; }   // po ręcznej zmianie DOM poza render()

  function render(){
    try{
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.view));
      const tabs = document.getElementById('adminTabs');
      if(tabs) tabs.classList.toggle('hidden', !state.admin);
      const tabDiag = document.getElementById('tabDiag');
      if(tabDiag) tabDiag.classList.toggle('hidden', !state.admin);
      gear.classList.toggle('on',state.admin);
      // tryb edycji to zarządzanie katalogiem, nie praca na konkretnym dniu — bez wyboru daty
      const bar = document.getElementById('dateBar');
      if(bar) bar.classList.toggle('hidden', state.admin);
      renderDateBar();
      renderSelectBar();

      const html = state.view==='diag' ? renderDiagView()
                 : state.admin         ? renderCatalog()
                 : renderDay();
      if(html !== lastHtml){ viewEl.innerHTML = html; lastHtml = html; }
    } catch(e){
      // Zamrożony interfejs jest niedopuszczalny: pokaż komunikat i dosynchronizuj.
      viewEl.innerHTML = '<div class="empty">Coś poszło nie tak — odświeżam dane…</div>';
      lastHtml = null;
      needRefresh = true;
      if(!isSending() && !queue.length) refresh();
    }
  }

  /**
   * Podmienia JEDEN kafelek psa zamiast przerysowywać całą listę.
   * Przy 30 psach pełny render to 30 kafelków do sparsowania i ułożenia od nowa
   * przy każdym kliknięciu — na telefonie to widoczne szarpnięcie.
   */
  function patchDog(id){
    if(state.view!=='today' || state.admin || state.select || state.editId!==null || isPast(state.date)){ render(); return; }
    const dog = dogAt(id, state.date);
    if(!dog){ render(); return; }
    // pies w grupie zmienia też kafelki towarzyszy: od jego stanu zależy, czy grupa
    // może już ruszyć (przycisk „Wyprowadzony ✓" i podpowiedź, na kogo czekamy)
    const ids = dog.group ? groupMates(state.date, dog.group).map(d=>d.id) : [id];
    for(const x of ids){
      const li = viewEl.querySelector(`li.dog[data-dog="${x}"]`);
      if(!li){ render(); return; }
      li.outerHTML = renderDog(dogAt(x, state.date));
    }
    const cnt = viewEl.querySelector('.count');
    if(cnt) cnt.innerHTML = countLine();
    invalidateHtml();
  }

  /* ---------- pasek dnia ---------- */
  const WEEKDAYS = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  function fmtDay(iso){
    // T12:00 zamiast północy — data nie przeskoczy na sąsiedni dzień przy dziwnej strefie telefonu
    try{ return new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso+'T12:00:00')); }
    catch(e){ return iso; }
  }
  /** "dziś" / "jutro" / "wczoraj" / "za 3 dni" / "3 dni temu" — względem kalendarza, nie dnia rezerwacyjnego. */
  function relDay(iso){
    if(!state.today) return '';
    const n = dayDiff(state.today, iso);
    if(isNaN(n)) return '';
    if(n===0) return 'dziś';
    if(n===1) return 'jutro';
    if(n===-1) return 'wczoraj';
    return n>0 ? `za ${n} ${plural(n,'dzień','dni','dni')}` : `${-n} ${plural(-n,'dzień','dni','dni')} temu`;
  }
  /**
   * Pasek żyje poza #view, więc nie bierze udziału w porównywaniu HTML listy —
   * zmiana dnia to tylko kilka textContent. Poza bieżącym dniem etykieta
   * jaśnieje i podpowiada powrót: wystarczy w nią stuknąć.
   */
  function renderDateBar(){
    const name = document.getElementById('dayName');
    const rel  = document.getElementById('dayRel');
    const lab  = document.getElementById('dayLabel');
    if(!name || !rel || !lab) return;
    if(!state.date){ name.textContent='…'; rel.textContent=''; return; }
    name.textContent = fmtDay(state.date);
    const bits = [WEEKDAYS[new Date(state.date+'T12:00:00Z').getUTCDay()]];
    const r = relDay(state.date);
    if(r) bits.push(r);
    if(state.date !== state.bizDate) bits.push('↩ wróć');
    rel.textContent = bits.join(' · ');
    lab.classList.toggle('away', state.date !== state.bizDate);
    lab.classList.toggle('past', isPast(state.date));
  }

  /**
   * Ostatni spacer psa: z katalogu (dopisuje go nocne czyszczenie) albo z dni,
   * których czyszczenie jeszcze nie domknęło — między godziną resetu a chwilą,
   * w której Google faktycznie odpali wyzwalacz, mija do godziny.
   */
  function lastWalkOf(dog){
    let last = dog.lastWalk || '';
    for(const k in state.walks){
      const i = k.indexOf('|'), date = k.slice(0, i);
      if(Number(k.slice(i+1))!==dog.id || !isPast(date)) continue;
      const w = state.walks[k];
      if((w.status==='walked' || w.who1) && date > last) last = date;
    }
    return last;
  }

  /**
   * Odznaka "pies nie wyszedł poprzedniego dnia". Tylko na bieżącym dniu i liczona
   * względem niego: po resecie pracujemy już na jutrze, więc „wczoraj" to dzień,
   * który właśnie się skończył. Na dniach przyszłych nie ma sensu — do nich jeszcze
   * wszystko może się zmienić.
   */
  function missBadge(dog){
    if(state.date!==state.bizDate || dog.status==='walked') return '';
    const last = lastWalkOf(dog);
    if(!last || !state.bizDate) return '';
    const n = dayDiff(last, state.bizDate);
    if(isNaN(n) || n<2) return '';                       // wczoraj wyszedł albo brak danych
    const txt = n===2 ? 'wczoraj bez spaceru' : `bez spaceru od ${n-1} dni`;
    return `<span class="miss">⚠ ${txt}</span>`;
  }

  /** Ile z wymaganych spacerów już odbytych. */
  function walksDone(dog){ return (dog.who1?1:0) + (dog.status==='walked'?1:0); }

  function dogMeta(dog){
    const bits=[];
    if(dog.ident) bits.push(`nr ${esc(dog.ident)}`);
    if(dog.box)   bits.push(`boks ${esc(dog.box)}`);
    const pills=[];
    if(dog.group) pills.push(groupPill(dog.group));
    if(dog.walks===2){
      const done=walksDone(dog);
      pills.push(`<span class="twice">🐾 spacery ${done}/2</span>`);
      if(dog.who1) bits.push(`1. spacer: ${esc(dog.who1)} · ${esc(dog.time1)}`);
    }
    const miss=missBadge(dog);
    if(miss) pills.push(miss);
    if(!bits.length && !pills.length) return '';
    return `<div class="dogmeta">${pills.join(' ')}${pills.length&&bits.length?' ':''}${bits.join(' · ')}</div>`;
  }

  const WEEKDAY_TO = ['niedzieli','poniedziałku','wtorku','środy','czwartku','piątku','soboty'];

  /**
   * Termin notatki „nigdy" — ta sama wartość, co NOTE_FOREVER w Config.gs. Notatka
   * nie znika przy żadnym czyszczeniu, dopóki ktoś jej nie skasuje.
   */
  const NOTE_FOREVER = 'nigdy';

  /** Krótka etykieta terminu notatki: "do dziś" / "do jutra" / "do niedzieli" / "do 12.08" / "na stałe". */
  function untilLabel(iso){
    if(iso === NOTE_FOREVER) return 'na stałe';
    const d = new Date(iso+'T12:00:00');
    if(isNaN(d.getTime())) return '';
    const ago = daysAgo(iso);
    if(ago === null) return '';        // brak daty serwera — nie ma jak policzyć "za ile dni"
    const ahead = -ago;
    if(ahead <= 0) return 'do dziś';
    if(ahead === 1) return 'do jutra';
    if(ahead <= 6) return 'do ' + WEEKDAY_TO[d.getDay()];
    return 'do ' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
  }

  /**
   * Notatka przy psie. Bez terminu znika przy najbliższym czyszczeniu (domyślnie),
   * z terminem dostaje odznakę i dotrwa do wskazanego dnia włącznie.
   *
   * Przy przeglądaniu dni ta sama reguła mówi, GDZIE ją pokazać: bez terminu —
   * tylko na bieżącym dniu („zdjęcia o 12:00" nie dotyczy soboty), z terminem —
   * na każdym dniu do terminu włącznie; „nigdy" — na każdym dniu.
   */
  function noteShownOn(dog, date){
    if(!dog.note) return false;
    if(dog.noteUntil === NOTE_FOREVER) return true;
    return dog.noteUntil ? date <= dog.noteUntil : date === state.bizDate;
  }
  function noteHtml(dog){
    if(!dog.note) return '';
    const lab = dog.noteUntil ? untilLabel(dog.noteUntil) : '';
    const pill = lab ? ` <span class="until">${esc(lab)}</span>` : '';
    return `<div class="note">📌 ${esc(dog.note)}${pill}</div>`;
  }
  function dogNote(dog){ return noteShownOn(dog, state.date) ? noteHtml(dog) : ''; }

  /* ---------- zadania ----------
     Każde zadanie ma dzień, od którego się pokazuje. Na bieżącym dniu widać
     wszystko, co ma swój dzień dziś albo wcześniej (nieodhaczone przechodzą dalej,
     odhaczone wiszą do czyszczenia). Na przyszłym — tylko zaplanowane dokładnie
     na ten dzień, bez odhaczania: to się robi w jego dniu. Na minionym — nic. */
  function tasksFor(date){
    if(date === state.bizDate) return state.tasks.filter(t => !t.date || t.date <= date);
    if(isFuture(date)) return state.tasks.filter(t => t.date === date);
    return [];
  }
  function canTickTask(t){ return !t.date || !isFuture(t.date); }

  /** Wiek zadania względem bieżącego dnia listy: '' / 'od wczoraj' / 'od N dni'. */
  function taskAge(t){
    if(!t.date || !state.bizDate) return '';
    const n = dayDiff(t.date, state.bizDate);
    return n>0 ? (n===1 ? 'od wczoraj' : `od ${n} dni`) : '';
  }

  const WEEKDAY_ON = ['niedzielę','poniedziałek','wtorek','środę','czwartek','piątek','sobotę'];
  /** "na sobotę 26.09" — przy zadaniu zaplanowanym na później. */
  function taskPlanned(t){
    const d = new Date(t.date+'T12:00:00Z');
    if(isNaN(d.getTime())) return '';
    return `na ${WEEKDAY_ON[d.getUTCDay()]} ${String(d.getUTCDate()).padStart(2,'0')}.${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  }

  function taskRow(t, removable){
    const tick = canTickTask(t);
    const badge = !tick ? `<span class="plan">${esc(taskPlanned(t))}</span>`
                : taskAge(t) ? `<span class="age">${taskAge(t)}</span>` : '';
    const del  = removable ? `<button class="btn del" data-act="taskRemove" data-id="${t.id}">✕</button>` : '';
    const pend = isPending(keyTask(t.id)) ? `<span class="saving" title="zapisuję…"></span>` : '';
    const act  = tick ? ` data-act="taskToggle" data-id="${t.id}"` : '';
    return `<div class="task${t.done?' done':''}${tick?'':' planned'}"${act}>
      <span class="box">${t.done?'✓':''}</span><span class="txt">${esc(t.text)}</span>${pend}${badge}${del}</div>`;
  }

  /** Zadania na liście dnia — dla wolontariuszy. Pusto = bez ramki, jak dotąd. */
  function renderTasks(date){
    const list = tasksFor(date);
    if(!list.length) return '';
    const title = date === state.bizDate ? 'Zadania' : 'Zadania zaplanowane na ten dzień';
    return `<div class="tasksbox"><h3>${title}</h3>${list.map(t=>taskRow(t, false)).join('')}</div>`;
  }

  /**
   * Zadania w trybie edycji: wszystkie, po kolei według dnia, z usuwaniem
   * i dodawaniem na wybrany dzień. Formularz to NIE `.entry` — patrz busyEditing().
   */
  function renderTaskAdmin(){
    const list = state.tasks.slice().sort((a,b)=> String(a.date||'') < String(b.date||'') ? -1
                                                 : String(a.date||'') > String(b.date||'') ? 1 : 0);
    let html = `<div class="tasksbox"><h3>Zadania</h3>`;
    if(!list.length) html += `<div class="empty small">Brak zadań — dodaj pierwsze poniżej.</div>`;
    html += list.map(t=>taskRow(t, true)).join('');
    html += `<div class="taskform">
        <input type="text" id="newTask" maxlength="120" placeholder="Nowe zadanie (np. umyć miski w K-4)">
        <div class="taskform-row">
          <label for="newTaskDate">od dnia</label>
          <input type="date" id="newTaskDate" value="${esc(state.bizDate||'')}" min="${esc(state.bizDate||'')}">
          <button class="btn add-btn" data-act="taskAdd">Dodaj</button>
        </div>
      </div>
      <div class="hint">Zadanie pojawi się na liście dopiero w wybranym dniu; nieodhaczone przechodzi na kolejne dni.</div>
    </div>`;
    return html;
  }

  function renderEditForm(dog){
    const opts=Object.keys(DIF).map(k=>
      `<option value="${k}" ${dog.dif===k?'selected':''}>${DIF[k].label}</option>`).join('');
    const forever = dog.noteUntil === NOTE_FOREVER;
    return `<li class="dog" style="border-left-color:${(DIF[dog.dif]||DIF.easy).color}">
      <div class="row"><span class="name">Edycja: ${esc(dogLabel(dog))}</span></div>
      <div class="editform">
        <div class="adminrow"><input type="text" data-ef="name" maxlength="40" value="${esc(dog.name)}" placeholder="Imię (może być puste)"></div>
        <div class="adminrow">
          <input type="text" data-ef="ident" maxlength="20" value="${esc(dog.ident)}" placeholder="Nr identyfikacyjny">
          <input type="text" data-ef="box" maxlength="20" value="${esc(dog.box)}" placeholder="Boks">
          <select data-ef="dif">${opts}</select>
        </div>
        <div class="adminrow">
          <input type="text" data-ef="note" maxlength="80" value="${esc(dog.note)}" placeholder="Notatka (np. zdjęcia o 12:00)">
        </div>
        <div class="adminrow">
          <input type="date" data-ef="noteUntil" value="${esc(forever ? '' : (dog.noteUntil||''))}"
                 min="${esc(state.today||'')}" ${forever?'disabled':''}>
          <label class="check"><input type="checkbox" data-ef="noteForever" ${forever?'checked':''}> nigdy nie znika</label>
        </div>
        <div class="adminrow">
          <select data-ef="walks">
            <option value="1" ${dog.walks!==2?'selected':''}>1 spacer dziennie</option>
            <option value="2" ${dog.walks===2?'selected':''}>2 spacery dziennie</option>
          </select>
        </div>
        <div class="hint">Pusta data = notatka znika przy najbliższym czyszczeniu, jak dotąd.
        Datę ustaw tylko wtedy, gdy notatka ma dotrwać do konkretnego dnia — np. w środę
        wpisujesz spacer zapoznawczy zaplanowany na niedzielę. Zniknie po tym dniu.
        „Nigdy nie znika" — notatka zostaje, dopóki ktoś jej sam nie skasuje.</div>
        <div class="adminrow">
          <button class="btn add-btn" data-act="editSave" data-id="${dog.id}">Zapisz</button>
          <button class="btn ghost" data-act="editCancel">Anuluj</button>
        </div>
      </div></li>`;
  }

  function renderDog(dog){
    const dm=DIF[dog.dif]||DIF.easy;
    const label=esc(dogLabel(dog))
      + (isPending(keyDog(dog.id, state.date)) ? ' <span class="saving" title="zapisuję…"></span>' : '');
    const difChip=difChipHtml(dm);
    const adm='';   // edycja psa żyje w katalogu (tryb edycji), nie na liście dnia
    const meta=dogMeta(dog)+dogNote(dog);
    const style=tileStyle(dog, dm);
    const pk=pickBits(dog);

    if(dog.status==='free'){
      return `<li class="dog${pk.cls}" data-dog="${dog.id}" style="${style}">
        <div class="row"><span class="name">${label}</span><span class="flex"></span>${difChip}${adm}</div>
        ${meta}
        <div class="status"><button class="btn reserve" data-act="reserve" data-id="${dog.id}">Zarezerwuj</button>${
          dog.who1 ? `<button class="btn ghost" data-act="undoFirst" data-id="${dog.id}">Cofnij 1. spacer</button>` : ''
        }</div>
        <div class="entry hidden" data-entry="${dog.id}">
          <input type="text" maxlength="40" placeholder="Twoje imię" data-input="${dog.id}">
          <button class="btn reserve" data-act="confirm" data-id="${dog.id}">OK</button>
        </div>${pk.box}</li>`;
    }
    if(dog.status==='reserved'){
      // w przyszłości nie ma czego odhaczać — rezerwację można tylko zwolnić
      let walkBtn = '', wait = '';
      if(!isFuture(state.date)){
        // spacer grupowy rusza dopiero, gdy nikt z grupy nie jest wolny — każdy pies ma opiekuna
        const waiting = dog.group ? groupWaiting(state.date, dog.group) : [];
        walkBtn = waiting.length
          ? `<button class="btn walk" disabled>Wyprowadzony ✓</button>`
          : `<button class="btn walk" data-act="walk" data-id="${dog.id}">Wyprowadzony ✓</button>`;
        if(waiting.length) wait = `<div class="grpwait">Grupa czeka na rezerwację: ${waiting.map(d=>esc(dogLabel(d))).join(', ')}</div>`;
      }
      return `<li class="dog${pk.cls}" data-dog="${dog.id}" style="${style}">
        <div class="row"><span class="name">${label}</span>
          <span class="resv-pill">zarezerwowany</span><span class="flex"></span>${difChip}${adm}</div>
        ${meta}
        <div class="status">
          <span class="who"><span class="dot"></span>${esc(dog.who)}</span><span class="spacer"></span>
          ${walkBtn}
          <button class="btn ghost" data-act="free" data-id="${dog.id}">Zwolnij</button>
        </div>${wait}${pk.box}</li>`;
    }
    return `<li class="dog walked${pk.cls}" data-dog="${dog.id}" style="${style}">
      <div class="row"><span class="name done">${label}</span><span class="flex"></span>${difChip}${adm}</div>
      ${meta}
      <div class="status"><span class="who">✓ ${esc(dog.who)}</span>
        <button class="btn ghost spacer" data-act="free" data-id="${dog.id}">Cofnij</button>
      </div>${pk.box}</li>`;
  }

  function difChipHtml(dm){
    return `<span class="dif" style="color:${dm.color};background:${dm.color}1a">
      <span class="dot" style="background:${dm.color}"></span>${dm.label}</span>`;
  }

  /**
   * Pies w katalogu (tryb edycji): kim jest, bez stanu żadnego dnia — tu się psy
   * dodaje, poprawia i usuwa, a nie rezerwuje. Kolejność stała, z arkusza, żeby
   * nic nie przeskakiwało w trakcie poprawiania.
   */
  function renderCatalogDog(dog){
    const dm=DIF[dog.dif]||DIF.easy;
    const bits=[];
    if(dog.ident) bits.push(`nr ${esc(dog.ident)}`);
    if(dog.box)   bits.push(`boks ${esc(dog.box)}`);
    const pill = dog.walks===2 ? `<span class="twice">🐾 2 spacery dziennie</span>` : '';
    const meta = (pill || bits.length)
      ? `<div class="dogmeta">${pill}${pill&&bits.length?' ':''}${bits.join(' · ')}</div>` : '';
    return `<li class="dog" data-dog="${dog.id}" style="border-left-color:${dm.color}">
      <div class="row"><span class="name">${esc(dogLabel(dog))}</span><span class="flex"></span>${difChipHtml(dm)}
        <button class="btn edit" data-act="edit" data-id="${dog.id}">✎</button>
        <button class="btn del" data-act="remove" data-id="${dog.id}">✕</button></div>
      ${meta}${noteHtml(dog)}</li>`;
  }

  /** Tryb edycji: zadania, katalog psów, dodawanie psa. Bez dat i bez rezerwacji. */
  function renderCatalog(){
    if(!state.loaded) return '<div class="empty">Ładowanie…</div>';
    const n = state.dogs.length;
    let html = `${renderTaskAdmin()}
      <div class="count"><b>${n}</b> ${plural(n,'pies','psy','psów')} w katalogu</div>
      <ul>`;
    state.dogs.forEach(dog=>{
      html += state.editId===dog.id ? renderEditForm(dog) : renderCatalogDog(dog);
    });
    return html + `</ul>` + renderAdminAddBox();
  }

  function renderAdminAddBox(){
    return `<div class="adminbox">
      <h3>Dodaj psa</h3>
      <div class="adminrow">
        <input type="text" id="newName" maxlength="40" placeholder="Imię (może być puste)">
        <input type="text" id="newIdent" maxlength="20" placeholder="Nr identyfikacyjny">
      </div>
      <div class="adminrow" style="margin-top:7px">
        <input type="text" id="newBox" maxlength="20" placeholder="Boks">
        <select id="newDif">
          <option value="easy">łatwy</option>
          <option value="med">wymagający</option>
          <option value="hard">b. wymagający</option>
        </select>
        <button class="btn add-btn" data-act="add">Dodaj</button>
      </div>
    </div>`;
  }

  /** Podsumowanie nad listą — osobno, bo podmieniamy je też przy patchDog(). */
  function countLine(){
    const dogs = dogsAt(state.date);
    const c = st => dogs.filter(x=>x.status===st).length;
    return `<b>${c('reserved')}</b> zarezerwowane · <b>${c('walked')}</b> wyprowadzone · <b>${c('free')}</b> wolne`;
  }

  /**
   * Widok wybranego dnia. Bieżący — jak dotąd, z zadaniami. Przyszły — ta sama
   * lista, ale tylko rezerwacje (spacer odhacza się w dniu spaceru) i zadania
   * zaplanowane na ten dzień. Miniony — wyłącznie podgląd tego, co zapisała Historia.
   */
  function renderDay(){
    if(!state.loaded || !state.date) return '<div class="empty">Ładowanie…</div>';
    if(isPast(state.date)) return renderPastDay(state.date);
    const d=orderedDogs();
    const hint = state.date===state.bizDate ? ''
      : `<div class="dayhint">Rezerwacja z wyprzedzeniem — spacer odhaczysz w dniu spaceru.</div>`;
    const top = hint + renderTasks(state.date);

    let html=`
      <div class="diflegend">
        <span><span class="dot" style="background:${DIF.easy.color}"></span>łatwy</span>
        <span><span class="dot" style="background:${DIF.med.color}"></span>wymagający</span>
        <span><span class="dot" style="background:${DIF.hard.color}"></span>b. wymagający</span>
      </div>
      ${top}
      <div class="count">${countLine()}</div>
      <ul>`;
    d.forEach(dog=>{ html += renderDog(dog); });
    return html + `</ul>`;
  }

  /* =========================================================
     PANEL (zakładka widoczna w trybie edycji + 5 tapnięć w datę)
     Ustawienia aplikacji + surowe dane do diagnozy "czy wisi serwer,
     czy przeglądarka" — na telefonie nie ma innego sposobu, żeby to rozstrzygnąć.
     ========================================================= */
  function hourOptions(sel){
    let o = '';
    for(let h=0; h<24; h++){
      const hh = String(h).padStart(2,'0') + ':00';
      o += `<option value="${h}" ${h===sel?'selected':''}>${hh}</option>`;
    }
    return o;
  }

  function renderDiagView(){
    const d = state.diag;
    const settings = state.admin ? `
      <div class="panelbox">
        <h3>Ustawienia</h3>
        <div class="adminrow">
          <label class="lbl" for="resetHour">Godzina czyszczenia listy</label>
          <select id="resetHour">${hourOptions(state.resetHour)}</select>
        </div>
        <div class="hint">Od ${String(state.resetHour).padStart(2,'0')}:00 lista pracuje już na kolejnym
        dniu — wcześniej można jeszcze rezerwować na dzień, który trwa. Zamknięty dzień trafia do
        Historii w ciągu tej godziny (Google uruchamia wyzwalacze w oknie
        ${String(state.resetHour).padStart(2,'0')}:00–${String(state.resetHour).padStart(2,'0')}:59),
        a notatki bez terminu znikają. Uwaga: godzina, która dziś już minęła, przełącza listę
        na jutro od razu.</div>
      </div>
      <div class="panelbox">
        <h3>Spacery dla wszystkich psów</h3>
        <div class="adminrow">
          <button class="btn add-btn" data-act="allWalks" data-walks="2">Wszystkie po 2 spacery</button>
          <button class="btn ghost" data-act="allWalks" data-walks="1">Wszystkie po 1 spacerze</button>
        </div>
        <div class="hint">Do przestawienia całej listy naraz, gdy upał pozwala na drugi spacer.
        Pies, który dziś już był wyprowadzony, przechodzi wtedy na „po pierwszym z dwóch"
        i wraca na listę wolnych; przy powrocie do jednego spaceru dzieje się odwrotnie.
        Psów, które ktoś właśnie prowadzi, to nie dotyka.</div>
      </div>` : '';

    const serverRows = d ? `
      <div class="diagrow"><b>środowisko</b><span>${esc(d.env || '')}</span></div>
      <div class="diagrow"><b>wyzwalacz resetu</b><span>${d.triggerInstalled ? 'aktywny ('+d.triggerCount+')' : 'BRAK — uruchom installTriggers()'}</span></div>
      <div class="diagrow"><b>godzina resetu</b><span>${String(d.resetHour).padStart(2,'0')}:00</span></div>
      <div class="diagrow"><b>czas serwera</b><span>${esc(d.serverDate)} ${esc(d.serverTime)}</span></div>
      <div class="diagrow"><b>dzień rezerwacyjny</b><span>${esc(d.businessDate || '')}</span></div>
      <div class="diagrow"><b>strefa</b><span>${esc(d.timezone)}</span></div>
      <div class="diagrow"><b>psy / zadania</b><span>${d.dogCount} / ${d.taskCount}</span></div>
      <div class="diagrow"><b>wpisy historii</b><span>${d.histCount}</span></div>`
      : `<div class="diagrow"><span>${state.admin ? 'Pobieram…' : 'Dane serwera tylko w trybie edycji.'}</span></div>`;

    const rows = callLog.map(c=>
      `<div class="diagrow"><span>${c.t}</span><b>${esc(c.fn)}</b><span>${c.ms} ms</span><span>${esc(c.outcome)}</span></div>`
    ).join('') || '<div class="diagrow"><span>Brak wywołań w tej sesji.</span></div>';

    return `${settings}
      <div class="panelbox">
        <h3>Stan serwera</h3>
        <div class="diag">${serverRows}</div>
      </div>
      <div class="panelbox">
        <h3>Ostatnie wywołania</h3>
        <div class="hint">Czas przelotu tam i z powrotem. Powyżej ~3000 ms wina jest po stronie
        Apps Scriptu; „zerwane"/„nie odpowiada" wskazuje na przeglądarkę albo sieć.</div>
        <div class="diag">${rows}</div>
        <div class="diagrow"><b>w locie / w kolejce</b><span>${inflight.size} / ${queue.length}</span></div>
      </div>`;
  }

  function fetchDiag(){
    if(!state.admin) return;
    google.script.run
      .withSuccessHandler(res=>{ state.diag = res; if(state.view==='diag') safeRender(); })
      .withFailureHandler(()=>{})
      .getDiagnostics(state.pin);
  }

  /** 'H:mm' -> minuty, żeby 9:05 stanęło przed 10:00 (porównanie napisów by się pomyliło). */
  function minutesOf(t){ const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60+Number(m[2]) : 9999; }

  /**
   * Miniony dzień — tylko podgląd, zastępuje dawną zakładkę Historia. Pokazujemy
   * to, co się faktycznie odbyło, po kolei w ciągu dnia; rezerwacje, z których
   * nic nie wyszło, nie są częścią zapisu.
   */
  function renderPastDay(date){
    const items = state.past[date];
    let html = `<div class="dayhint">Miniony dzień — tylko podgląd.</div>`;
    if(!items) return html + '<div class="empty">Wczytuję…</div>';
    if(!items.length) return html + '<div class="empty">Tego dnia nie zapisano żadnego spaceru.</div>';
    const sorted = items.slice().sort((a,b)=>minutesOf(a.time)-minutesOf(b.time));
    html += `<div class="hist-day"><div class="hist-date">${sorted.length} ${plural(sorted.length,'spacer','spacery','spacerów')}</div>`;
    sorted.forEach(e=>{ html+=`<div class="hist-item"><b>${esc(e.name)}</b> — ${esc(e.who)}<span class="t">${esc(e.time)}</span></div>`; });
    return html + `</div>`;
  }

  /* =========================================================
     GRUPY — spacery grupowe
     Przytrzymanie kafelka włącza zaznaczanie psów do wspólnego spaceru.
     Grupa jest na konkretny dzień i żyje na serwerze (kolumna `grupa` w Spacery),
     więc każdy telefon widzi ją tak samo. Kolor wynika z numeru grupy tego dnia:
     każda kolejna jest w innym, a na wszystkich telefonach w tym samym.

     „Wyprowadzony ✓" na dowolnym psie z grupy odhacza wszystkich zarezerwowanych —
     ale tylko wtedy, gdy nikt z grupy nie jest WOLNY (każdy pies ma opiekuna).
     Nie „wszyscy zarezerwowani": po spacerze i cofnięciu jednego psa pozostali są
     już wyprowadzeni, a nie zarezerwowani, i tamta reguła zablokowałaby na zawsze
     ponowne odhaczenie cofniętego. Cofnięcie cofa tylko jednego psa.
     ========================================================= */
  const GROUP_COLORS = [
    {bg:'#ebe7fb', ink:'#5a45b0'},   // lawenda
    {bg:'#e0edfa', ink:'#2c67a3'},   // błękit
    {bg:'#fbe5ee', ink:'#a3336a'},   // róż
    {bg:'#dcf2ee', ink:'#1e7568'},   // morski
    {bg:'#f3e3f7', ink:'#86399a'},   // storczyk
    {bg:'#e4e8ef', ink:'#465266'},   // łupek
  ];
  function groupColor(gid){ return GROUP_COLORS[(gid - 1) % GROUP_COLORS.length]; }
  function groupMates(date, gid){ return dogsAt(date).filter(d => d.group === gid); }
  /** Psy z grupy, które nie mają opiekuna — dopóki są, grupa nie może ruszyć. */
  function groupWaiting(date, gid){ return groupMates(date, gid).filter(d => d.status === 'free'); }
  /** Kolejny numer grupy tego dnia — dokładnie tak samo liczy go serwer (setGroup). */
  function nextGroupId(date){
    let max = 0;
    for(const k in state.walks){ if(k.indexOf(date+'|')===0 && state.walks[k].group > max) max = state.walks[k].group; }
    return max + 1;
  }
  /**
   * Znacznik obok delikatnego tła: w pełnym słońcu samo zabarwienie potrafi zniknąć,
   * a przynależność do grupy decyduje o tym, czy pies może wyjść.
   */
  function groupPill(gid){
    const c = groupColor(gid);
    return `<span class="grp" style="color:${c.ink};border-color:${c.ink}55">👥 grupa</span>`;
  }
  function tileStyle(dog, dm){
    return `border-left-color:${dm.color}` + (dog.group ? `;background:${groupColor(dog.group).bg}` : '');
  }

  /** Czy psa można zaznaczyć: po spacerze nie ma czego planować — chyba że już jest w tej grupie. */
  function canPick(dog){
    const sel = state.select;
    return dog.status !== 'walked' || (sel.gid && dog.group === sel.gid);
  }

  /**
   * Kafelek w trybie zaznaczania to TEN SAM kafelek co zwykle: dochodzi tylko klasa
   * i kółko położone na wierzchu (position:absolute), a przyciski bledną. Osobny,
   * krótszy kafelek skracał całą listę w chwili przytrzymania — wszystko nad palcem
   * się kurczyło, a przytrzymany pies uciekał z ekranu.
   */
  function pickBits(dog){
    const sel = state.select;
    if(!sel) return {cls:'', box:''};
    const picked = sel.ids.indexOf(dog.id) >= 0, can = canPick(dog);
    return {
      cls: ' pick' + (picked ? ' picked' : '') + (can ? '' : ' nopick'),
      box: can ? `<span class="pickbox">${picked ? '✓' : ''}</span>` : '',
    };
  }

  /**
   * Pasek na dole ekranu zasłania ostatnie ~80 px. Jeśli przytrzymany pies stał
   * właśnie tam, przesuwamy listę dokładnie o tyle, żeby wyszedł spod paska —
   * i tylko wtedy.
   */
  function keepAboveBar(id){
    const li = viewEl.querySelector(`li.dog[data-dog="${id}"]`);
    const bar = document.getElementById('selectBar');
    if(!li || !bar) return;
    const top = bar.getBoundingClientRect().top, bottom = li.getBoundingClientRect().bottom;
    if(top > 0 && bottom > top) window.scrollBy(0, bottom - top + 12);
  }

  /** Pasek na dole ekranu: ile zaznaczonych, „Grupa" wyszarzone do pierwszego towarzysza. */
  function renderSelectBar(){
    const bar = document.getElementById('selectBar');
    if(!bar) return;
    const sel = state.select;
    const on = !!sel && state.view==='today' && !state.admin;
    bar.classList.toggle('hidden', !on);
    document.body.classList.toggle('selecting', on);
    if(!on) return;
    const n = sel.ids.length;
    document.getElementById('selInfo').textContent = n < 2
      ? 'Zaznacz psy do wspólnego spaceru'
      : `Zaznaczone: ${n} ${plural(n,'pies','psy','psów')}`;
    document.getElementById('selGroup').disabled = n < 2;
    document.getElementById('selDissolve').classList.toggle('hidden', !sel.gid);
  }

  /**
   * Start zaznaczania z przytrzymanego psa. Pies już w grupie — otwieramy jego grupę
   * do zmiany składu albo rozwiązania. Pies po spacerze bez grupy — nie ma czego planować.
   */
  function startSelect(id){
    if(state.admin || state.view!=='today' || isPast(state.date)) return;
    const dog = dogAt(id, state.date);
    if(!dog) return;
    if(dog.group){
      state.select = {date:state.date, anchor:id, gid:dog.group, ids:groupMates(state.date, dog.group).map(d=>d.id)};
    } else {
      if(dog.status === 'walked') return;
      state.select = {date:state.date, anchor:id, gid:0, ids:[id]};
    }
    render();
    keepAboveBar(id);
  }

  /** Stuknięcie w kafelek podczas zaznaczania. Przytrzymany pies zostaje w grupie na stałe. */
  function togglePick(e){
    const li = e.target.closest && e.target.closest('li.dog[data-dog]');
    if(!li) return;
    const id = Number(li.dataset.dog), sel = state.select;
    if(id === sel.anchor) return;
    const dog = dogAt(id, sel.date);
    if(!dog || !canPick(dog)) return;
    const i = sel.ids.indexOf(id);
    if(i >= 0) sel.ids.splice(i, 1); else sel.ids.push(id);
    render();
  }

  function cancelSelect(){ state.select = null; render(); }

  /** Numery grup z odpowiedzi serwera — tylko to pole, żeby nie cofnąć czyjejś rezerwacji w drodze. */
  function applyGroups(date, res){
    const got = {};
    ((res && res.walks) || []).forEach(w => { if(w.date === date) got[w.dogId] = Number(w.group) || 0; });
    state.dogs.forEach(d => {
      const k = wkey(date, d.id), g = got[d.id] || 0;
      if(state.walks[k]) state.walks[k].group = g;
      else if(g) setWalk(date, d.id, {group:g});
    });
  }

  /**
   * Zatwierdzenie składu (albo rozwiązanie, gdy zostaje mniej niż dwa psy).
   * Optymistycznie od razu: kolor i miejsce na liście — to, po co ktoś tę grupę robi,
   * więc lista układa się natychmiast, a nie po ciszy (patrz orderedDogs).
   */
  function commitGroup(ids){
    const sel = state.select;
    if(!sel) return;
    const date = sel.date;
    const gid  = ids.length >= 2 ? (sel.gid || nextGroupId(date)) : 0;
    const local = {};                                   // stan lokalny taki, jaki zrobi serwer
    state.dogs.forEach(d => { local[d.id] = walkOf(date, d.id).group; });
    if(sel.gid) Object.keys(local).forEach(id => { if(local[id] === sel.gid) local[id] = 0; });
    const robbed = {};
    ids.forEach(id => { if(local[id] && local[id] !== gid) robbed[local[id]] = true; local[id] = gid; });
    Object.keys(robbed).forEach(g => {
      const left = Object.keys(local).filter(id => local[id] === Number(g));
      if(left.length === 1) local[left[0]] = 0;
    });
    applyGroups(date, {walks: Object.keys(local).map(id => ({date, dogId:Number(id), group:local[id]}))});

    state.select = null;
    orderDate = null;
    render();
    enqueue('setGroup', [date, ids.length >= 2 ? ids : [], sel.gid || 0], {key:'group@'+date, reconcile:res=>{
      applyGroups(date, res);
      if(date === state.date) safeRender();
    }});
  }
  function confirmGroup(){ if(state.select && state.select.ids.length >= 2) commitGroup(state.select.ids.slice()); }
  function dissolveGroup(){ if(state.select && state.select.gid) commitGroup([]); }

  /** „Wyprowadzony ✓" na psie z grupy: odhacza wszystkich zarezerwowanych naraz. */
  function doGroupWalk(gid){
    const date = state.date;
    if(isPast(date)){ dayClosed(); return; }
    if(date !== state.bizDate) return;
    const mates = groupMates(date, gid);
    if(mates.some(d => d.status === 'free')) return;      // przycisk jest wtedy wyłączony
    // każdy pies osobno, przez zwykłe markWalked — ten sam, sprawdzony i ponawialny zapis
    mates.filter(d => d.status === 'reserved').forEach(d => doWalk(d.id));
  }

  /* ---------- przytrzymanie kafelka ----------
     Liczymy od pointerdown, nie od click (bug nr 6). Przesunięcie palca (przewijanie
     listy) albo puszczenie przed czasem przerywa. Na kafelku wyłączamy systemowe menu
     i zaznaczanie tekstu, które telefon podpina pod to samo przytrzymanie. */
  const LONG_PRESS_MS = 550;
  let lpTimer = null, lpStart = null;
  function lpCancel(){ clearTimeout(lpTimer); lpTimer = null; lpStart = null; }
  function lpBegin(e){
    if(state.admin || state.select || state.view!=='today' || isPast(state.date)) return;
    const t = e.target;
    if(!t || !t.closest || t.closest('input')) return;   // pole imienia — zwykłe zachowanie
    const li = t.closest('li.dog[data-dog]');
    if(!li) return;
    const id = Number(li.dataset.dog);
    lpStart = {x:e.clientX || 0, y:e.clientY || 0};
    clearTimeout(lpTimer);
    lpTimer = setTimeout(()=>{ lpTimer = null; startSelect(id); }, LONG_PRESS_MS);
  }
  function lpMove(e){
    if(!lpTimer || !lpStart) return;
    if(Math.abs((e.clientX||0) - lpStart.x) > 10 || Math.abs((e.clientY||0) - lpStart.y) > 10) lpCancel();
  }
  viewEl.addEventListener('pointerdown', lpBegin);
  viewEl.addEventListener('pointermove', lpMove);
  ['pointerup','pointercancel','pointerleave'].forEach(t => viewEl.addEventListener(t, lpCancel));
  if(!window.PointerEvent){                                  // starsze WebView
    const pt = e => (e.touches && e.touches[0]) || {};
    viewEl.addEventListener('touchstart', e => lpBegin({target:e.target, clientX:pt(e).clientX, clientY:pt(e).clientY}));
    viewEl.addEventListener('touchmove',  e => lpMove({clientX:pt(e).clientX, clientY:pt(e).clientY}));
    ['touchend','touchcancel'].forEach(t => viewEl.addEventListener(t, lpCancel));
  }
  viewEl.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('li.dog')) e.preventDefault(); });

  document.getElementById('selCancel').addEventListener('click', cancelSelect);
  document.getElementById('selGroup').addEventListener('click', confirmGroup);
  document.getElementById('selDissolve').addEventListener('click', dissolveGroup);

  /* =========================================================
     AKCJE (optymistyczne: najpierw lokalny stan i render,
     potem zapis w tle; ewentualna korekta po odpowiedzi)
     ========================================================= */
  /*
   * Każda akcja zapamiętuje SWÓJ dzień w chwili kliknięcia i wysyła go serwerowi.
   * Odpowiedź wraca do tego dnia, nawet jeśli wolontariusz zdążył w międzyczasie
   * przejść strzałką gdzie indziej — kafelek przerysowujemy tylko wtedy, gdy ten
   * dzień jest wciąż na ekranie.
   */
  /**
   * Dzień zamknął się pod palcami: ktoś wpisywał imię o 19:59, reset minął,
   * a on stuka OK. Po cichu nic nie zrobić = zamrożony ekran w jego oczach —
   * mówimy wprost i przechodzimy na bieżący dzień.
   */
  function dayClosed(){
    toast('Ten dzień jest już zamknięty — przechodzę na bieżący');
    goDate(state.bizDate);
  }

  function doReserve(id, who){
    const date=state.date;
    if(!date) return;
    if(isPast(date)){ dayClosed(); return; }
    const w=walkOf(date, id); if(!findDog(id) || w.status!=='free') return;
    setWalk(date, id, Object.assign({}, w, {status:'reserved', who, time:''}));
    patchDog(id);
    enqueue('reserve',[id,who,date],{key:keyDog(id,date),reconcile:res=>{
      if(!res || !res.dog){ safeRender(); return; }
      setWalk(date, id, res.dog);
      if(!(res.dog.status==='reserved' && res.dog.who===who)){
        toast('Ubiegł Cię ktoś inny — pies już zajęty');
        if(date===state.date) patchDog(id);   // konflikt pokazujemy od razu, nawet gdy ktoś pisze imię
      } else if(date===state.date && !busyEditing()) patchDog(id);
    }});
  }

  function doWalk(id){
    const date=state.date;
    if(isPast(date)){ dayClosed(); return; }
    if(date!==state.bizDate) return;           // spacer odhacza się tylko w dniu, który trwa
    const dog=dogAt(id, date); if(!dog) return;
    // KTÓRY to spacer — wiemy tylko tutaj, w chwili kliknięcia, i musimy to powiedzieć
    // serwerowi. Bez tego automatyczne ponowienie po zaginionej odpowiedzi robiło
    // z pierwszego spaceru pełne 2/2 z pustym "kto" (markWalked jest w RETRIABLE).
    const first = dog.walks===2 && !dog.who1;
    const w=Object.assign({}, walkOf(date, id));
    if(first){
      // pierwszy z dwóch spacerów: zapisz i zwolnij psa na drugi
      w.who1=w.who; w.time1=localHM();
      w.status='free'; w.who=''; w.time='';
    } else {
      w.status='walked'; w.time=localHM();
    }
    setWalk(date, id, w);
    patchDog(id);
    enqueue('markWalked',[id,'',first?1:2,date],{key:keyDog(id,date),reconcile:res=>{
      if(res && res.dog) setWalk(date, id, res.dog);
      if(date===state.date && !busyEditing()) patchDog(id);
    }});
  }

  function doUndoFirst(id){
    const date=state.date;
    if(isPast(date)){ dayClosed(); return; }
    if(date!==state.bizDate) return;
    const w=walkOf(date, id); if(!findDog(id) || !w.who1) return;
    setWalk(date, id, Object.assign({}, w, {who1:'', time1:''}));
    patchDog(id);
    enqueue('undoFirstWalk',[id,date],{key:keyDog(id,date),reconcile:res=>{
      if(res && res.dog) setWalk(date, id, res.dog);
      if(date===state.date && !busyEditing()) patchDog(id);
    }});
  }

  /**
   * „Zwolnij" / „Cofnij". Pies bez opiekuna wypada ze swojej grupy, a grupa z jednym
   * psem przestaje być grupą — dokładnie jak robi to serwer (setFree). Kafelki
   * dawnych towarzyszy też się zmieniają: kolor, podpowiedź „czeka na…", przycisk.
   */
  function doFree(id){
    const date=state.date;
    if(!date || !findDog(id)) return;
    if(isPast(date)){ dayClosed(); return; }
    const w=walkOf(date, id);
    const gid=(w.status==='free' && !w.who && !w.time) ? 0 : w.group;   // wolnego nie ma skąd zwalniać
    const mates=gid ? groupMates(date, gid).map(d=>d.id).filter(x=>x!==id) : [];
    setWalk(date, id, Object.assign({}, w, {status:'free', who:'', time:''}, gid ? {group:0} : {}));
    if(mates.length===1) state.walks[wkey(date, mates[0])].group = 0;
    patchDog(id);
    mates.forEach(x=>patchDog(x));
    enqueue('setFree',[id,date],{key:keyDog(id,date),reconcile:res=>{
      if(res && res.dog) setWalk(date, id, res.dog);
      if(date===state.date && !busyEditing()) patchDog(id);
    }});
  }

  function doTaskToggle(id){
    const t=state.tasks.find(x=>x.id===id); if(!t || !canTickTask(t)) return;   // przyszłe — w ich dniu
    t.done=!t.done;
    render();
    enqueue('setTaskDone',[id,t.done],{key:keyTask(id)});
  }

  /* =========================================================
     ZDARZENIA
     ========================================================= */
  document.querySelector('.tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t) return;
    state.view=t.dataset.tab; state.select=null; render();
    if(state.view==='diag') fetchDiag();
  });

  /**
   * Przejście na inny dzień. Wolno swobodnie w obie strony; w tył to podgląd,
   * do przodu — rezerwacje. Otwarta edycja psa i zaznaczanie grupy dotyczą listy,
   * którą właśnie opuszczamy, więc je zamykamy.
   */
  function goDate(iso){
    if(!iso) return;
    state.date = iso;
    state.follow = (iso === state.bizDate);
    state.view = 'today';
    state.editId = null;
    state.select = null;
    render();
    if(isPast(iso)) fetchPast(iso);
  }
  document.getElementById('prevDay').addEventListener('click',()=>{ if(state.date) goDate(addDays(state.date,-1)); });
  document.getElementById('nextDay').addEventListener('click',()=>{ if(state.date) goDate(addDays(state.date,1)); });
  document.getElementById('dayLabel').addEventListener('click',()=>{ if(state.bizDate) goDate(state.bizDate); });

  gear.addEventListener('click',()=>{
    if(state.select){ state.select=null; render(); }
    if(state.admin){
      state.admin=false; state.editId=null; state.diag=null;
      if(state.view==='diag') state.view='today';   // zakładka znika razem z trybem edycji
      render(); return;
    }
    document.getElementById('pinrow').classList.toggle('hidden');
    document.getElementById('pinErr').classList.add('hidden');
    const p=document.getElementById('pinInput'); p.value=''; p.focus();
  });
  document.getElementById('pinOk').addEventListener('click',tryPin);
  document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
  function tryPin(){
    const pin=document.getElementById('pinInput').value.trim();
    google.script.run.withSuccessHandler(ok=>{
      if(ok){ state.admin=true; state.pin=pin;
        document.getElementById('pinrow').classList.add('hidden');
        document.getElementById('pinErr').classList.add('hidden'); render();
        if(state.view==='diag') fetchDiag();
      } else { document.getElementById('pinErr').classList.remove('hidden'); }
    }).checkPin(pin);
  }

  /** Wartość pola formularza edycji psa. */
  function ef(name){ const el=viewEl.querySelector(`[data-ef="${name}"]`); return el?el.value.trim():''; }
  function efChecked(name){ const el=viewEl.querySelector(`[data-ef="${name}"]`); return !!(el && el.checked); }

  /** Otwiera pole "Twoje imię" przy jednym psie, zamykając wszystkie inne. */
  function openEntry(id, clickedBtn){
    viewEl.querySelectorAll('.entry').forEach(el=>el.classList.add('hidden'));
    viewEl.querySelectorAll('[data-act="reserve"]').forEach(b=>b.classList.remove('hidden'));
    const entry = viewEl.querySelector(`[data-entry="${id}"]`);
    const input = viewEl.querySelector(`[data-input="${id}"]`);
    if(!entry || !input){ render(); return; }   // DOM nieaktualny — przerysuj zamiast wybuchać
    invalidateHtml();            // DOM zmieniony poza render() — cache HTML nieaktualny
    entry.classList.remove('hidden');
    clickedBtn.classList.add('hidden');
    if(!input.value && lastWho) input.value = lastWho;   // podpowiedź z tej sesji
    input.focus();
    if(input.value) input.select();                      // ...łatwa do nadpisania
  }

  /** Zmiana godziny czyszczenia i przełącznik „nigdy nie znika" — to 'change', nie 'click'. */
  viewEl.addEventListener('change',e=>{
    if(e.target.matches && e.target.matches('[data-ef="noteForever"]')){
      // notatka na stałe nie ma terminu — pole daty wyłączamy, żeby nie udawało, że coś znaczy
      const until = viewEl.querySelector('[data-ef="noteUntil"]');
      if(until) until.disabled = e.target.checked;
      return;
    }
    if(e.target.id!=='resetHour') return;
    const h = Number(e.target.value);
    state.resetHour = h; showResetHour();          // optymistycznie: etykiety od razu
    enqueue('setResetHour',[h,state.pin],{key:'settings',reconcile:res=>{
      applyFull_(res);
      fetchDiag();                                  // wyzwalacz mógł się przełożyć
    }});
  });

  viewEl.addEventListener('click',e=>{
    // podczas zaznaczania grupy stuknięcie w kafelek tylko go zaznacza — żadnych
    // rezerwacji ani spacerów „przy okazji", także z puszczenia przytrzymanego palca
    if(state.select){ try{ togglePick(e); }catch(err){ cancelSelect(); } return; }
    try{ handleAction(e); }
    catch(err){ toast('Coś poszło nie tak — spróbuj ponownie'); needRefresh=true; if(!isSending() && !queue.length) refresh(); }
  });

  function handleAction(e){
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.dataset.act;
    const id=btn.dataset.id?Number(btn.dataset.id):null;

    /* --- wolontariusze: psy --- */
    if(act==='reserve') openEntry(id, btn);
    if(act==='confirm'){
      const el=viewEl.querySelector(`[data-input="${id}"]`); const val=el.value.trim();
      if(!val){ el.focus(); return; }
      lastWho = val;
      doReserve(id, val);
    }
    if(act==='walk'){
      const dog=dogAt(id, state.date);
      if(dog && dog.group) doGroupWalk(dog.group); else doWalk(id);
    }
    if(act==='free') doFree(id);
    if(act==='undoFirst') doUndoFirst(id);

    /* --- wolontariusze: zadania (✕ ma własny data-act, więc tu nie wpada) --- */
    if(act==='taskToggle') doTaskToggle(id);

    /* --- tryb edycji (rzadkie akcje — pełna synchronizacja z serwerem) --- */
    if(act==='edit'){ state.editId=id; render(); }
    if(act==='editCancel'){ state.editId=null; render(); }
    if(act==='editSave'){
      const fields={name:ef('name'),ident:ef('ident'),box:ef('box'),dif:ef('dif'),
                    note:ef('note'),walks:Number(ef('walks'))===2?2:1,
                    noteUntil: efChecked('noteForever') ? NOTE_FOREVER : ef('noteUntil')};
      if(!fields.name && !fields.ident){ toast('Podaj imię lub nr identyfikacyjny'); return; }
      if(fields.noteUntil && !fields.note) fields.noteUntil='';   // termin bez notatki nic nie znaczy
      if(fields.noteUntil && fields.noteUntil!==NOTE_FOREVER && state.today && fields.noteUntil < state.today){
        toast('Data notatki nie może być z przeszłości'); return;
      }
      const dog=findDog(id);
      if(dog) Object.assign(dog, fields);           // optymistycznie od razu
      state.editId=null;
      render();
      enqueue('updateDog',[id,fields,state.pin],{key:keyDog(id),reconcile:applyFull_});
    }
    if(act==='remove'){
      const dog=findDog(id);
      if(!confirm('Usunąć psa: '+(dog?dogLabel(dog):'')+'?')) return;
      state.dogs=state.dogs.filter(x=>x.id!==id);   // optymistycznie znika od razu
      render();
      enqueue('removeDog',[id,state.pin],{reconcile:applyFull_});
    }
    if(act==='add'){
      const name=document.getElementById('newName').value.trim();
      const ident=document.getElementById('newIdent').value.trim();
      const box=document.getElementById('newBox').value.trim();
      const dif=document.getElementById('newDif').value;
      if(!name && !ident){ toast('Podaj imię lub nr identyfikacyjny'); document.getElementById('newName').focus(); return; }
      enqueue('addDog',[{name,ident,box,dif},state.pin],{reconcile:applyFull_});
    }
    if(act==='taskAdd'){
      const el=document.getElementById('newTask'); const text=el.value.trim();
      if(!text){ el.focus(); return; }
      const dateEl=document.getElementById('newTaskDate');
      const date=(dateEl && dateEl.value) || state.bizDate;
      if(state.bizDate && date < state.bizDate){ toast('Zadanie nie może być na dzień, który już minął'); return; }
      el.value='';
      enqueue('addTask',[text,state.pin,date],{reconcile:res=>{
        applyFull_(res);
        if(isFuture(date)) toast('Zaplanowane ' + taskPlanned({date}));
      }});
    }
    if(act==='allWalks'){
      const w = Number(btn.dataset.walks)===2 ? 2 : 1;
      if(!confirm(w===2 ? 'Ustawić DWA spacery dziennie dla wszystkich psów?'
                        : 'Wrócić do JEDNEGO spaceru dziennie dla wszystkich psów?')) return;
      enqueue('setAllWalks',[w,state.pin],{reconcile:res=>{
        applyFull_(res);
        toast(w===2 ? 'Wszystkie psy: 2 spacery' : 'Wszystkie psy: 1 spacer');
      }});
    }
    if(act==='taskRemove'){
      const t=state.tasks.find(x=>x.id===id);
      if(!confirm('Usunąć zadanie: '+(t?t.text:'')+'?')) return;
      state.tasks=state.tasks.filter(x=>x.id!==id);   // optymistycznie
      render();
      enqueue('removeTask',[id,state.pin],{reconcile:applyFull_});
    }
  }

  viewEl.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    // przycisk mógł zniknąć między renderami — brak guzika nie może wywalić handlera
    const hit = sel => { const b = viewEl.querySelector(sel); if(b) b.click(); };
    if(e.target.matches('[data-input]')) hit(`[data-act="confirm"][data-id="${e.target.dataset.input}"]`);
    if(e.target.id==='newName'||e.target.id==='newIdent'||e.target.id==='newBox') hit('[data-act="add"]');
    if(e.target.id==='newTask') hit('[data-act="taskAdd"]');
  });

  /* =========================================================
     START + AUTO-ODŚWIEŻANIE + SAMOLECZENIE
     ========================================================= */
  /**
   * Stan wpisany w stronę przez serwer (bootJson_ w WebApp.gs) — lista rysuje się
   * od razu, bez drugiego przelotu do serwera po załadowaniu strony. Brak, pusto
   * albo coś nieczytelnego = zwykłe getData, jak dawniej.
   */
  function bootData(){
    try{
      const el = document.getElementById('boot');
      const d = el ? JSON.parse(el.textContent) : null;
      return d && Array.isArray(d.dogs) ? d : null;
    } catch(e){ return null; }
  }

  document.getElementById('today').textContent=todayStr();
  const boot = bootData();
  if(boot){ applyData(boot); render(); }
  else refresh();
  // co 15 s, ale tylko gdy karta widoczna, kolejka pusta i nikt nie pisze w polu
  setInterval(()=>{ if(!document.hidden && !isSending() && !queue.length && !busyEditing()) refresh(); }, 15000);
  // strażnik zawieszonych zapisów: cyklicznie...
  setInterval(checkStuck, 3000);
  // ...i przy każdym dotknięciu ekranu (działa nawet gdy przeglądarka uśpiła timery).
  // Przy okazji każde dotknięcie odsuwa przestawienie listy — patrz markTap().
  function onTouch(){ checkStuck(); markTap(); }
  document.addEventListener('pointerdown', onTouch, true);
  document.addEventListener('touchstart', onTouch, true);
  // powrót do karty (np. odblokowanie telefonu): najpierw ratuj zawieszony zapis, potem odśwież
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    checkStuck();
    if(!isSending() && !queue.length && !busyEditing()) refresh();
  });
</script>

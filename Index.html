<!DOCTYPE html>
<html lang="pl">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root{
    --paper:#f7f4ec; --card:#fffdf8; --ink:#20271f; --muted:#7c8377; --line:#e4dfd2;
    --forest:#33503f; --honey:#c47f2c; --honey-soft:#f6e9d4;
    --easy:#3f9e57; --med:#d99a1c; --hard:#cf4a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{max-width:520px;margin:0 auto;padding:0 16px 48px;}

  header{padding:16px 2px 4px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--forest);font-weight:700;}
  .titlerow{display:flex;align-items:center;gap:10px;}
  h1{font-size:26px;letter-spacing:-.02em;margin:3px 0 6px;font-weight:800;flex:1;}
  .gear{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    font-size:17px;cursor:pointer;flex:none;}
  .gear.on{background:var(--forest);color:#fff;border-color:var(--forest);}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;}
  .reset-note{display:inline-flex;align-items:center;gap:5px;background:#e2ebe3;color:var(--forest);
    font-weight:600;padding:3px 9px;border-radius:20px;font-size:12px;}
  .sync{font-size:11.5px;color:var(--muted);margin-left:auto;}

  .pinrow{display:flex;gap:7px;margin:12px 0 0;}
  .pinrow input{flex:1;font-family:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--forest);
    border-radius:10px;outline:none;}
  .pinrow button{background:var(--forest);color:#fff;border:none;font-family:inherit;font-weight:700;
    padding:0 16px;border-radius:10px;cursor:pointer;}
  .pinerr{color:var(--hard);font-size:12.5px;margin-top:5px;font-weight:600;}

  .tabs{display:flex;gap:6px;margin:14px 0 4px;}
  .tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .diflegend{display:flex;gap:14px;margin:10px 2px 2px;font-size:12px;color:var(--muted);}
  .diflegend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;}

  .count{margin:12px 2px 4px;font-size:13px;color:var(--muted);}
  .count b{color:var(--ink);font-weight:700;}

  ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .dog{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;}
  .dog.walked{opacity:.6;}
  .row{display:flex;align-items:center;gap:10px;}
  .name{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .name.done{text-decoration:line-through;text-decoration-color:#aeb8b0;}
  .dif{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .flex{flex:1;}
  .resv-pill{font-size:11px;font-weight:700;color:#6b4a14;background:var(--honey-soft);padding:2px 8px;border-radius:6px;}

  .btn{border:none;font-family:inherit;font-weight:700;cursor:pointer;border-radius:10px;
    transition:transform .05s;white-space:nowrap;}
  .btn:active{transform:scale(.96);}
  .btn[disabled]{opacity:.5;pointer-events:none;}
  .reserve{background:var(--honey);color:#fff;font-size:14px;padding:9px 15px;}
  .walk{background:var(--ink);color:#fff;font-size:13px;padding:8px 13px;}
  .ghost{background:transparent;color:var(--muted);font-size:12.5px;padding:6px 8px;}
  .del{background:transparent;color:var(--hard);font-size:13px;padding:6px 8px;font-weight:800;}

  .status{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .who{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);}
  .who .dot{background:currentColor;width:8px;height:8px;}
  .spacer{margin-left:auto;}

  .entry{margin-top:10px;display:flex;gap:8px;}
  .entry input{flex:1;font-family:inherit;font-size:15px;padding:10px 12px;
    border:1.5px solid var(--forest);border-radius:10px;background:#fff;color:var(--ink);outline:none;}
  .hidden{display:none;}

  .adminbox{margin-top:14px;background:#eef3ee;border:1px solid #cfdccf;border-radius:12px;padding:13px;}
  .adminbox h3{font-size:13px;color:var(--forest);margin-bottom:9px;letter-spacing:.02em;}
  .adminrow{display:flex;gap:7px;}
  .adminrow input{flex:1;font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid #bcccbc;border-radius:9px;outline:none;}
  .adminrow select{font-family:inherit;font-size:13px;padding:9px 8px;border:1px solid #bcccbc;border-radius:9px;background:#fff;}
  .add-btn{background:var(--forest);color:#fff;font-size:14px;padding:0 15px;}

  .hist-day{margin-top:14px;}
  .hist-date{font-size:13px;font-weight:800;color:var(--forest);margin-bottom:6px;text-transform:capitalize;}
  .hist-item{display:flex;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);}
  .hist-item b{font-weight:700;}
  .hist-item .t{margin-left:auto;color:var(--muted);font-size:12.5px;}
  .empty{color:var(--muted);font-size:13.5px;padding:24px 4px;text-align:center;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hard);color:#fff;
    font-size:13px;font-weight:600;padding:9px 15px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}

  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.55;}
  footer b{color:var(--ink);}
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Grupa G13 · schronisko</div>
    <div class="titlerow">
      <h1>Spacery</h1>
      <button class="gear" id="gear" title="Tryb prowadzącej">⚙️</button>
    </div>
    <div class="meta">
      <span id="today">…</span>
      <span class="reset-note">↺ czyści się o 22:00</span>
      <span class="sync" id="sync"></span>
    </div>
    <div class="pinrow hidden" id="pinrow">
      <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN prowadzącej">
      <button id="pinOk">OK</button>
    </div>
    <div class="pinerr hidden" id="pinErr">Zły PIN.</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Dziś</button>
    <button class="tab" data-tab="history">Historia</button>
  </div>

  <div id="view"><div class="empty">Ładowanie…</div></div>

  <footer>
    <b>Kolor po lewej = trudność psa.</b> <b>Zarezerwuj</b> = biorę go dziś. <b>Wyprowadzony ✓</b> = spacer odbyty, wpada do historii.
    Psy dodaje i usuwa tylko prowadząca i dwie wyznaczone osoby (⚙️, PIN). Lista zeruje się co wieczór o 22:00.
  </footer>

  <div class="toast" id="toast"></div>

<script>
  const DIF = {
    easy:{label:"łatwy", color:"#3f9e57"},
    med :{label:"wymagający", color:"#d99a1c"},
    hard:{label:"bardzo wymagający", color:"#cf4a3a"},
  };

  const state = { dogs:[], history:[], view:"today", admin:false, pin:null, loaded:false };
  let inFlight = 0;
  const viewEl = document.getElementById('view');
  const gear   = document.getElementById('gear');

  function todayStr(){
    try{return new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
    catch(e){return "dziś";}
  }
  function fmtDate(iso){
    try{return new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(iso));}
    catch(e){return iso;}
  }
  function toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2600);
  }
  function busyEditing(){
    if(document.querySelector('.entry:not(.hidden)')) return true;
    const a=document.activeElement;
    return !!(a && (a.tagName==='INPUT' || a.tagName==='SELECT'));
  }
  function setSync(txt){ document.getElementById('sync').textContent = txt; }

  /* ---- komunikacja z serwerem ---- */
  function call(fn, args, onOk){
    inFlight++; setSync('zapisywanie…');
    google.script.run
      .withSuccessHandler(res=>{ inFlight--; if(inFlight<=0) setSync(''); if(onOk) onOk(res); })
      .withFailureHandler(err=>{ inFlight--; setSync(''); toast('Nie udało się — spróbuj ponownie'); })
      [fn].apply(google.script.run, args);
  }

  function refresh(){
    google.script.run.withSuccessHandler(res=>{
      state.dogs=res.dogs; state.loaded=true; render();
    }).withFailureHandler(()=>{ if(!state.loaded) viewEl.innerHTML='<div class="empty">Brak połączenia. Odśwież stronę.</div>'; })
      .getData();
    if(state.view==='history'){
      google.script.run.withSuccessHandler(res=>{ state.history=res.history; if(state.view==='history') render(); }).getHistory();
    }
  }

  /* ---- render ---- */
  function render(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.view));
    gear.classList.toggle('on',state.admin);
    viewEl.innerHTML = state.view==='today' ? renderToday() : renderHistory();
  }

  function renderToday(){
    if(!state.loaded) return '<div class="empty">Ładowanie…</div>';
    const d=state.dogs;
    const r=d.filter(x=>x.status==='reserved').length;
    const w=d.filter(x=>x.status==='walked').length;
    const f=d.filter(x=>x.status==='free').length;

    let html=`
      <div class="diflegend">
        <span><span class="dot" style="background:${DIF.easy.color}"></span>łatwy</span>
        <span><span class="dot" style="background:${DIF.med.color}"></span>wymagający</span>
        <span><span class="dot" style="background:${DIF.hard.color}"></span>b. wymagający</span>
      </div>
      <div class="count"><b>${r}</b> zarezerwowane · <b>${w}</b> wyprowadzone · <b>${f}</b> wolne</div>
      <ul>`;

    d.forEach(dog=>{
      const dm=DIF[dog.dif]||DIF.easy;
      const difChip=`<span class="dif" style="color:${dm.color};background:${dm.color}1a">
        <span class="dot" style="background:${dm.color}"></span>${dm.label}</span>`;
      const del = state.admin ? `<button class="btn del" data-act="remove" data-id="${dog.id}">✕</button>` : '';

      if(dog.status==='free'){
        html+=`<li class="dog" style="border-left-color:${dm.color}">
          <div class="row"><span class="name">${esc(dog.name)}</span><span class="flex"></span>${difChip}${del}</div>
          <div class="status"><button class="btn reserve" data-act="reserve" data-id="${dog.id}">Zarezerwuj</button></div>
          <div class="entry hidden" data-entry="${dog.id}">
            <input type="text" placeholder="Twoje imię" data-input="${dog.id}">
            <button class="btn reserve" data-act="confirm" data-id="${dog.id}">OK</button>
          </div></li>`;
      } else if(dog.status==='reserved'){
        html+=`<li class="dog" style="border-left-color:${dm.color}">
          <div class="row"><span class="name">${esc(dog.name)}</span>
            <span class="resv-pill">zarezerwowany</span><span class="flex"></span>${difChip}${del}</div>
          <div class="status">
            <span class="who"><span class="dot"></span>${esc(dog.who)}</span><span class="spacer"></span>
            <button class="btn walk" data-act="walk" data-id="${dog.id}">Wyprowadzony ✓</button>
            <button class="btn ghost" data-act="free" data-id="${dog.id}">Zwolnij</button>
          </div></li>`;
      } else {
        html+=`<li class="dog walked" style="border-left-color:${dm.color}">
          <div class="row"><span class="name done">${esc(dog.name)}</span><span class="flex"></span>${difChip}${del}</div>
          <div class="status"><span class="who">✓ ${esc(dog.who)} · ${esc(dog.time)}</span>
            <button class="btn ghost spacer" data-act="free" data-id="${dog.id}">Cofnij</button>
          </div></li>`;
      }
    });
    html+=`</ul>`;

    if(state.admin){
      html+=`<div class="adminbox">
        <h3>TRYB PROWADZĄCEJ — dodaj psa</h3>
        <div class="adminrow">
          <input type="text" id="newName" placeholder="Imię psa">
          <select id="newDif">
            <option value="easy">łatwy</option>
            <option value="med">wymagający</option>
            <option value="hard">b. wymagający</option>
          </select>
          <button class="btn add-btn" data-act="add">Dodaj</button>
        </div>
      </div>`;
    }
    return html;
  }

  function renderHistory(){
    if(!state.history.length) return '<div class="empty">Brak zapisanych dni jeszcze.</div>';
    const byDate={};
    state.history.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
    const dates=Object.keys(byDate).sort().reverse();
    let html='';
    dates.forEach(dt=>{
      const items=byDate[dt];
      html+=`<div class="hist-day"><div class="hist-date">${fmtDate(dt)} — ${items.length} spacerów</div>`;
      items.forEach(e=>{ html+=`<div class="hist-item"><b>${esc(e.name)}</b> — ${esc(e.who)}<span class="t">${esc(e.time)}</span></div>`; });
      html+=`</div>`;
    });
    return html;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ---- zdarzenia ---- */
  document.querySelector('.tabs').addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t) return;
    state.view=t.dataset.tab; render();
    if(state.view==='history') google.script.run.withSuccessHandler(res=>{state.history=res.history; render();}).getHistory();
  });

  gear.addEventListener('click',()=>{
    if(state.admin){ state.admin=false; render(); return; }
    document.getElementById('pinrow').classList.toggle('hidden');
    document.getElementById('pinErr').classList.add('hidden');
    const p=document.getElementById('pinInput'); p.value=''; p.focus();
  });
  document.getElementById('pinOk').addEventListener('click',tryPin);
  document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
  function tryPin(){
    const pin=document.getElementById('pinInput').value.trim();
    google.script.run.withSuccessHandler(ok=>{
      if(ok){ state.admin=true; state.pin=pin;
        document.getElementById('pinrow').classList.add('hidden');
        document.getElementById('pinErr').classList.add('hidden'); render();
      } else { document.getElementById('pinErr').classList.remove('hidden'); }
    }).checkPin(pin);
  }

  viewEl.addEventListener('click',e=>{
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.dataset.act;
    const id=btn.dataset.id?Number(btn.dataset.id):null;

    if(act==='reserve'){
      viewEl.querySelector(`[data-entry="${id}"]`).classList.remove('hidden');
      btn.classList.add('hidden');
      viewEl.querySelector(`[data-input="${id}"]`).focus();
    }
    if(act==='confirm'){
      const el=viewEl.querySelector(`[data-input="${id}"]`); const val=el.value.trim();
      if(!val){ el.focus(); return; }
      call('reserve',[id,val],res=>{ state.dogs=res.dogs; render(); });
    }
    if(act==='walk') call('markWalked',[id,''],res=>{ state.dogs=res.dogs; render(); });
    if(act==='free') call('setFree',[id],res=>{ state.dogs=res.dogs; render(); });

    if(act==='remove'){
      const dog=state.dogs.find(x=>x.id===id);
      if(!confirm('Usunąć psa: '+(dog?dog.name:'')+'?')) return;
      call('removeDog',[id,state.pin],res=>{ state.dogs=res.dogs; render(); });
    }
    if(act==='add'){
      const name=document.getElementById('newName').value.trim();
      const dif=document.getElementById('newDif').value;
      if(!name){ document.getElementById('newName').focus(); return; }
      call('addDog',[name,dif,state.pin],res=>{ state.dogs=res.dogs; render(); });
    }
  });

  viewEl.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('[data-input]')){
      const id=e.target.dataset.input;
      viewEl.querySelector(`[data-act="confirm"][data-id="${id}"]`).click();
    }
    if(e.key==='Enter'&&e.target.id==='newName'){
      viewEl.querySelector('[data-act="add"]').click();
    }
  });

  /* ---- start + auto-odświeżanie ---- */
  document.getElementById('today').textContent=todayStr();
  refresh();
  setInterval(()=>{ if(inFlight===0 && !busyEditing()) refresh(); }, 15000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<base target="_top">
<meta charset="UTF-8">
<?!= include('Styles'); ?>
</head>
<body>

  <div class="envbar hidden" id="envbar">⚠ Środowisko testowe · zmiany nie dotyczą prawdziwych psów</div>

  <header>
    <div class="eyebrow">Grupa G13 · schronisko</div>
    <div class="titlerow">
      <h1>Spacery</h1>
      <button class="gear" id="gear" title="Tryb edycji">⚙️</button>
    </div>
    <div class="meta">
      <span id="today">…</span>
      <span class="reset-note" id="resetNote">↺ czyści się o 22:00</span>
    </div>
    <div class="pinrow hidden" id="pinrow">
      <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN">
      <button id="pinOk">OK</button>
    </div>
    <div class="pinerr hidden" id="pinErr">Zły PIN.</div>
  </header>

  <!-- Strzałki rysujemy sami: znaki ← → każdy telefon bierze ze swojego fontu, często
       z różnymi marginesami, i wtedy para wygląda krzywo. Prawa to dokładne lustro lewej. -->
  <div class="datebar" id="dateBar">
    <button class="daynav" id="prevDay" aria-label="Poprzedni dzień"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5 8.5 12 15.5 19"/></svg></button>
    <button class="daylabel" id="dayLabel" title="Wróć do bieżącego dnia">
      <span class="dayname" id="dayName">…</span>
      <span class="dayrel" id="dayRel"></span>
    </button>
    <button class="daynav" id="nextDay" aria-label="Następny dzień"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5 15.5 12 8.5 19"/></svg></button>
  </div>

  <div class="tabs hidden" id="adminTabs">
    <button class="tab active" data-tab="today">Lista</button>
    <button class="tab hidden" data-tab="diag" id="tabDiag">Panel</button>
  </div>

  <div id="view"><div class="empty">Ładowanie…</div></div>

  <div class="toast" id="toast"></div>

  <!-- dymek „Zapisuję…" / „Aktualizuję…" — stuknięcie przyjęte, trwa zapis albo przestawienie listy -->
  <div class="busy hidden" id="busy" role="status" aria-live="polite"><span id="busyTxt">Zapisuję</span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>

  <!-- tryb zaznaczania psów do spaceru grupowego (przytrzymanie kafelka) -->
  <div class="selectbar hidden" id="selectBar">
    <span class="info" id="selInfo">Zaznacz psy do wspólnego spaceru</span>
    <button class="btn ghost" id="selCancel">Anuluj</button>
    <button class="btn ghost hidden" id="selDissolve">Rozwiąż</button>
    <button class="btn add-btn" id="selGroup" disabled>Grupa</button>
  </div>

  <script type="application/json" id="boot"><?!= boot ?></script>
  <!-- chwila oddania strony przez serwer (doGet) — dziennik spowolnień liczy od niej dojście strony -->
  <script type="application/json" id="served"><?!= served ?></script>
